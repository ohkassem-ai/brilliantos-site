<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pricing — BrilliantOS</title>
  <meta name="description" content="BrilliantOS engagement model: Map, Build, Operate. Fixed fees, no per-seat tax, no procurement theatre." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:title" content="Pricing — BrilliantOS" />
  <meta property="og:description" content="Fixed fees. Refunded if we miss. Map, Build, Operate." />
  <meta property="og:type" content="website" />

  <script>
  try {
    const t = JSON.parse(localStorage.getItem('brilliantos-tweaks') || 'null');
    if (t) {
      if (t.palette) document.documentElement.setAttribute('data-palette', t.palette);
      if (t.display) document.documentElement.setAttribute('data-display', t.display);
      document.documentElement.setAttribute('data-theme', t.dark ? 'dark' : 'light');
      document.addEventListener('DOMContentLoaded', () => {
        if (t.density) document.body.setAttribute('data-density', t.density);
      });
    }
  } catch(e){}
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="sections-hero.jsx"></script>
  <script type="text/babel" src="sections-automate.jsx"></script>
  <script type="text/babel" src="sections-compare.jsx"></script>
  <script type="text/babel" src="sections-roi.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* Compact hero just for the Pricing page */
    function PricingHero() {
      return (
        <section className="section" style={{ paddingBottom: 40 }}>
          <div className="container">
            <Reveal>
              <div className="eyebrow" style={{ marginBottom: 24 }}>Pricing · engagement model</div>
            </Reveal>
            <Reveal delay={80}>
              <h1 className="display" style={{
                fontSize: 'clamp(56px, 9vw, 132px)',
                margin: 0, lineHeight: 0.98, letterSpacing: '-0.02em',
                maxWidth: '14ch'
              }}>
                Fixed fees.<br/>
                <span className="italic" style={{ color: 'var(--accent)' }}>Refunded if we miss.</span>
              </h1>
            </Reveal>
            <Reveal delay={160}>
              <p className="lede" style={{ marginTop: 32, maxWidth: '60ch' }}>
                Three phases — Map, Build, Operate. Fixed scope. Fixed price. No
                per-seat tax. No procurement theatre. Five founding-cohort seats
                priced at a fraction of standard, locked for life.
              </p>
            </Reveal>
            <Reveal delay={220}>
              <div className="mono tiny muted" style={{ marginTop: 40, display: 'flex', gap: 28, flexWrap: 'wrap', letterSpacing: '.08em' }}>
                <span>● FIXED FEES</span>
                <span>● NO SEAT TAX</span>
                <span>● PAID ON OUTCOMES</span>
                <span>● REFUND IF WE MISS</span>
              </div>
            </Reveal>
          </div>
        </section>
      );
    }

    /* Comparison: BrilliantOS vs SaaS vs Agency */
    function PricingCompare() {
      const rows = [
        { k: 'Built for your workflow?',  a: 'Yes — bespoke agents around your process', b: 'No — you bend to its data model', c: 'Sometimes — usually generic playbooks' },
        { k: 'Pricing model',              a: 'Fixed fee. Refunded if KPIs missed.',     b: 'Per seat, per month, forever',     c: 'Hourly retainer, T&M overruns'        },
        { k: 'Who you work with',          a: 'The engineer who built it',              b: 'A CSM translating to the team',    c: 'Account director + offshore team'     },
        { k: 'Time to first value',        a: '4–6 weeks',                              b: '3–6 months of implementation',     c: '3–9 months',                          },
        { k: 'Scales as you hire?',        a: 'Yes — agents do the work, not seats',    b: 'Cost scales linearly with headcount', c: 'Yes — but you pay every hour'      },
        { k: 'Paid on outcomes?',          a: 'Yes — refund if we miss agreed KPIs',     b: 'No — paid for access regardless',   c: 'No — paid for time regardless'       },
      ];
      return (
        <section className="section" style={{ borderTop: '0.5px solid var(--rule)' }}>
          <div className="container">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 60, alignItems: 'end', marginBottom: 48 }}>
              <div>
                <Reveal><div className="eyebrow" style={{ marginBottom: 20 }}>02 / Compare</div></Reveal>
                <Reveal delay={80}>
                  <h2 className="display h2" style={{ margin: 0 }}>
                    The third option.<br/>
                    <span className="italic" style={{ color: 'var(--accent)' }}>Custom — without the agency tax.</span>
                  </h2>
                </Reveal>
              </div>
              <Reveal delay={160}>
                <p className="lede">
                  Off-the-shelf SaaS forces your process into someone else's data
                  model. Agencies bill you for the hours, not the result. We sit
                  in between — bespoke build, fixed fee, refunded if we miss.
                </p>
              </Reveal>
            </div>

            <Reveal delay={200}>
              <div style={{
                border: '0.5px solid var(--rule)', borderRadius: 16, overflow: 'hidden',
                background: 'var(--bg)'
              }}>
                <div style={{
                  display: 'grid', gridTemplateColumns: '1.2fr 1.4fr 1.2fr 1.4fr',
                  background: 'var(--ink)', color: 'var(--bg)',
                  padding: '18px 24px', alignItems: 'center', gap: 16
                }} className="mono tiny" >
                  <div style={{ letterSpacing: '.12em', opacity: .7 }}></div>
                  <div style={{ letterSpacing: '.12em', color: 'oklch(0.85 0.13 65)' }}>● BRILLIANTOS</div>
                  <div style={{ letterSpacing: '.12em', opacity: .6 }}>○ ENTERPRISE SAAS</div>
                  <div style={{ letterSpacing: '.12em', opacity: .6 }}>○ AI AGENCY / CONSULTANCY</div>
                </div>
                {rows.map((r, i) => (
                  <div key={r.k} style={{
                    display: 'grid', gridTemplateColumns: '1.2fr 1.4fr 1.2fr 1.4fr',
                    padding: '22px 24px', gap: 16, alignItems: 'start',
                    borderBottom: i < rows.length - 1 ? '0.5px solid var(--rule)' : 'none',
                  }}>
                    <div className="mono tiny muted" style={{ letterSpacing: '.06em', textTransform: 'uppercase' }}>{r.k}</div>
                    <div style={{ fontSize: 15, color: 'var(--ink)', fontWeight: 500 }}>{r.a}</div>
                    <div className="small muted">{r.b}</div>
                    <div className="small muted">{r.c}</div>
                  </div>
                ))}
              </div>
            </Reveal>
          </div>
        </section>
      );
    }

    /* FAQ */
    function PricingFAQ() {
      const qs = [
        { q: 'Why Map first?',
          a: 'Two weeks, $2.5k (free for cohort), and you walk away with a written diagnosis whether or not you keep going. We won\'t scope a Build until we\'ve seen your workflow with our own eyes.' },
        { q: 'What if you miss the KPIs?',
          a: 'We agree the success metrics with you up front, in writing, before Build begins. If we miss them, we refund Build in full and you keep everything we shipped. The specifics depend on your business — we settle them together during Map.' },
        { q: 'Do you white-label or resell SaaS?',
          a: 'No. We build on the model layer (Anthropic, OpenAI, open weights) and ship AI-native systems that replace the tools you\'re paying for today — Xero, HubSpot, the lot. We retain the underlying IP so we can keep improving it across the cohort; you get a fixed-fee, perpetual licence to use what we build, your data is yours, and we will hand over an export at any time.' },
        { q: 'What does Operate actually do?',
          a: 'On-call engineer with a same-business-day SLA, monthly tuning + new agents within scope, quarterly business review, and a Slack channel into the engineer who built it. Most clients add 2–4 new workflows a year inside Operate.' },
        { q: 'Can we stop at Build?',
          a: 'Yes. Most don\'t — autopilots drift if no one tunes them — but you can self-host what we ship. Source code, infra, documentation all transfer.' },
        { q: 'How does the founding cohort work?',
          a: 'You pay cohort pricing for Map ($0), Build ($5k), and Operate ($1k/mo) — locked at those rates for life, no renegotiation. In return: a public case study, a quarterly product input call, and a logo on the site.' },
      ];
      const [open, setOpen] = useState(0);
      return (
        <section className="section" style={{ borderTop: '0.5px solid var(--rule)', background: 'var(--bg-2)' }}>
          <div className="container" style={{ maxWidth: 900 }}>
            <Reveal><div className="eyebrow" style={{ marginBottom: 20 }}>04 / Questions</div></Reveal>
            <Reveal delay={80}>
              <h2 className="display h2" style={{ margin: '0 0 48px' }}>
                The honest{' '}
                <span className="italic" style={{ color: 'var(--accent)' }}>questions.</span>
              </h2>
            </Reveal>
            <div style={{
              border: '0.5px solid var(--rule)', borderRadius: 16,
              background: 'var(--bg)', overflow: 'hidden'
            }}>
              {qs.map((it, i) => {
                const isOpen = open === i;
                return (
                  <div key={i} style={{ borderBottom: i < qs.length - 1 ? '0.5px solid var(--rule)' : 'none' }}>
                    <button
                      onClick={() => setOpen(isOpen ? -1 : i)}
                      style={{
                        width: '100%', background: 'transparent', border: 'none',
                        textAlign: 'left', cursor: 'pointer', padding: '24px 28px',
                        display: 'grid', gridTemplateColumns: '32px 1fr 24px',
                        gap: 18, alignItems: 'center', color: 'var(--ink)',
                        fontFamily: 'var(--sans)', fontSize: 18, fontWeight: 500
                      }}
                    >
                      <span className="mono tiny" style={{ color: 'var(--accent)', letterSpacing: '.1em' }}>0{i+1}</span>
                      <span>{it.q}</span>
                      <span className="mono" style={{
                        fontSize: 18, color: 'var(--muted)',
                        transform: isOpen ? 'rotate(45deg)' : 'rotate(0)',
                        transition: 'transform .25s ease'
                      }}>+</span>
                    </button>
                    {isOpen && (
                      <div style={{
                        padding: '0 28px 28px 78px', color: 'var(--ink-2)',
                        fontSize: 16, lineHeight: 1.55, maxWidth: '70ch'
                      }}>{it.a}</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    function App() {
      return (
        <>
          <Nav current="pricing" />
          <main>
            <PricingHero />
            <PricingCompare />
            <Pricing />
            <PricingFAQ />
            <FinalCTA />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
