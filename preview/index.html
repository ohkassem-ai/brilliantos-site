{"id":"FM-30","sys":"GEN","tag":"11MKW10AP001","eq":"Seal oil system (pumps, differential-pressure regulator, shaft seal rings)","fn":"Keep seal-oil pressure above casing hydrogen pressure at both shaft seals at all times, so hydrogen stays inside the generator","mode":"Seal-oil supply or a shaft seal fails — hydrogen leaks out along the shaft","mech":"Seal ring wear; pressure-control failure","cause":"Worn shaft seal rings; seal-oil differential-pressure regulator drifts or sticks; normal seal-oil supply lost and the emergency DC seal oil pump does not start; dirty oil (see FM-25)","local":"Hydrogen escapes at the shaft ends into the bearing and collector areas; casing pressure falls","plant":"Hydrogen can collect and ignite: fire or explosion at the generator end. A fatality is possible for anyone nearby, and the unit is out for months.","sBasis":"Safety: hydrogen fire or explosion — fatality possible","det":"H₂ pressure and purity logged daily. The leak rate is not calculated or trended. Fixed H₂ detectors alarm only after gas has escaped.","ctrl":"Emergency DC seal oil pump tested only occasionally. Seal rings checked only when the generator is opened.","hidden":false,"iso":"ELU","s":5,"o":1,"d":3,"rs":5,"ro":1,"rd":2,"why":"Hydrogen cooling is built into this generator. Daily leak trending, a tested backup seal-oil pump and calibrated detectors make a release rare. Maintenance cannot lower the harm of an ignition, so the Plant Manager must sign to accept it."},
{"id":"FM-31","sys":"GEN","tag":"11MKA10HA001","eq":"Generator stator winding (GE 324-series, H₂-cooled)","fn":"Carry full rated stator current at 15.75 kV with winding temperatures inside the insulation class limit","mode":"Stator insulation breaks down — stator ground fault","mech":"Insulation ageing (heat, partial discharge, contamination)","cause":"Thermal ageing at high summer load with warm cooling gas (warm seawater, see FM-27); oil contamination from the seal-oil system (FM-30); partial discharge; loose wedges or end windings","local":"Insulation punctures; stator earth-fault protection trips the unit","plant":"Stator rewind with new bars made to order: typically 5–6 months out of service, at a cost of several million KD.","sBasis":"Production: > 3 months on one GT (stator rewind, bars made to order)","det":"Stator temperature sensors are trended. Insulation tests only at the generator major, about every 8 years. No online partial discharge monitoring.","ctrl":"Generator kept inside its capability curve. No check for seal-oil contamination between majors.","hidden":false,"site":"Gulf seawater","iso":"BRD","s":5,"o":1,"d":4,"rs":4,"ro":1,"rd":1,"why":"Severity drops from 5 to 4 only because spare bars and a rewind contract are ready (A-31d); a rewind still takes about 10 weeks. Online monitoring gives months of warning, but stator failures are already rare, so likelihood stays 1."},
{"id":"FM-32","sys":"GEN","tag":"11MKC10GH001","eq":"Static excitation & voltage regulator (two channels)","fn":"Hold generator voltage and reactive power at set point, and transfer automatically to the healthy channel on a fault","mode":"One excitation channel fails; if the transfer also fails, loss of field trips the unit","mech":"Electronics or thyristor failure","cause":"Thyristor bridge or control card failure; cooling fan failure in a hot room; ageing power supplies","local":"Active channel lost; the standby channel takes over","plant":"Normally no effect. If both channels are lost, the unit trips on loss of excitation and restarts within a shift. In summer peak, any trip scores Minor.","sBasis":"Production: one unit trip during summer peak","det":"Channel fault alarm in the control room; diagnostics show the standby channel's health","ctrl":"Redundant channel with automatic transfer. Transfer not proven since commissioning.","hidden":false,"iso":"FTF","s":2,"o":2,"d":2,"rs":2,"ro":1,"rd":2,"keep":"Already Low on the owner matrix. The standby channel takes over by itself, and the alarm tells the operator. No new routine task: only prove the channel transfer once a year at a planned outage."},
{"id":"FM-33","sys":"GEN","tag":"11MKC20HA001","eq":"Collector rings, brush gear & housing air filters","fn":"Carry field current from the exciter to the rotor winding, with all brushes sharing current and no sparking","mode":"Brush sparking that grows into a collector-ring flashover","mech":"Contamination and uneven brush wear","cause":"Shamal dust and humidity in the collector housing; clogged housing air filters; uneven brush wear or spring pressure; carbon dust build-up","local":"Arcing burns brushes and ring surfaces; the field circuit opens","plant":"Unit trips on loss of field. Rings must be machined or replaced: 2–6 weeks out of service.","sBasis":"Production: 2 weeks–3 months on one GT (collector ring repair)","det":"Occasional look through the housing window. No thermography; brush length not recorded.","ctrl":"Brushes replaced when found worn short. Housing filters changed only at outages.","hidden":false,"site":"Shamal dust","iso":"BRD","s":4,"o":2,"d":4,"rs":4,"ro":1,"rd":3,"why":"Severity stays 4: a flashover still means ring repair and weeks out. Weekly checks and clean filters make it rare; a spare ring assembly is not justified at this likelihood."},
{"id":"FM-34","sys":"CTL","tag":"11BUA10GH001","eq":"125 V DC distribution & Mark VIe contact-input wiring (trip inputs)","fn":"Supply clean, floating 125 V DC to every trip and protective contact input, with no AC and no path to ground","mode":"Stray AC or a ground fault on the 125 V DC signal wiring: a trip or protection signal is read wrongly","mech":"AC ingress / insulation fault (design weakness)","cause":"No interposing relays where 240 V AC switchgear and motor control centre contacts feed DC inputs; failed surge suppressor; undocumented wiring changes since commissioning. All three units share this wiring design.","local":"An input chatters, gives a false trip, or stays blind. A second ground fault can bypass a contact or blow a DC fuse.","plant":"Spurious trips cost MW in summer. Worst credible: a protective input fails to act, for example the emergency DC lube oil pump start where it runs through a Mark VIe contact input (see FM-24). Bearing wipe and rotor damage: more than 3 months out of service.","sBasis":"Production: > 3 months on one GT (bearing and rotor damage if a protective input fails to act); likelihood 3 under the hidden-failure rule (demand × chance already failed unseen): protective DC inputs are called on at every trip and shutdown, and stray AC and earth faults are present but not alarmed today, so an input failing on demand is judged about once in 1¼–5 unit-years. The workshop should test this score first.","det":"The Mark VIe DC distribution board (JPDF) senses ground faults and AC on DC, but the alarms are not enabled or reviewed. Faults are found only after a trip or misoperation, and these inputs are needed at every shutdown and trip.","ctrl":"None effective. Wiring changes in GT panels are not controlled by MOC. As-built drawings are out of date.","hidden":true,"iso":"ERO","s":5,"o":3,"d":5,"rs":4,"ro":1,"rd":1,"why":"Likelihood drops two steps because the relays remove the AC path (a design change removes the cause), and live alarms warn early. Severity drops from 5 to 4 only because of the exchange rotor (A-SP1); a rotor repair still takes 6–8 weeks.","extraActs":["A-SP1"]},
{"id":"FM-35","sys":"CTL","tag":"11CJP50AH001","eq":"Control compartment (PEECC) air conditioning — single unit, no standby","fn":"Hold the control compartment inside the electronics' allowed temperature (per OEM) on a 50 °C day","mode":"Compartment cooling lost — electronics overheat and controller redundancy is lost","mech":"Overheating (single air conditioner, heat and dust)","cause":"Air conditioner trips on a 50 °C afternoon; condenser coils blocked by shamal dust; single unit with no standby; refrigerant leak","local":"Compartment temperature climbs within hours; input/output (I/O) packs and power supplies start to fail","plant":"All three control channels sit in the same room, so heat defeats the triple redundancy. The unit trips when a second channel fails. Several cards may fail together; the store holds one of each, so 3–7 days out.","sBasis":"Production: 3–14 days on one GT (trip, then several control cards from the OEM)","det":"Mark VIe diagnostic alarms once cards start to fail. Compartment temperature is seen only locally on rounds.","ctrl":"Air conditioner repaired on failure. Condenser coils cleaned only after it trips. Diagnostic alarms reviewed when noticed.","hidden":false,"site":"50 °C + dust","iso":"OHE","s":3,"o":3,"d":2,"rs":3,"ro":2,"rd":1},
{"id":"FM-36","sys":"FP","tag":"11CYE10GH001","eq":"Fire detection & CO₂ release panel, heat detectors & zone wiring","fn":"Release CO₂ and trip the unit only on a real fire in a turbine-package compartment","mode":"Spurious fire signal — the unit trips and CO₂ is released with no fire","mech":"Detector fault; moisture in wiring","cause":"Heat detector drift or failure; moisture in junction boxes in humid spells; loose connection in a hot compartment; one detector alone can release CO₂ (no voting)","local":"Fire trip and CO₂ release with no fire","plant":"Unit trips and the compartment is flooded. Restart waits for ventilation, a safe-entry check and CO₂ refill: 1–2 days lost. In summer peak, every trip counts.","sBasis":"Production: 8 h–3 days on one GT (trip, ventilation, CO₂ refill)","det":"Panel supervises the wiring for open circuits. Detectors are tested only at the yearly fire-contractor visit.","ctrl":"A single detector can release CO₂. Panel records are kept by the contractor, outside the CMMS. Junction boxes are not checked for moisture. CO₂ is locked out before anyone enters a compartment.","hidden":false,"site":"Humidity & salt","iso":"SPO","s":2,"o":3,"d":4,"rs":2,"ro":1,"rd":2,"why":"Likelihood drops two steps because voting is a design change: one faulty detector can no longer release CO₂."},
{"id":"FM-37","sys":"FP","tag":"11SGJ10BB001","eq":"CO₂ low-pressure refrigerated tank, release & selector valves","fn":"On a confirmed fire, discharge enough CO₂ (initial and extended discharge) to reach and hold the design concentration","mode":"CO₂ fails to discharge, or too little is discharged, on a real fire","mech":"Loss of stored CO₂; valve seizure","cause":"Tank refrigeration fails in summer heat and CO₂ vents through the relief valve; release (pilot) or selector valve stuck; blocked nozzles; compartment doors or dampers do not close","local":"No suppression, or concentration too low; the fire continues","plant":"Fire grows in the turbine compartment. A fatality is possible for anyone nearby; the unit is out for more than 3 months.","sBasis":"Safety: uncontrolled compartment fire — fatality possible","det":"Tank level and pressure gauges read locally, with no fixed schedule. Valves and dampers are tested only at the yearly contractor visit.","ctrl":"Yearly contractor inspection. Tank refrigeration units serviced only on failure.","hidden":true,"site":"50 °C ambient","iso":"FTF","s":5,"o":1,"d":4,"rs":5,"ro":1,"rd":3,"why":"A fire with no suppression is still catastrophic. Weekly checks and yearly tests at fire-code (NFPA 12) intervals keep a failed discharge rare. A second, independent suppression system would cost far more than the risk it removes."},
{"id":"FM-38","sys":"FP","tag":"11SAC10AN001","eq":"Turbine compartment vent fans (duty/standby) & dampers","fn":"Keep compartment air below the OEM temperature limit and dilute any gas leak, with one fan running and one ready","mode":"Ventilation flow lost — duty fan stops and the standby does not start, or a damper sticks closed","mech":"Bearing wear; damper seizure","cause":"Fan motor bearing failure or overheating in 50 °C air; standby fan failed unseen; damper actuator seized by dust; loss-of-flow switch fault","local":"Compartment temperature rises; gas dilution is reduced","plant":"The unit is shut down or trips on loss of ventilation or high compartment temperature. Restart within a shift once a fan runs. Gas-leak risk is analysed in FM-21.","sBasis":"Production: one unit trip during summer peak","det":"Loss-of-flow switch and compartment temperature alarm; the standby fan starts automatically","ctrl":"Standby fan with auto-start, but it is not tested. Dampers are not stroked. Fans repaired on failure.","hidden":false,"site":"50 °C ambient","iso":"LOO","s":2,"o":3,"d":2,"rs":2,"ro":2,"rd":1}];
const ACT = [{"id":"A-01a","fm":["FM-01"],"type":"PdM","reduces":"OD","title":"Trend final-filter ΔP and change elements on the trend","task":"CM-MBL-01 trends final-stage ΔP hourly from the historian: warning 50, action 60 mm H₂O (illustrative, below the Mark VIe alarm). At the action limit, or when the trend will reach it within 30 days, change the full element set at the next standstill. Record ΔP before and after.","freq":"Y","py":1,"win":"On CM-MBL-01 limit, planned Oct–Apr (standstill); latest date 15 Apr","cond":"STANDSTILL","craft":"MECH","crew":6,"hrs":16,"mat":26,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Mechanical maintenance","cm":"CM-MBL-01","steps":["Check CM-MBL-01: ΔP at 60 mm H₂O, or the trend reaching it within 30 days.","Plan the change at the next standstill (Oct–Apr) and reserve a full element set.","Stop the unit; permit to work and lockout; confirm the filter house is safe to enter.","Record ΔP before. Remove elements bank by bank; look for dust tracks on the clean-air side.","Fit new elements and check every seal seats. Remove all tools and debris from the clean-air plenum.","Return to service. Record ΔP at base load and reset the trend baseline."],"record":["Final-stage ΔP before (mm H₂O)","Final-stage ΔP after, at base load (mm H₂O)","Elements replaced (number)","Collapsed or torn elements found (number)","Dust on clean-air side (yes/no, where)"]},
{"id":"A-01b","fm":["FM-01"],"type":"PM","reduces":"O","title":"Change pre-filter pads in March and September","task":"Replace all pre-filter pads bank by bank from the outside walkway, with the unit running. Do it in March (before the shamal season) and September (after it). Record pre-filter ΔP before and after; a clear drop is expected.","freq":"6M","win":"Mar & Sep","cond":"RUN","craft":"MECH","crew":3,"hrs":8,"mat":3.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-15","resp":"Mechanical maintenance","steps":["Check the forecast: no dust storm expected; work from the outside walkway with harnesses.","Record pre-filter and final-stage ΔP.","Replace pads one bank at a time so the unit keeps running.","Check pad frames and seals: no gaps at the edges.","Record pre-filter ΔP after; bag the old pads for disposal."],"record":["Pre-filter ΔP before (mm H₂O)","Pre-filter ΔP after (mm H₂O)","Pads replaced (number)","Final-stage ΔP the same day (mm H₂O)"]},
{"id":"A-01c","fm":["FM-01"],"type":"Design","reduces":"O","title":"Add a coalescing pre-filter stage to the filter houses","task":"Add a coalescing stage ahead of the final elements so humid dust is caught before it cakes. Check its added clean ΔP against the output it costs (0.35 % per 25 mm H₂O) before approval.","freq":"ONCE","cond":"OUTAGE","craft":"ENG","crew":1,"hrs":40,"capex":120,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2028-12-31","resp":"GT engineering","steps":["Collect two dust seasons of CM-MBL-01 data to size the benefit.","Get filter-house vendor and GE layout and ΔP data for the added stage.","Raise the MOC; compare the added clean ΔP with the output saved.","Get Board capex approval; install at each unit's HGPI.","After install: add a job plan and a ΔP condition-monitoring point for the new stage."],"record":["Added clean ΔP of the new stage (mm H₂O)","Final-stage ΔP rise per dust season, before and after (mm H₂O)"],"moc":{"cls":"Major: capital","st":"DRAFT","outage":"Yes: 10 days per unit, aligned with HGPI","target":"2028–2030, at each unit's HGPI"}},
{"id":"A-02a","fm":["FM-02"],"type":"PdM","reduces":"O","title":"Check cooler sump conductivity weekly and set blowdown","task":"While the cooler runs, measure sump and make-up water conductivity weekly. Adjust blowdown so cycles of concentration stay within the OEM limit; act at the OEM limit.","freq":"W","py":30,"win":"Apr–Oct (cooler in service)","cond":"RUN","craft":"CHEM","crew":1,"hrs":0.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-01","resp":"Chemistry lab","cm":"CM-MBL-02","record":["Sump conductivity (µS/cm)","Make-up conductivity (µS/cm)","Cycles of concentration","Blowdown setting"]},
{"id":"A-02b","fm":["FM-02"],"type":"PM","reduces":"O","title":"Inspect drift eliminators and water headers before summer","task":"Inspect drift eliminators for gaps, sagging or damage, and the distribution header for blocked or broken nozzles. Repair before the cooler goes into service; record findings with photos.","freq":"SEAS","win":"Due by 31 Mar","cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":4,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Mechanical maintenance","record":["Drift eliminator gaps or damage (location)","Blocked or broken nozzles (number)"]},
{"id":"A-02c","fm":["FM-02"],"type":"PM","reduces":"O","title":"Replace evaporative cooler media every two years","task":"Replace the evaporative media blocks every second winter. Record the media condition (scale, collapse, bypass gaps) for the next interval review.","freq":"2Y","win":"Due by 31 Mar","cond":"STANDSTILL","craft":"MECH","crew":6,"hrs":32,"mat":18,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2028-03-31","resp":"Mechanical maintenance","record":["Media condition when removed (good/scaled/collapsed)"]},
{"id":"A-02d","fm":["FM-02"],"type":"PM","reduces":"OD","title":"Walk down the inlet duct, silencer and trash screen","task":"Inspect the duct after the cooler, silencer panels, trash screen and fasteners for rust, cracks and loose or missing parts. Replace carbon-steel fasteners found with stainless steel. Any part missing: borescope R0 before restart (A-04a).","freq":"Y","win":"Oct–Apr (standstill); also at each CI","cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":6,"mat":0.3,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Mechanical maintenance","steps":["Permit to work, lockout and confined-space entry with gas test and standby person.","Check duct liner and coatings after the cooler for rust and blistering.","Check each silencer panel for cracked skins, loose perforated sheet and missing rivets.","Check the trash screen and bellmouth for debris and damage.","Count loose or missing fasteners. Any missing part: raise an R0 borescope before restart.","Tool count signed before the inlet is closed."],"record":["Loose or missing fasteners (number, location)","Damaged silencer panels (number)","Coating condition (good/fair/poor)","Parts missing (yes/no)"]},
{"id":"A-03a","fm":["FM-03"],"type":"PM","reduces":"O","title":"Run online water wash within GE limits in summer","task":"Run the online wash with demineralised water at the frequency and water quality GE allows (GEK-101944), planned weekly in summer. Check wash-water conductivity first; do not wash if it is above the limit.","freq":"W","py":22,"win":"May–Sep","cond":"RUN","craft":"OPS","crew":1,"hrs":1,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2027-05-01","resp":"Operations","record":["Wash-water conductivity (µS/cm)","Corrected output before and after (MW)"]},
{"id":"A-03b","fm":["FM-03"],"type":"PdM","reduces":"OD","title":"Trend compressor efficiency and wash offline on the limit","task":"CM-MBC-01 trends compressor efficiency loss against the post-wash baseline: warning 1.5, action 2.5 % points (illustrative). At the action limit, do an offline crank wash at the next standstill long enough for wheelspace cool-down.","freq":"Q","py":3,"win":"On CM-MBC-01 limit, at standstills of 24 h or more (mostly Oct–Apr)","cond":"STANDSTILL","craft":"OPS","crew":2,"hrs":4,"mat":0.25,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-31","resp":"Operations","cm":"CM-MBC-01","steps":["Confirm CM-MBC-01 is at the action limit and a standstill of 24 h or more is planned.","Cool down until all wheelspace temperatures are below the GE wash limit.","Check wash-water conductivity and detergent mix against GEK-101944.","Set valves and drains per the GE wash procedure; crank, inject detergent, soak and rinse.","Dry on crank; restore valves and drains; check the drains run clear.","After restart, record corrected output and efficiency as the new baseline."],"record":["Efficiency loss before wash (% points)","Wheelspace temperature at start (°C)","Wash-water conductivity (µS/cm)","Output recovered (MW)"]},
{"id":"A-03c","fm":["FM-03"],"type":"PM","reduces":"O","title":"Inspect online-wash nozzles and skid filter","task":"Inspect the wash nozzles in the bellmouth for scale, blockage and loose fittings; clean the skid filter. Record blocked nozzles and spray pattern.","freq":"6M","win":"Oct and Mar (standstill)","cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":3,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Mechanical maintenance","record":["Blocked nozzles (number)","Spray pattern (good/poor)"]},
{"id":"A-03d","fm":["FM-03"],"type":"Design","reduces":"O","title":"Add a conductivity interlock to the water-wash skid","task":"Fit a conductivity analyser on the skid outlet that blocks a wash when water quality is above the GE limit. Test the interlock at each nozzle inspection.","freq":"ONCE","cond":"RUN","craft":"INST","crew":1,"hrs":16,"capex":5,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2027-06-30","resp":"GT engineering","moc":{"cls":"Minor","st":"DRAFT","outage":"No","target":"Q2 2027"}},
{"id":"A-04a","fm":["FM-04","FM-02"],"type":"PdM","reduces":"OD","title":"Borescope R0/R1 and S0–S2 shims every 4,000 fired hours","task":"Borescope R0/R1 blades and S0–S2 vane shims about every 4,000 fired hours, and after any surge, foreign-object event or missing inlet part. Judge against the latest GE TIL 1509 and TIL 1562 limits; record pit, nick and crack sizes.","freq":"FFH4K","win":"Spring and autumn standstills; after any surge or foreign-object event","cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":10,"mat":2.5,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2027-03-31","resp":"GT engineering","steps":["Confirm fired hours since the last borescope (target 4,000) or an event; book the inspector.","Unit stopped and cool; permit to work, lockout, CO₂ isolated for compartment entry.","Inspect R0 and R1 leading edges, tips and roots, and S0–S2 shims, against TIL 1509 and TIL 1562.","Photograph and size every pit, nick or crack; compare with the last inspection.","Crack or shim movement beyond limits: the unit stays down and GE is called.","Close ports with new seals; record results against tag 11MBC10HB001."],"record":["Fired hours since last borescope","Largest R0 pit or nick (mm)","Cracks found (yes/no, blade numbers)","S0–S2 shim movement (mm)","Change since last inspection (stable/growing)"]},
{"id":"A-04b","fm":["FM-04"],"type":"Design","reduces":"O","title":"Fit GE TIL 1509/1562 hardware fixes at the next outage","task":"Review each unit against the latest GE TIL 1509 and TIL 1562. Fit the hardware changes GE recommends for that unit, within LTSA scope, at the outage GE advises. Some fixes need the compressor casing opened, so they may not fit inside a CI. Update the borescope limits in A-04a.","freq":"ONCE","cond":"OUTAGE","craft":"ENG","crew":1,"hrs":24,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2028-06-30","resp":"GT engineering","moc":{"cls":"Major: capital","st":"APPROVED","outage":"Inside next suitable GE outage (CI, HGPI or major, as GE advises)","target":"Each unit's next suitable outage, 2027–2029 (LTSA scope)"}},
{"id":"A-05a","fm":["FM-05"],"type":"PdM","reduces":"D","title":"Trend IGV tracking error and close time","task":"CM-MBC-02 trends IGV demand-versus-position error at load and close time on every shutdown and trip. Review weekly; raise a work order when either drifts past the limit set with GE.","freq":"W","cond":"RUN","craft":"ENG","crew":1,"hrs":0.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-01","resp":"GT engineering","cm":"CM-MBC-02","record":["Close time on last shutdown (s)","Largest tracking error at load (deg)"]},
{"id":"A-05b","fm":["FM-05"],"type":"Test","reduces":"D","title":"Stroke-test IGVs and calibrate LVDTs each winter","task":"Full-stroke the IGVs with hydraulic oil available and calibrate both LVDTs (96TV-1/-2). Record demand versus measured angle at 5 points and the full close time.","freq":"Y","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":4,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"I&C maintenance","steps":["Permit to work; unit stopped; hydraulic oil pump running; compartment safe to enter.","Stroke the IGVs closed to fully open and back with Mark VIe forcing, per GE procedure.","At 5 points, record demand, both LVDTs and the vane angle from a gauge.","Calibrate LVDTs if the error is outside GE tolerance.","Time a full close from open; compare with the baseline.","Remove forces; a second person checks none remain."],"record":["Position error at 5 points (deg)","Close time, open to minimum (s)","LVDT recalibrated (yes/no)","Servo current at null (mA)"]},
{"id":"A-05c","fm":["FM-05"],"type":"Test","reduces":"D","title":"Prove IGVs close on every trip path, incl. fire trip","task":"With the unit stopped and hydraulic oil running, force the IGVs open. Then simulate each trip path in turn and confirm the IGVs go to minimum angle. Lock out CO₂ release before simulating the fire trip. Record pass or fail and close time for each path, then remove all forces. Repeat for any trip path whose logic or wiring is later changed.","freq":"ONCE","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":8,"capex":null,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2027-02-28","resp":"I&C maintenance","record":["Trip paths tested (number)","Paths that failed to close the IGVs (list)"]},
{"id":"A-06a","fm":["FM-06"],"type":"PdM","reduces":"OD","title":"Trend bleed valve travel time on every start and stop","task":"CM-MBC-03 records open and close travel time of each bleed valve from the limit switches on every start and shutdown. Review weekly; raise a work order when a valve is slower than its own baseline by the set limit.","freq":"W","cond":"RUN","craft":"INST","crew":1,"hrs":0.25,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-01","resp":"I&C maintenance","cm":"CM-MBC-03","record":["Open travel time, each valve (s)","Close travel time, each valve (s)"]},
{"id":"A-06b","fm":["FM-06"],"type":"PM","reduces":"O","title":"Stroke bleed valves; inspect actuators and 20CB","task":"With the unit stopped, stroke each valve with air; check travel time, limit switches and linkage. Inspect actuator cylinder and seals; replace the 20CB solenoid valve if slow or leaking.","freq":"OUT","win":"Oct–Apr (planned outage)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":6,"mat":0.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"I&C maintenance","record":["Travel time, each valve (s)","Seals or solenoid replaced (yes/no)"]},
{"id":"A-06c","fm":["FM-06"],"type":"PM","reduces":"O","title":"Service the bleed valve actuating-air filter","task":"Drain and change the actuating-air filter element; where plant instrument air is used, check the dryer dew point. Record water or dirt found.","freq":"6M","win":"Oct–Apr (standstill); loss of air opens the valves, so never at load","cond":"STANDSTILL","craft":"MECH","crew":1,"hrs":2,"mat":0.1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Mechanical maintenance","record":["Water or dirt in filter bowl (yes/no)","Dryer dew point (°C), where fitted"]},
{"id":"A-07a","fm":["FM-07"],"type":"PM","reduces":"O","title":"Tune combustion before summer and before winter","task":"Seasonal DLN 2.0+ tuning by GE or a qualified specialist (or check automatic tuning where fitted). Accept when dynamics are below the OEM limits in every mode and NOx and CO are inside the permit.","freq":"6M","win":"Apr and Oct","cond":"RUN","craft":"CONTR","crew":1,"hrs":16,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"GT engineering","steps":["Confirm gas composition, Modified Wobbe Index and fuel-gas temperature are normal and steady.","Record baseline dynamics, NOx, CO and exhaust spread at base load.","Adjust fuel splits across the load range per the GE tuning procedure.","Confirm dynamics are below limits in every DLN mode; NOx and CO inside the permit.","Record final splits and readings; reset the CM-MBM-01 baseline."],"record":["Highest dynamics band before and after (% of OEM limit)","NOx at base load (ppm at 15 % O₂)","Modified Wobbe Index during tuning","Ambient temperature (°C)"],"mat":6},
{"id":"A-07b","fm":["FM-07"],"type":"PdM","reduces":"D","title":"Trend combustion dynamics per can against limits","task":"CM-MBM-01 trends the highest dynamics band per can: warning 70 %, action 85 % of the OEM limit (illustrative). Review weekly; at the action limit call for a tuning check.","freq":"W","cond":"RUN","craft":"ENG","crew":1,"hrs":1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-01","resp":"GT engineering","cm":"CM-MBM-01","record":["Highest band, worst can (% of OEM limit)"]},
{"id":"A-07c","fm":["FM-07"],"type":"Design","reduces":"D","title":"Install a fuel gas chromatograph with a Wobbe alarm","task":"Install an online gas chromatograph on the common fuel gas header. Send Modified Wobbe Index to the Mark VIe with an alarm before it leaves the tuned band.","freq":"ONCE","cond":"RUN","craft":"INST","crew":2,"hrs":24,"capex":55,"scope":"plant","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"GT engineering","moc":{"cls":"Minor","st":"APPROVED","outage":"No","target":"Mar 2027, before summer tuning"}},
{"id":"A-08a","fm":["FM-08"],"type":"PM","reduces":"O","title":"Run CIs on factored hours and starts, not calendar","task":"Schedule each CI on factored fired hours and factored starts at GE's interval for the installed hardware (24,000 FFH / 900 FFS with DLN 2.6+ parts; shorter for older DLN 2.0+ parts). In the CI, map cracks and coating loss on all 18 liners and transition pieces.","freq":"CI","cond":"OUTAGE","craft":"ENG","crew":1,"hrs":16,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2027-11-30","resp":"GT engineering","record":["Factored fired hours at CI","Factored starts at CI","Cracked liners or transition pieces (can numbers)"]},
{"id":"A-08b","fm":["FM-08","FM-12"],"type":"PdM","reduces":"OD","title":"Borescope combustors and stage 1 every year","task":"Borescope all 18 liners and transition pieces and the stage 1 nozzles and buckets at each CI or yearly, whichever comes first, and after any high-dynamics alarm. Record findings by can and position against GE limits.","freq":"Y","win":"Oct–Apr (standstill); also after a high-dynamics alarm","cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":10,"mat":2.5,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2027-03-31","resp":"GT engineering","steps":["Book the borescope inspector; unit stopped and cool.","Permit to work, lockout, CO₂ isolated for compartment entry.","Inspect all 18 liners and transition pieces: cracks, coating loss, burn marks, seal wear.","Inspect stage 1 nozzles and buckets: coating loss, cracks, blocked cooling holes.","Map findings by can and position; compare with the last results and GE limits.","Beyond limits: plan an early CI or HGPI with GE; record in the CMMS."],"record":["Cans with cracks (can numbers)","Largest crack (mm)","Worst stage 1 coating loss (% of airfoil)","Blocked cooling holes (yes/no)","Change since last borescope (stable/growing)"]},
{"id":"A-08c","fm":["FM-08"],"type":"Proc","reduces":"O","title":"Count hours, starts and trips per hardware set","task":"Set up CMMS counters per unit and per combustion hardware set (by serial number) for fired hours, starts, trips and distillate hours, fed daily from the Mark VIe.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":24,"capex":null,"scope":"unit","basis":"FMEA","status":"In progress","due":"2027-01-31","resp":"GT engineering"},
{"id":"A-09a","fm":["FM-09","FM-10"],"type":"PdM","reduces":"OD","title":"Trend each flame detector signal monthly","task":"Trend signal strength of each flame detector in the CMMS. Clean or replace a detector whose signal falls to the replacement limit; flag at once if several fall together.","freq":"M","cond":"RUN","craft":"INST","crew":1,"hrs":1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-01","resp":"I&C maintenance","cm":"CM-MBM-02","record":["Signal strength, each detector (% of new)"]},
{"id":"A-09b","fm":["FM-09"],"type":"PM","reduces":"O","title":"Clean flame detector sight glasses and connectors","task":"Clean lenses and sight glasses; check cables and connectors for heat damage and moisture. Record the signal before and after.","freq":"6M","win":"Oct and Mar (standstill)","cond":"STANDSTILL","craft":"INST","crew":1,"hrs":3,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"I&C maintenance","record":["Signal before and after cleaning (% of new)"]},
{"id":"A-10a","fm":["FM-10"],"type":"Test","reduces":"D","title":"Prove loss-of-flame trip from detector to fuel valves","task":"With gas isolated and the system in test mode per GE procedure, simulate loss of flame per the unit's voting logic. Confirm the stop/speed ratio and gas control valves close; record signal-to-closed time against the GE limit.","freq":"Y","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":6,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-02-28","resp":"I&C maintenance","steps":["Permit to work; gas isolated upstream and vented; valves in test configuration per GE procedure.","Record each detector's signal and status.","Simulate loss of flame on detectors one at a time, then in the combination that must trip.","Confirm the trip and that both fuel valves close; time signal to valve closed.","Remove all simulations; a second person checks no forces remain.","Any failure: the unit is not returned to service until fixed."],"record":["Detector signals before test","Voting result (trip yes/no)","Signal to valves closed (s)","Forces removed and checked (signature)"]},
{"id":"A-10b","fm":["FM-10"],"type":"Proc","reduces":"OD","title":"Re-test flame trip after any control logic change","task":"Add to the Mark VIe change procedure: any change to flame or fuel-trip logic needs a loss-of-flame trip test (A-10a method) before restart.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":8,"capex":null,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2027-01-31","resp":"I&C maintenance"},
{"id":"A-12a","fm":["FM-12"],"type":"PM","reduces":"O","title":"HGPI on factored hours with stage 1 bucket recoating","task":"Hot gas path inspection at 24,000 factored fired hours / 900 factored starts (GE GER-3620 baseline for 9F.03), with stage 1 bucket recoating. Record life used and parts condition per serial number.","freq":"HGPI","cond":"OUTAGE","craft":"ENG","crew":1,"hrs":24,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2029-03-31","resp":"GT engineering","record":["Factored fired hours at HGPI","Stage 1 buckets scrapped (number)","Coating condition (good/fair/poor)"]},
{"id":"A-12b","fm":["FM-12"],"type":"Proc","reduces":"O","title":"Count peak-fire hours with GE's severity factor","task":"Set the CMMS fired-hours meter to weight peak-fire hours with GE's peak-fire severity factor (GER-3620). Report to the owner each autumn the bucket life used by summer peak firing.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":16,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"GT engineering"},
{"id":"A-13a","fm":["FM-13"],"type":"PdM","reduces":"OD","title":"Compare each thermocouple with its neighbours monthly","task":"CM-MBR-01: each month compare every thermocouple with the exhaust median and its neighbours; flag any outside the deviation limit for replacement. Keep GE's allowable-spread alarm and trip logic unchanged.","freq":"M","cond":"RUN","craft":"INST","crew":1,"hrs":1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-01","resp":"I&C maintenance","cm":"CM-MBR-01","record":["Thermocouples outside the limit (numbers)","Largest deviation from median (°C)"]},
{"id":"A-13b","fm":["FM-13"],"type":"PM","reduces":"O","title":"Loop-check thermocouples; replace flagged ones","task":"Loop-check all 31 thermocouples; replace failed or flagged ones and reseal junction boxes against moisture. Never leave a known-bad thermocouple in service without flagging it.","freq":"Y","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":8,"mat":1.1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"I&C maintenance","record":["Thermocouples replaced (numbers)","Junction boxes resealed (number)"]},
{"id":"A-14a","fm":["FM-14"],"type":"PM","reduces":"OD","title":"Inspect exhaust insulation and fasteners at each CI","task":"Inspect insulation packs, liner and flex seals and torque-check fasteners at each CI (GE GER-3620 scope), and after any high-vibration event. Record loose or missing parts by location.","freq":"CI","cond":"OUTAGE","craft":"MECH","crew":2,"hrs":12,"mat":0.5,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2027-11-30","resp":"Mechanical maintenance","record":["Loose or missing fasteners (number, location)","Damaged insulation packs (number)"]},
{"id":"A-14b","fm":["FM-14"],"type":"PdM","reduces":"D","title":"Thermography of exhaust casing before and after summer","task":"Infrared survey of exhaust frame, diffuser casing, plenum and HRSG inlet duct at base load. Raise a work order for any hot spot above the last survey's baseline.","freq":"6M","win":"Apr and Oct","cond":"RUN","craft":"ELEC","crew":1,"hrs":2,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Electrical maintenance","record":["Hottest casing spot (°C, location)","Rise since last survey (°C)"]},
{"id":"A-15a","fm":["FM-15"],"type":"Test","reduces":"OD","title":"Swap lead and lag 88TK blowers monthly","task":"Change over the 88TK blowers from the Mark VIe; confirm the standby starts and discharge pressure stays normal. Record motor current and vibration on both.","freq":"M","cond":"RUN","craft":"OPS","crew":1,"hrs":0.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-01","resp":"Operations","record":["Standby started on demand (yes/no)","Discharge pressure after changeover","Motor current, each blower (A)","Motor vibration, each blower (mm/s)"]},
{"id":"A-15b","fm":["FM-15"],"type":"PM","reduces":"O","title":"Clean blower inlet filters before summer and after storms","task":"Clean or replace the blower inlet filters one blower at a time, and check the discharge check dampers move freely. Do it before summer and after each dust storm.","freq":"SEAS","py":3,"win":"Due by 15 Apr; again after each dust storm","cond":"RUN","craft":"MECH","crew":1,"hrs":2,"mat":0.1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Mechanical maintenance","record":["Filter condition (clean/dirty/blocked)","Check damper free (yes/no)"]},
{"id":"A-15c","fm":["FM-15"],"type":"Spares","reduces":"S","title":"Hold one spare 88TK blower motor for the plant","task":"Buy and store one spare blower motor that fits all six blowers. A motor swap takes about a day, so a double failure costs about a day, not a 1–2 week rewind.","freq":"ONCE","cond":"RUN","craft":"MECH","crew":1,"hrs":4,"capex":8,"scope":"plant","basis":"FMEA","status":"Proposed","due":"2027-03-31","resp":"Mechanical maintenance","moc":{"cls":"Minor","st":"SCREENED","outage":"No","target":"Q1 2027"}},
{"id":"A-SP1","fm":["FM-04","FM-05","FM-24","FM-34"],"type":"Spares","reduces":"S","title":"Add an exchange-rotor clause to the LTSA","task":"Agree in the long-term service agreement (LTSA) that GE supplies an exchange rotor within an agreed time after rotor damage on any unit. This cuts a rotor outage from 4–6 months to about 6–8 weeks.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":40,"capex":null,"scope":"plant","basis":"FMEA","status":"Owner decision","due":"2027-06-30","resp":"Plant Manager","moc":{"cls":"Commercial","st":"SCREENED","outage":"No","target":"LTSA renewal"}},
{"id":"A-16a","fm":["FM-16"],"type":"PdM","reduces":"D","title":"Review bearing vibration and coast-down trends monthly","task":"Trend vibration, metal temperature and coast-down time for No. 1 and No. 2 bearings. Raise a work order on a step change or rising trend, before the alarm. Read tin and iron from the monthly oil sample (A-25a).","freq":"M","cond":"RUN","craft":"ENG","crew":1,"hrs":2,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-30","resp":"GT engineering","cm":"CM-MBD-01","record":["No. 1 / No. 2 vibration, monthly maximum (mm/s)","Bearing metal temperature, monthly maximum (°C)","Coast-down time at the last shutdown (min)","Tin and iron in oil from A-25a (ppm)"]},
{"id":"A-16b","fm":["FM-16"],"type":"PM","reduces":"O","title":"Inspect the shaft-grounding brush monthly","task":"On the running unit, check brush length, spring pressure and contact. Replace the brush at the OEM minimum length. Record shaft-to-ground voltage where a test point is fitted.","freq":"M","cond":"RUN","craft":"ELEC","crew":1,"hrs":1,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-30","resp":"Electrical maintenance"},
{"id":"A-16c","fm":["FM-16"],"type":"PM","reduces":"O","title":"Record alignment and clearances whenever bearings are opened","task":"Whenever a bearing or the load coupling is opened, and at each major inspection, measure coupling alignment and No. 1 and No. 2 bearing clearances against OEM limits. Record them in the CMMS as the baseline. Correct any reading outside limits before restart.","freq":"MI","cond":"OUTAGE","craft":"MECH","crew":2,"hrs":6,"scope":"unit","basis":"OEM","status":"Approved","due":"2026-12-31","resp":"Mechanical maintenance"},
{"id":"A-17a","fm":["FM-17"],"type":"Proc","reduces":"O","title":"Set a 28 °C fuel gas superheat limit in the control room","task":"Make 'at least 28 °C (50 °F) superheat above the higher dew point at the stop/speed ratio valve inlet' a written operating limit (GE GEI 41040). Operators restore heating or reduce load before it is crossed. Train all shift crews.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":16,"scope":"plant","basis":"OEM","status":"Approved","due":"2026-12-15","resp":"Operations"},
{"id":"A-17b","fm":["FM-17"],"type":"PM","reduces":"O","title":"Drain and check the filter-separator weekly","task":"Drain the filter-separator sumps and record the volume and liquid type. Any water, or a volume rising week on week, means a possible performance-heater tube leak. Raise a work order the same day.","freq":"W","cond":"RUN","craft":"OPS","crew":1,"hrs":0.5,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-01","resp":"Operations","steps":["Check the filter-separator level gauges and the high-level alarm status on the control room screen.","Open each sump drain slowly to the closed drain, never to atmosphere.","Take a liquid sample at the sample point into a closed sample bottle, under the gas permit; note if it is hydrocarbon, water or both.","Record the drained volume and close the drain fully.","Read the fuel gas superheat on the control room screen and record it.","If water is found or the volume is rising, raise a work order for a heater tube-leak check."],"record":["Drained volume (litres)","Liquid type (hydrocarbon / water)","Fuel gas superheat at the stop/speed ratio valve inlet (°C)","Filter-separator ΔP (bar)"]},
{"id":"A-17c","fm":["FM-17"],"type":"Design","reduces":"D","title":"Install an online dew-point analyser on the fuel gas header","task":"Install a hydrocarbon and water dew-point analyser on the common fuel gas header. Show the live superheat margin in the control room. Warning at 32 °C margin, action at 28 °C.","freq":"ONCE","cond":"RUN","craft":"INST","crew":2,"hrs":40,"capex":45,"scope":"plant","basis":"FMEA","status":"Proposed","due":"2027-03-31","resp":"I&C maintenance","cm":"CM-MBP-01","moc":{"cls":"Minor","st":"SCREENED","outage":"No","target":"Q1 2027"}},
{"id":"A-17d","fm":["FM-17"],"type":"Test","reduces":"O","title":"Pressure-test the performance-heater tube bundle","task":"At each planned outage, isolate and purge the gas side, then pressurise the water side to the OEM test pressure. Watch the gas-side drains for 1 hour. Acceptance: no water at the gas-side drains.","freq":"OUT","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":8,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-02-28","resp":"Mechanical maintenance"},
{"id":"A-18a","fm":["FM-18"],"type":"PdM","reduces":"D","title":"Log and trend fuel gas strainer ΔP daily","task":"Record strainer ΔP on the daily round in the CMMS and trend it. Warning at 60 % and action at 80 % of the OEM change-out limit.","freq":"D","cond":"RUN","craft":"OPS","crew":1,"hrs":0.1,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-01","resp":"Operations","cm":"CM-MBP-02"},
{"id":"A-18b","fm":["FM-18"],"type":"PdM","reduces":"O","title":"Change the strainer element at 80 % of the ΔP limit","task":"When the trend reaches 80 % of the OEM limit, change the element at the next planned standstill. Isolate, vent and gas-free the line first. Keep one element in stock.","freq":"Y","py":1,"cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":6,"mat":0.9,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-01","resp":"Mechanical maintenance","cm":"CM-MBP-02"},
{"id":"A-19a","fm":["FM-19"],"type":"PdM","reduces":"D","title":"Trend servo current and position error of the gas valves","task":"Each month, trend each gas valve's servo current and position error from the Mark VIe historian. A rising current or growing error is an early sign of sticking. Plan a servo change or oil clean-up.","freq":"M","cond":"RUN","craft":"INST","crew":1,"hrs":1.5,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-15","resp":"I&C maintenance"},
{"id":"A-19b","fm":["FM-19"],"type":"Test","reduces":"D","title":"Stroke-test the gas valves and check position sensors","task":"At each planned standstill, with fuel gas isolated and vented and hydraulic oil running, stroke the stop/speed ratio valve and each gas control valve over the full range. Check position sensor calibration and response time against OEM limits. Record the results.","freq":"6M","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":6,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-31","resp":"I&C maintenance"},
{"id":"A-19c","fm":["FM-19"],"type":"Spares","reduces":"S","title":"Hold one set of gas valve servo valves on site","task":"Buy one servo valve for the stop/speed ratio valve and each gas control valve, shared by the three units. A sticking servo is then changed in hours, not after weeks of lead time.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":4,"capex":16,"scope":"plant","basis":"FMEA","status":"In progress","due":"2026-12-31","resp":"I&C maintenance","moc":{"cls":"Commercial","st":"APPROVED","outage":"No","target":"Q4 2026"}},
{"id":"A-20a","fm":["FM-20"],"type":"PdM","reduces":"D","title":"Trend the automatic gas leak test result","task":"Store the pressure-decay result of every automatic leak test in the CMMS, not just pass/fail. Review the trend monthly. Raise a work order when the decay rate rises towards the trip limit.","freq":"M","cond":"RUN","craft":"ENG","crew":1,"hrs":1,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-31","resp":"GT engineering"},
{"id":"A-20b","fm":["FM-20"],"type":"Test","reduces":"D","title":"Time the fuel valve closure on a trip test","task":"At each planned outage, with gas isolated and vented, trip the stop/speed ratio valve and gas control valves from the Mark VIe. Measure each closing time on a fast trend. Acceptance: within the OEM limit and no slower than last time.","freq":"OUT","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":4,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-01-31","resp":"I&C maintenance","steps":["Confirm fuel gas is isolated with double block and vent, and a gas-free certificate is issued.","Run the hydraulic supply; set a Mark VIe fast trend on valve positions and trip-oil pressure.","Open the stop/speed ratio valve and gas control valves to the test position.","Trip them with the Mark VIe trip test function; never by removing power.","Read each closing time from the trend; compare with the OEM limit and the last result.","Check every valve reads fully closed and its position sensor zero is unchanged.","Return the system to normal and enter the results in the CMMS."],"record":["Stop/speed ratio valve closing time (ms)","Closing time of each gas control valve (ms)","Trip-oil pressure decay time (ms)","Closed position reading of each valve (%)"]},
{"id":"A-20c","fm":["FM-20"],"type":"Test","reduces":"D","title":"Test overspeed protection at each CI and after logic changes","task":"Test the electronic overspeed trip by the OEM method at each combustion inspection and after any control-software change. Record the trip speed and the fuel valve closing time.","freq":"CI","cond":"OUTAGE","craft":"INST","crew":2,"hrs":6,"scope":"unit","basis":"OEM","status":"Approved","due":"2026-12-31","resp":"I&C maintenance"},
{"id":"A-21a","fm":["FM-21"],"type":"Test","reduces":"O","title":"Leak-test disturbed fuel gas joints before first fire","task":"After any outage, leak-test every fuel gas joint that was opened, with nitrogen at operating pressure, before first fire. Then sniff all joints with a portable gas detector at first run-up. Acceptance: no detectable leak.","freq":"OUT","cond":"OUTAGE","craft":"MECH","crew":2,"hrs":6,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-22","resp":"Mechanical maintenance","steps":["List every fuel gas joint opened in the outage from the closed work orders.","Confirm the system is isolated from live gas; fill it with nitrogen to operating pressure.","Spray leak-detection fluid on each listed joint; fix any leak and retest.","Hold pressure for 30 minutes and record the pressure drop.","Depressurise and return the system to gas service under the permit.","At first run-up, sniff all joints in both compartments with a portable detector."],"record":["Joints tested (count)","Leaks found and fixed (count)","Pressure drop over 30 min (bar)","Portable detector maximum at run-up (% of lower explosive limit)"]},
{"id":"A-21b","fm":["FM-21"],"type":"PM","reduces":"O","title":"Inspect flex hoses at each CI; replace at OEM life","task":"At each combustion inspection, inspect every fuel gas flex hose for kinks, fretting and damaged braid. Replace at the OEM life or at any damage. Record hose serial numbers in the CMMS.","freq":"CI","cond":"OUTAGE","craft":"MECH","crew":2,"hrs":6,"mat":4,"scope":"unit","basis":"OEM","status":"Approved","due":"2026-11-22","resp":"Mechanical maintenance"},
{"id":"A-21c","fm":["FM-21"],"type":"Test","reduces":"D","title":"Calibrate the compartment gas detectors quarterly","task":"Calibrate each hazardous gas detector in the gas valve and turbine compartments with certified test gas. Heat and dust make them drift. Work from outside the compartment (detectors in the vent ducts or remote calibration ports); never enter a running turbine compartment. Inhibit only the detector under test. Record as-found and as-left readings; replace a detector that drifts twice.","freq":"Q","cond":"RUN","craft":"INST","crew":1,"hrs":4,"mat":0.06,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-31","resp":"I&C maintenance"},
{"id":"A-21d","fm":["FM-21"],"type":"Test","reduces":"D","title":"Prove gas detection trips and fan interlocks yearly","task":"Once a year, apply test gas at each detector. Confirm the alarm, the trip and the ventilation response end to end (see FM-38). Record the time from gas to trip.","freq":"Y","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":6,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"I&C maintenance"},
{"id":"A-22a","fm":["FM-22"],"type":"PM","reduces":"O","title":"Recirculate liquid fuel through the unit monthly","task":"Run the liquid fuel forwarding pumps in recirculation for 1 hour. This replaces stagnant distillate in the unit piping and exercises the pumps and recirculation valves. The check valves at the cans move only during a real transfer (A-22b). Record pump pressure and any leaks.","freq":"M","cond":"RUN","craft":"OPS","crew":1,"hrs":2,"scope":"unit","basis":"OEM","status":"Approved","due":"2026-11-30","resp":"Operations"},
{"id":"A-22b","fm":["FM-22"],"type":"Test","reduces":"D","title":"Transfer to distillate and back at low load","task":"In Oct, Jan and Apr, transfer from gas to distillate at low load, run 30 minutes and transfer back. This proves the liquid fuel system, atomizing air and the combustor check valves. Prove water injection too if the load is high enough for it to be in service. Acceptance: no trip, normal exhaust spread, stable water-to-fuel ratio while injection is on. Check the false-start drain valves at the next shutdown.","freq":"Q","py":3,"win":"Oct, Jan, Apr (needs low-load dispatch)","cond":"RUN","craft":"OPS","crew":2,"hrs":4,"scope":"unit","basis":"OEM","status":"Approved","due":"2027-01-31","resp":"Operations","steps":["Agree a low-load window with the dispatch centre and brief the shift.","Check distillate level, fuel filters, atomizing-air compressor and water-injection pumps are available.","Transfer to distillate; watch flame signals, exhaust spread and fuel pressures.","Run for 30 minutes; confirm water injection follows fuel flow.","Transfer back to gas and confirm stable operation.","Record the results and raise work orders for any fault."],"record":["Transfer time, gas to distillate (s)","Maximum exhaust spread on distillate (°C)","Water-to-fuel ratio, actual vs set point","Atomizing-air pressure (bar)"]},
{"id":"A-22c","fm":["FM-22"],"type":"PdM","reduces":"O","title":"Drain water and sample distillate tanks monthly","task":"Drain water from the bottom of each distillate storage tank. Take a fuel sample for water, sediment and sodium (sodium causes hot corrosion). Act when a result is outside the OEM fuel specification.","freq":"M","cond":"RUN","craft":"CHEM","crew":1,"hrs":1,"mat":0.06,"scope":"plant","basis":"FMEA","status":"Approved","due":"2026-11-30","resp":"Chemistry lab"},
{"id":"A-22d","fm":["FM-22"],"type":"Proc","reduces":"O","title":"Write a readiness check for planned distillate runs","task":"Before any planned run on distillate, operators complete a signed checklist. It covers fuel quality, tank levels, atomizing air, water-injection pumps, false-start drains and fire protection. The run does not start until it is signed.","freq":"ONCE","cond":"RUN","craft":"OPS","crew":1,"hrs":16,"scope":"plant","basis":"FMEA","status":"In progress","due":"2026-12-15","resp":"Operations"},
{"id":"A-23a","fm":["FM-23"],"type":"PM","reduces":"O","title":"Clean lube oil coolers before summer","task":"Change over to the standby cooler and clean the water side of the duty cooler. Pressure test it and leave it as clean standby; repeat for the other cooler. Record header temperature and cooler ΔP before and after.","freq":"SEAS","win":"Due by 15 Apr","cond":"RUN","craft":"MECH","crew":3,"hrs":12,"mat":0.4,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Mechanical maintenance","cm":"CM-MBV-01","steps":["Confirm the standby cooler is full and vented; note header temperature and pressure.","Change over slowly with the transfer valve while watching header pressure.","Isolate and drain the dirty cooler on both sides under the permit.","Open the water side and clean it with high-pressure water; inspect for leaks and gasket damage.","Close up, pressure test the oil side, then fill and vent.","Leave it as clean standby and repeat for the second cooler.","Record the readings and return the system to normal."],"record":["Header oil temperature before / after (°C)","Cooler water-side ΔP before / after (bar)","Cooling water inlet / outlet temperature (°C)","Temperature control valve position (%)"]},
{"id":"A-23b","fm":["FM-23"],"type":"PdM","reduces":"D","title":"Trend lube oil header temperature weekly in summer","task":"From May to September, trend header oil temperature and temperature control valve position each week. A valve more than 90 % open means no margin left. Change over to the clean cooler or plan a clean before the alarm.","freq":"W","py":22,"win":"May–Sep","cond":"RUN","craft":"ENG","crew":1,"hrs":0.5,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-05-01","resp":"GT engineering","cm":"CM-MBV-01"},
{"id":"A-23c","fm":["FM-23"],"type":"Design","reduces":"O","title":"Add lube oil cooler surface for warm cooling water","task":"Size and add cooler surface (extra plates or a larger cooler) so the header holds its design temperature with peak-summer cooling water and a fouling margin.","freq":"ONCE","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"MECH","crew":4,"hrs":24,"capex":25,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2028-03-31","resp":"GT engineering","moc":{"cls":"Major: capital","st":"SCREENED","outage":"Yes: 3 days per unit","target":"Q1 2028"}},
{"id":"A-24a","fm":["FM-24"],"type":"Test","reduces":"D","title":"Test the emergency DC lube oil pump start weekly","task":"Simulate low header pressure with the pressure-switch test valve and confirm 88QE-1 starts on its own. Acceptance: it starts within the OEM time and makes normal discharge pressure.","freq":"W","cond":"RUN","craft":"OPS","crew":1,"hrs":0.5,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-01","resp":"Operations","steps":["Tell the control room; confirm the 125 V DC bus voltage and charger are normal.","Confirm an AC lube oil pump is running and header pressure is normal.","Open the test valve slowly to bleed the pressure-switch sensing line.","Confirm 88QE-1 starts on its own and its alarm comes in; time the start.","Read pump discharge pressure, motor current and DC bus voltage.","Close the test valve; stop the pump and return it to auto as the procedure says."],"record":["Time to start (s)","Discharge pressure (bar)","Motor current (A)","DC bus voltage during the start (V)"]},
{"id":"A-24b","fm":["FM-24"],"type":"PM","reduces":"O","title":"Calibrate the pressure switches that start the DC pump","task":"Once a year, calibrate the low lube oil pressure switches (DC pump start, low-pressure alarm and trip) against a test gauge. Record as-found and as-left set points.","freq":"Y","win":"Oct–Apr (standstill, after full cool-down, rotor off turning gear)","cond":"STANDSTILL","craft":"INST","crew":1,"hrs":3,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-02-28","resp":"I&C maintenance"},
{"id":"A-24c","fm":["FM-24"],"type":"PM","reduces":"O","title":"Service the DC pump motor and starter yearly","task":"At a winter standstill, inspect motor brushes and commutator, starter contactor contacts and the starting resistor. Check motor insulation resistance. Replace worn parts.","freq":"Y","win":"Oct–Apr (standstill, after full cool-down, rotor off turning gear)","cond":"STANDSTILL","craft":"ELEC","crew":2,"hrs":4,"mat":0.3,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Electrical maintenance"},
{"id":"A-24d","fm":["FM-24"],"type":"Test","reduces":"D","title":"Capacity-test the 125 V DC battery (IEEE 450)","task":"Discharge-test the unit battery to IEEE 450 (vented lead-acid) or the standard for the installed type: IEEE 1188 for valve-regulated, IEEE 1106 for nickel-cadmium. Test at least every 5 years, and yearly once it reaches 85 % of service life or shows degradation. Acceptance: at least 80 % of rated capacity.","freq":"5Y","win":"Oct–Apr (standstill, after full cool-down, rotor off turning gear, or with a temporary battery connected)","cond":"STANDSTILL","craft":"ELEC","crew":2,"hrs":10,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Electrical maintenance"},
{"id":"A-25a","fm":["FM-25","FM-23","FM-16"],"type":"PdM","reduces":"D","title":"Sample lube/hydraulic oil monthly for lab analysis","task":"One monthly sample serves FM-25, FM-23 and FM-16 (GE recommends monthly; quarterly is the minimum). The lab tests ISO 4406 particle count, water, viscosity, acid number and wear metals. Results go into the CMMS against warning and action limits.","freq":"M","cond":"RUN","craft":"CHEM","crew":1,"hrs":1,"mat":0.09,"scope":"unit","basis":"OEM","status":"Approved","due":"2026-11-30","resp":"Chemistry lab","cm":"CM-MBV-02","steps":["Use the fixed sample valve on the running lube oil header.","Flush about 1 litre through the valve into a waste container.","Fill a clean, certified bottle and cap it at once.","Label it with tag, date, fired hours and oil added since the last sample.","Send it to the lab within 24 hours.","Enter results in the CMMS; raise a work order on any action limit."],"record":["ISO 4406 code","Water (ppm)","Viscosity change at 40 °C (%)","Acid number (mg KOH/g)","Tin and iron (ppm)"]},
{"id":"A-25b","fm":["FM-25"],"type":"PdM","reduces":"D","title":"Test oil varnish potential quarterly (MPC)","task":"Every third monthly sample, add a membrane patch colorimetry test (MPC, ASTM D7843) and an oxidation reserve test. Act on a rising trend; do not wait for one high value.","freq":"Q","cond":"RUN","craft":"CHEM","crew":1,"hrs":0.5,"mat":0.15,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-31","resp":"Chemistry lab","cm":"CM-MBV-02"},
{"id":"A-25c","fm":["FM-25","FM-19","FM-20","FM-05"],"type":"Design","reduces":"O","title":"Fit a varnish-removal unit on each oil reservoir","task":"Install a side-stream varnish-removal unit (resin or electrostatic) on each lube/hydraulic reservoir. Target: keep the MPC trend below the lab's caution level. This also protects the IGV servo (FM-05).","freq":"ONCE","cond":"RUN","craft":"MECH","crew":2,"hrs":16,"capex":18,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2027-03-31","resp":"Mechanical maintenance","moc":{"cls":"Minor","st":"SCREENED","outage":"No","target":"Q1 2027"}},
{"id":"A-25d","fm":["FM-25"],"type":"PM","reduces":"O","title":"Change hydraulic oil filters on schedule","task":"Every 6 months, change the duplex hydraulic/trip oil filter elements, switching to the clean side online. Do not wait for high ΔP. Record ΔP before the change.","freq":"6M","cond":"RUN","craft":"MECH","crew":1,"hrs":3,"mat":0.32,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-01-31","resp":"Mechanical maintenance"},
{"id":"A-27a","fm":["FM-27"],"type":"PM","reduces":"O","title":"Clean the cooling water heat exchangers before summer","task":"In March–April, take one exchanger out at a time and clean the seawater side. Pressure test and return it to service. Record ΔP and approach temperature before and after.","freq":"SEAS","win":"Due by 15 Apr","cond":"RUN","craft":"MECH","crew":4,"hrs":24,"mat":1.2,"scope":"plant","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Mechanical maintenance","cm":"CM-PGB-01","steps":["Confirm the other exchanger can carry the load (cooling water supply below its warning limit).","Isolate both sides of one exchanger; drain and vent under the permit.","Open the plate pack; clean the seawater side with high-pressure water; remove shells and silt.","Inspect plates and gaskets; replace any damaged ones.","Close to the OEM tightening dimension and pressure test.","Return it to service, record the readings, then repeat for the next exchanger."],"record":["Seawater-side ΔP before / after (bar)","Approach temperature before / after (°C)","Plates and gaskets replaced (count)","Marine growth found (photo reference)"]},
{"id":"A-27b","fm":["FM-27"],"type":"PdM","reduces":"O","title":"Trend cooling water exchanger ΔP and approach weekly","task":"Every week, trend seawater-side ΔP and approach temperature of each exchanger. Confirm from the chemistry log that chlorination is dosing. Clean on the trend, before the temperature alarm.","freq":"W","cond":"RUN","craft":"ENG","crew":1,"hrs":1,"scope":"plant","basis":"FMEA","status":"Approved","due":"2026-11-01","resp":"GT engineering","cm":"CM-PGB-01"},
{"id":"A-27c","fm":["FM-27"],"type":"Proc","reduces":"O","title":"Agree a summer jellyfish procedure with the intake team","task":"Write a joint procedure with the seawater intake team. It covers early warning of jellyfish, extra screen and strainer backwash, and a planned load reduction order across the three units instead of trips.","freq":"ONCE","cond":"RUN","craft":"OPS","crew":1,"hrs":24,"scope":"plant","basis":"FMEA","status":"Proposed","due":"2027-04-15","resp":"Operations"},
{"id":"A-27d","fm":["FM-27"],"type":"Design","reduces":"O","title":"Add a third cooling water heat exchanger (N+1)","task":"Add a third seawater-cooled plate heat exchanger with isolation valves. One exchanger can then be cleaned or repaired in summer without a derate.","freq":"ONCE","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"CONTR","crew":6,"hrs":80,"capex":150,"scope":"plant","basis":"FMEA","status":"Proposed","due":"2028-03-31","resp":"GT engineering","moc":{"cls":"Major: capital","st":"DRAFT","outage":"Yes: 2-day block outage in winter","target":"Q1 2028"}},
{"id":"A-28a","fm":["FM-28"],"type":"PM","reduces":"O","title":"Service LCI cooling: filters, fans and heat sinks","task":"Replace LCI cabinet air filters and prove each cooling fan runs and its alarm works. Then isolate and lock out the LCI and its start-isolation switch under a permit. Vacuum dust from the heat sinks; on liquid-cooled units, check coolant level and conductivity instead. Done while the GT runs, because the LCI is not needed after the start. Record filter condition and fan currents.","freq":"Q","py":5,"win":"Quarterly, and after each heavy dust storm","cond":"RUN","craft":"ELEC","crew":1,"hrs":4,"mat":0.15,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-15","resp":"Electrical maintenance"},
{"id":"A-28b","fm":["FM-28"],"type":"Test","reduces":"D","title":"Yearly LCI health check with the OEM before summer","task":"OEM field engineer tests thyristors and gate-firing cards, checks control power-supply voltages, torques power connections and inspects the DC-link reactor. Replace any power supply outside OEM tolerance or past OEM life. Record test results and parts used.","freq":"Y","win":"Due by 15 Apr","cond":"RUN","craft":"CONTR","crew":1,"hrs":10,"mat":0.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Electrical maintenance","steps":["Confirm no start is planned; isolate and lock out the LCI and its start-isolation switch under a permit.","Test each thyristor and gate-firing card with the OEM test set; replace any outside limits.","Measure control power-supply voltages; replace supplies outside tolerance or past OEM life.","Check power connections for heat marks and torque; inspect the DC-link reactor for overheating.","Clean heat sinks, fit new filters and prove every cooling fan and its alarm.","Remove the lock-out; at the next start, record the peak cabinet temperature."],"record":["Thyristors tested / failed (n)","Firing cards replaced (n)","Control power-supply voltages (V)","Peak cabinet temperature at next start (°C)","Parts used from site stock"]},
{"id":"A-28c","fm":["FM-28"],"type":"Spares","reduces":"S","title":"Hold LCI firing cards and thyristors on site","task":"Stock one set of gate-firing cards, thyristors with clamping kit, one main control card and one control power supply, shared by GT1–GT3 (same LCI design). Keep them in the air-conditioned store and check them at the yearly health check (A-28b). With parts on site, an LCI fault is repaired within a shift instead of 5–10 days.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":8,"capex":35,"scope":"plant","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Electrical maintenance","moc":{"cls":"Minor","st":"APPROVED","outage":"No","target":"Q1 2027"}},
{"id":"A-29a","fm":["FM-29"],"type":"Test","reduces":"O","title":"Confirm turning gear engaged after every shutdown","task":"Within 10 minutes of the rotor reaching turning speed after any shutdown or trip, confirm the turning gear is running, shaft speed is in the turning range and motor current is normal. Tick the CMMS shutdown checklist. If it is not running, start the loss-of-turning-gear procedure (A-29b) at once.","freq":"SD","cond":"STANDSTILL","craft":"OPS","crew":1,"hrs":0.25,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-15","resp":"Operations","record":["Time from shutdown or trip to turning gear running (min)","Turning speed (rpm)","Turning gear motor current (A)"]},
{"id":"A-29b","fm":["FM-29"],"type":"Proc","reduces":"O","title":"Write the loss-of-turning-gear procedure and train crews","task":"Write a procedure for a turning gear that will not run: how to restore it, the OEM back-up method for turning the rotor, the hold time before a restart, and no restart until crank-speed vibration is normal. Train every shift crew and record attendance.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":24,"capex":null,"scope":"unit","basis":"FMEA","status":"In progress","due":"2026-11-30","resp":"Operations"},
{"id":"A-29c","fm":["FM-29"],"type":"PM","reduces":"O","title":"Inspect turning gear motor, clutch and engagement yearly","task":"During a standstill long enough for full cool-down: check motor insulation resistance and bearings, the clutch or engagement mechanism for wear and free movement, the engagement limit switch and the lube-oil pressure permissive. Record insulation resistance and wear found; replace worn parts.","freq":"Y","win":"Oct–Apr (standstill, after full cool-down)","cond":"STANDSTILL","craft":"MECH","crew":2,"hrs":6,"mat":0.2,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-02-28","resp":"Mechanical maintenance"},
{"id":"A-30a","fm":["FM-30"],"type":"PdM","reduces":"DO","title":"Trend generator H₂ leak rate daily","task":"Each day, record casing H₂ pressure, cold-gas temperature and gas added; the CMMS calculates the daily leak at standard conditions. Warning at 70 % of the OEM allowable daily leak. Action at 100 %: raise a leak-survey work order within 24 h (portable detector at shaft seals, collector housing, bushings, coolers).","freq":"D","cond":"RUN","craft":"OPS","crew":1,"hrs":0.25,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-30","resp":"Operations","cm":"CM-MKA-01","steps":["Read casing H₂ pressure and cold-gas temperature at the same time each day.","Read the H₂ supply totaliser or manifold pressure to find the gas added since yesterday.","Enter the readings; the CMMS corrects them to standard conditions and calculates the daily leak.","Compare with the limits: warning at 70 %, action at 100 % of the OEM allowable leak.","At warning, tell the shift charge engineer and check seal-oil differential pressure. At action, raise the leak-survey work order.","Note any cylinder change or purity top-up, so the next figure is not misread."],"record":["Casing H₂ pressure (bar g)","Cold-gas temperature (°C)","H₂ added since last reading (m³ at standard conditions)","Calculated leak rate (m³/day)","H₂ purity (%)","Seal-oil differential pressure (bar)"]},
{"id":"A-30b","fm":["FM-30"],"type":"Test","reduces":"D","title":"Test emergency DC seal oil pump auto-start weekly","task":"Use the test valve on its pressure switch (OEM method) to make the emergency DC seal oil pump start automatically. Acceptance: it starts at its set pressure and holds seal-oil pressure above H₂ pressure. Record start pressure and differential pressure, then return to normal.","freq":"W","cond":"RUN","craft":"OPS","crew":1,"hrs":0.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-15","resp":"Operations","record":["Emergency pump start pressure (bar)","Seal-oil differential pressure held (bar)","Pump started automatically (yes/no)"]},
{"id":"A-30c","fm":["FM-30"],"type":"Test","reduces":"D","title":"Calibrate fixed H₂ gas detectors quarterly","task":"Bump-test and calibrate each fixed H₂ detector around the generator, collector housing and bearing areas with certified test gas, and prove the alarm reaches the control room. Replace any detector that fails calibration; record as-found and as-left readings.","freq":"Q","cond":"RUN","craft":"INST","crew":1,"hrs":3,"mat":0.06,"capex":null,"scope":"unit","basis":"Statutory","status":"Approved","due":"2026-12-31","resp":"I&C maintenance","record":["As-found reading per detector (% LEL)","As-left reading per detector (% LEL)","Alarm reached control room (yes/no)"]},
{"id":"A-30d","fm":["FM-30"],"type":"PM","reduces":"O","title":"Overhaul seal-oil ΔP regulator at each CI","task":"At each combustion inspection, overhaul and recalibrate the seal-oil differential-pressure regulator to the OEM set point. Do this only with the generator degassed (H₂ purged with CO₂, then air), or with seal oil held on the OEM bypass. If the leak-rate trend has risen, measure seal-ring clearances with the generator degassed. Replace rings outside OEM limits. Record set point and clearances.","freq":"CI","cond":"OUTAGE","craft":"MECH","crew":2,"hrs":12,"mat":0.8,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2026-11-29","resp":"Mechanical maintenance"},
{"id":"A-31a","fm":["FM-31"],"type":"Design","reduces":"D","title":"Fit online partial discharge monitoring on the stator","task":"Install partial discharge couplers at the generator terminals and an online monitor that sends the trend for each phase to the historian. Set the baseline in the first 3 months and add it to the monthly review (A-31b).","freq":"ONCE","cond":"OUTAGE","craft":"CONTR","crew":2,"hrs":24,"capex":30,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-11-30","resp":"Electrical maintenance","cm":"CM-MKA-04","moc":{"cls":"Minor","st":"IN DESIGN","outage":"Inside each unit's next CI or HGPI","target":"2027–2028"}},
{"id":"A-31b","fm":["FM-31"],"type":"PdM","reduces":"D","title":"Review stator partial discharge and temperatures monthly","task":"Review partial discharge per phase, stator temperature sensors and cold-gas temperature against the capability curve. Action limit: discharge magnitude doubles within 6 months, or a stator temperature steps up at the same load. Then raise an engineering review and plan an offline test.","freq":"M","cond":"RUN","craft":"ELEC","crew":1,"hrs":1.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-12-31","resp":"Electrical maintenance","cm":"CM-MKA-04","steps":["Open the partial discharge trend for each phase; compare with the baseline and last month.","Read the stator temperature sensors and cold-gas temperature at a similar load.","Check the unit ran inside its capability curve for the cold-gas temperature seen.","If discharge has doubled in 6 months, or a temperature shows a step rise, raise an engineering review.","Record the readings and note any trips or load changes that explain a change."],"record":["Partial discharge magnitude per phase (mV)","Hottest stator temperature at base load (°C)","Cold-gas temperature (°C)","Load at reading (MW / MVAr)"]},
{"id":"A-31c","fm":["FM-31"],"type":"Test","reduces":"D","title":"Test stator insulation at each CI and at the major","task":"At each CI, measure stator insulation resistance and polarisation index from the terminals (generator gas state per OEM). At the generator major, add the core test (EL-CID), a wedge tightness map and an end-winding check for seal-oil contamination. Compare with previous results.","freq":"CI","cond":"OUTAGE","craft":"ELEC","crew":2,"hrs":8,"capex":null,"scope":"unit","basis":"OEM","status":"Approved","due":"2026-11-29","resp":"Electrical maintenance","record":["Insulation resistance at 1 minute, per phase (GΩ)","Polarisation index per phase","Winding temperature at test (°C)"]},
{"id":"A-31d","fm":["FM-31"],"type":"Spares","reduces":"S","title":"Hold spare stator bars and a rewind contract","task":"Buy one full set of stator bars for the GE 324 design, stored sealed and dry and shared by GT1–GT3. Sign a frame agreement with a pre-qualified rewind contractor. This cuts a stator failure from 5–6 months to about 10 weeks out of service.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":40,"capex":550,"scope":"plant","basis":"FMEA","status":"Owner decision","due":"2027-12-31","resp":"Plant Manager","moc":{"cls":"Major: capital","st":"SCREENED","outage":"No","target":"Q4 2027"}},
{"id":"A-32a","fm":["FM-32"],"type":"Test","reduces":"O","title":"Prove excitation channel transfer at the planned outage","task":"At the end of the planned outage, before synchronising, run the unit at full speed no load with the field on. Follow the OEM procedure to transfer control from the active channel to the standby channel and back. Confirm a smooth transfer with no trip signal. Check channel cooling fans and filters, and record the result in the CMMS.","freq":"OUT","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"ELEC","crew":2,"hrs":3,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"Electrical maintenance"},
{"id":"A-33a","fm":["FM-33"],"type":"PdM","reduces":"OD","title":"Inspect collector brushes with thermography weekly","task":"Under load, through the inspection windows: look for sparking, take an infrared image of rings and brush holders, and check brush wear marks. Act the same day on sparking, or a brush clearly hotter than the rest (sample limit 15 °C above average). Plan changes for brushes near the OEM minimum length.","freq":"W","cond":"RUN","craft":"ELEC","crew":1,"hrs":1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-15","resp":"Electrical maintenance","cm":"CM-MKC-01","steps":["Wear arc-flash clothing; work from outside the guard, through the inspection windows.","Look at each brush for sparking, chatter or a stuck brush.","Take an infrared image of the rings and brush holders; note the hottest and the average.","Check brush wear marks; list brushes near the OEM minimum length.","Plan brush changes; act the same day on sparking or a much hotter brush."],"record":["Hottest brush holder (°C)","Average brush holder (°C)","Brushes near minimum length (n)","Sparking seen (yes/no)","Housing filter condition"]},
