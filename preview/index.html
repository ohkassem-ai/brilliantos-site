<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>9FA Reliability Workbench</title><meta name="description" content="Sample FMEA inside a demo CMMS for a Kuwaiti combined-cycle plant with three GE 9FA gas turbines."><link rel="icon" href="/favicon.svg"></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: CMMS shell. The top bar carries the owner's tolerance line, which re-cuts every module; module rail on the left, working pane on the right; the rail becomes a tab strip on phones. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface2:#f5f6f4; --fg:#1b2229; --muted:#56616a; --line:#d6dbdd; --line2:#e7eaeb;
  --accent:#b9631a; --accent-ink:#ffffff; --accent-soft:#f7e6d4; --accent-fg:#9a4f10;
  --low:#1e6b42; --low-bg:#dcefe3; --med:#7a5a00; --med-bg:#f6ecc5; --high:#9a4a0c; --high-bg:#f9dfc8; --ext:#962020; --ext-bg:#f5d2d2;
  --low-cell:#8fd0a8; --med-cell:#f2d36b; --high-cell:#f2a25e; --ext-cell:#e86a6a; --cell-ink:#1b2229;
  --tol:#1b2229; --ok:#1e6b42; --warn:#7a5a00; --warn-bg:#f6ecc5; --act:#962020; --act-bg:#f5d2d2;
  --c-air:#3f74ad; --c-gas:#c2452d; --c-fuel:#b07d0e; --c-oil:#7f5126; --c-water:#16807f; --c-elec:#7a52a8; --c-shaft:#5f6a73;
  --pm:#1f5fa8; --pm-bg:#dde9f7; --pdm:#6b3fa0; --pdm-bg:#ece3f6; --cm:#a3341a; --cm-bg:#f8ddd3;
  --font-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14181c; --surface:#1d2329; --surface2:#232a31; --fg:#e6eaed; --muted:#a3adb5; --line:#323b43; --line2:#283036;
  --accent:#e3903c; --accent-ink:#1b1206; --accent-soft:#3a2a17; --accent-fg:#f0a65a;
  --low:#6fd09a; --low-bg:#1c3527; --med:#e2b93f; --med-bg:#3a3013; --high:#f29a52; --high-bg:#402614; --ext:#f07a7a; --ext-bg:#3f1c1c;
  --low-cell:#4fae78; --med-cell:#d4a72c; --high-cell:#e0803a; --ext-cell:#e05a5a; --cell-ink:#14181c;
  --tol:#e6eaed; --ok:#6fd09a; --warn:#e2b93f; --warn-bg:#3a3013; --act:#f07a7a; --act-bg:#3f1c1c;
  --c-air:#79a9de; --c-gas:#ef7a5f; --c-fuel:#e0b04a; --c-oil:#c99566; --c-water:#4fc1bf; --c-elec:#b394e0; --c-shaft:#a3adb5;
  --pm:#8db8ee; --pm-bg:#1b2a3d; --pdm:#c7a6ee; --pdm-bg:#2b2139; --cm:#f39b7c; --cm-bg:#3b2119;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1d2329; --surface2:#232a31; --fg:#e6eaed; --muted:#a3adb5; --line:#323b43; --line2:#283036;
  --accent:#e3903c; --accent-ink:#1b1206; --accent-soft:#3a2a17; --accent-fg:#f0a65a;
  --low:#6fd09a; --low-bg:#1c3527; --med:#e2b93f; --med-bg:#3a3013; --high:#f29a52; --high-bg:#402614; --ext:#f07a7a; --ext-bg:#3f1c1c;
  --low-cell:#4fae78; --med-cell:#d4a72c; --high-cell:#e0803a; --ext-cell:#e05a5a; --cell-ink:#14181c;
  --tol:#e6eaed; --ok:#6fd09a; --warn:#e2b93f; --warn-bg:#3a3013; --act:#f07a7a; --act-bg:#3f1c1c;
  --c-air:#79a9de; --c-gas:#ef7a5f; --c-fuel:#e0b04a; --c-oil:#c99566; --c-water:#4fc1bf; --c-elec:#b394e0; --c-shaft:#a3adb5;
  --pm:#8db8ee; --pm-bg:#1b2a3d; --pdm:#c7a6ee; --pdm-bg:#2b2139; --cm:#f39b7c; --cm-bg:#3b2119;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5}
a{color:var(--accent-fg)}
button.lk{color:var(--accent-fg);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
button.lk.mono{white-space:nowrap}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12.5px;color:var(--muted)}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modhead h1:focus{outline:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:500}
.crumb{color:var(--muted);font-size:13px;min-width:0;flex:1 1 280px}
.crumb b{color:var(--fg);font-weight:600}
.tolctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tolctl .lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent-fg);color:var(--accent-fg);border-radius:4px;padding:2px 7px;white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:12px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:10px;min-width:0}
nav.rail .grp{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 10px}
nav.rail .grp:first-child{margin-top:2px}
nav.rail button{display:flex;width:100%;align-items:center;gap:9px;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:7px 10px;border-radius:6px;cursor:pointer}
nav.rail button:hover{background:var(--surface2)}
nav.rail button[aria-current="page"]{background:var(--accent-soft);font-weight:600}
nav.rail .k{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:22px;flex:none}
nav.rail .badge{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
main{padding-block:22px 48px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
section.mod{max-width:1280px}
.modhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:18px}
.modhead>div:first-child{min-width:0;flex:1 1 420px}
.modhead h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.modhead p{margin-top:5px;color:var(--muted);max-width:72ch}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-fg);margin-bottom:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search]{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri,.btn.pri[aria-pressed]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg .btn{border:0;border-radius:0;padding:6px 10px}
.seg .btn+.btn{border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--fg);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.pad{padding:16px 18px}
.cardhead{padding:14px 18px 10px}
.cardhead h2{margin-bottom:4px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.mb{margin-bottom:16px}
.top-al{align-items:start}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2.stack{grid-template-columns:1fr}}
@media (max-width:600px){.g2,.g3{grid-template-columns:1fr}.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
h2.sec{font-size:15.5px;font-weight:600;margin-bottom:10px}
.prose{max-width:70ch}
.prose p+p{margin-top:10px}
.notice{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13.5px}
.notice.ok{border-left-color:var(--ok);background:var(--low-bg)}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi .l{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .s{color:var(--muted);font-size:12.5px}
@media (max-width:600px){.kpi{padding:12px}.kpi .v{font-size:22px}.kpi .s{font-size:12px}}

/* start page */
.chain{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.chain{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:600px){.chain{grid-template-columns:1fr 1fr}}
.link{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:11px 12px;min-width:0}
.link .q{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-fg)}
.link h3{font-size:13.5px;margin:3px 0 4px}
.link p{font-size:12.5px;color:var(--muted)}
.link .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.steps.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.steps.two{grid-template-columns:1fr}}
.step{background:var(--surface2);border-radius:8px;padding:13px 14px;min-width:0}
.step .n{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-fg);letter-spacing:.08em}
.step h3{font-size:14px;margin:4px 0 5px}
.step p{color:var(--muted);font-size:13px}
.stake{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.stake>div{padding:12px 14px;border-left:1px solid var(--line2);min-width:0}
.stake>div:first-child{border-left:0}
.stake .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.stake .l{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.stake{grid-template-columns:1fr 1fr}.stake>div:nth-child(3){border-left:0}.stake>div:nth-child(n+3){border-top:1px solid var(--line2)}}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;counter-reset:lp}
.loop span.st{background:var(--surface2);border:1px solid var(--line2);border-radius:20px;padding:4px 11px;font-size:12.5px}
.loop span.st::before{counter-increment:lp;content:counter(lp) " ";font-family:var(--font-mono);color:var(--accent-fg)}
.loop .ar{color:var(--muted)}

/* pills, tags, chips */
.pill{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.03em;border-radius:4px;padding:2px 7px;white-space:nowrap;line-height:1.5}
.pill.Low{background:var(--low-bg);color:var(--low)}
.pill.Medium{background:var(--med-bg);color:var(--med)}
.pill.High{background:var(--high-bg);color:var(--high)}
.pill.Extreme{background:var(--ext-bg);color:var(--ext)}
.sxl{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:4px;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap;line-height:1.6}
.tag.req{border-color:var(--fg);color:var(--fg);font-weight:600}
.tag.opt{border-style:dashed}
.tag.hid{border-color:var(--accent-fg);color:var(--accent-fg)}
.flag{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--fg);color:var(--bg);white-space:nowrap}
.flag.edit{background:var(--accent);color:var(--accent-ink)}
.st{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;border-radius:3px;padding:1px 6px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.st.ok{border-color:var(--ok);color:var(--ok)}
.st.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.st.act{background:var(--act-bg);border-color:transparent;color:var(--act);font-weight:600}
.site{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin-top:4px;background:var(--surface2);border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.site::before{content:"Kuwait · ";color:var(--accent-fg);font-weight:600}
.arrow{color:var(--muted);margin:0 4px}
.types{display:flex;gap:4px;flex-wrap:wrap}
.crit{display:inline-block;min-width:18px;text-align:center;font-family:var(--font-mono);font-size:10.5px;font-weight:500;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.crit.A{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.crit.B{border-color:var(--fg);color:var(--fg)}
.crit.C{color:var(--muted)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw.flat{border:0;border-radius:0}
.tw.in{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;vertical-align:bottom}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
th button.sort{all:unset;cursor:pointer}
th button.sort:focus-visible{outline:2px solid var(--accent)}
th[aria-sort] button.sort{color:var(--accent-fg)}
th[aria-sort="descending"] button.sort::after{content:" ↓"}
th[aria-sort="ascending"] button.sort::after{content:" ↑"}
tr.row td{cursor:pointer}
tr.row:hover td{background:var(--surface2)}
tr.row.open td{background:var(--accent-soft)}
tr.dim td{opacity:.6}
tr.cur td{background:var(--accent-soft)}
.rowbtn{all:unset;cursor:pointer;font-family:var(--font-mono);font-weight:500;white-space:nowrap;color:var(--fg)}
.rowbtn::before{content:"▸ ";color:var(--muted)}
.rowbtn[aria-expanded="true"]::before{content:"▾ "}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr.det>td{background:var(--surface2);padding:16px 16px 18px;cursor:default}
.deflist td:first-child{font-weight:600}
.f{min-width:0}
.f .l,.lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.f.wide{grid-column:1/-1}
.f.sep{border-top:1px dashed var(--line);padding-top:12px}
.chainv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 26px;counter-reset:c}
@media (max-width:760px){.chainv{grid-template-columns:1fr}}
.chainv>.f>.l::before{counter-increment:c;content:counter(c) "  ";color:var(--accent-fg)}
.sod{display:inline-grid;grid-template-columns:repeat(3,24px);gap:3px}
.sod span{font-family:var(--font-mono);font-size:11.5px;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:1px 0}
.sod span.e{border-color:var(--accent);color:var(--accent-fg)}
.rpn{font-family:var(--font-mono);font-weight:500}
.acts{display:grid;gap:8px}
.actline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:8px 10px}
.m-only{display:none}
@media (max-width:760px){.c-eff,.c-sys{display:none}}
@media (max-width:560px){.c-sod,.c-rpn,.c-type,.c-int,.c-craft,.c-hrs,.c-src,.c-why{display:none}.m-only{display:block}}

/* workshop steppers */
.scorer{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 10px;align-items:center}
.scorer .nm{font-size:12.5px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.stepper button{width:30px;height:30px;border:0;background:none;color:var(--fg);font:inherit;font-size:15px;cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:24px;text-align:center;font-family:var(--font-mono);font-weight:500}
.scorer .why{font-size:12px;color:var(--muted)}

/* asset tree */
.tree{font-size:13.5px}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--line2)}
.tree>ul{padding-left:0;border:0}
.tree li{padding:3px 0}
.tree .node{display:grid;grid-template-columns:118px minmax(0,1fr);gap:2px 10px;align-items:baseline;flex:1;min-width:0}
.tree .meta{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline;min-width:0}
.tree .eqrow{display:grid;grid-template-columns:118px 22px minmax(0,1fr);gap:2px 8px;align-items:baseline}
.tree .tagno{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
@media (max-width:600px){.tree .node{grid-template-columns:1fr}.tree .eqrow{grid-template-columns:22px minmax(0,1fr)}.tree .eqrow .tagno{grid-column:1/-1}}
.tree .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.tree button.nb{all:unset;cursor:pointer;border-radius:4px}
.tree button.nb:hover .nm{color:var(--accent-fg);text-decoration:underline}
.tree button.nb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tree details>summary{cursor:pointer;list-style:none;display:flex;gap:4px;align-items:baseline}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"▸";color:var(--muted);display:inline-block;width:14px;flex:none}
.tree details[open]>summary::before{content:"▾"}
.tagdec{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--font-mono);font-size:16px;margin-bottom:10px}
.tagdec span{border-bottom:2px solid var(--accent);padding:0 2px}

/* matrix */
.mxwrap{display:flex;gap:8px;align-items:stretch}
.axis{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.axis.v{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.mx{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:4px;max-width:600px;width:100%}
.mx .h{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:center;padding:2px;align-self:end;line-height:1.25}
.mx .h b,.mx .r b{display:block;font-size:12px;color:var(--fg)}
.mx .r{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:right;padding:2px 6px;align-self:center;line-height:1.25}
.mx .c{appearance:none;border:0;padding:0;font:inherit;box-sizing:border-box;aspect-ratio:1.3;max-width:100%;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--cell-ink)}
.mx div.c{cursor:default}
.mx .c .n{font-size:19px;font-weight:700;line-height:1}
.mx .c .sc{font-family:var(--font-mono);font-size:10px;font-weight:500}
.mx .c.Low{background:var(--low-cell)}
.mx .c.Medium{background:var(--med-cell)}
.mx .c.High{background:var(--high-cell)}
.mx .c.Extreme{background:var(--ext-cell)}
.mx .c[aria-pressed="true"],.mx .c.pin{box-shadow:inset 0 0 0 3px var(--cell-ink)}
.mx .c:focus-visible{outline:2px solid var(--accent);outline-offset:2px;z-index:2}
.mx .c.over::after{content:"";position:absolute;inset:-3px;border-radius:6px;pointer-events:none;border:0 solid var(--tol)}
.mx .c.bl::after{border-left-width:3px}
.mx .c.bb::after{border-bottom-width:3px}
.mx.edit .c{outline:1px dashed var(--cell-ink);outline-offset:-5px}
.mx.small{max-width:300px;gap:3px}
.mx.small .c{aspect-ratio:1.2}
.mx.small .c .n{font-size:13px}
.mx.small .c .sc{display:none}
.mx.small .h,.mx.small .r{font-size:9.5px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend .tl{display:inline-block;width:16px;height:0;border-top:3px solid var(--tol);vertical-align:3px;margin-right:5px}
.celllist{margin:0;padding-left:18px}
.celllist li{margin-bottom:4px}

/* bars */
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.barrow .bl{font-size:12.5px;color:var(--muted)}
.bar{display:flex;height:26px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.bar span{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--cell-ink);min-width:0;overflow:hidden}
.bar .Low{background:var(--low-cell)}.bar .Medium{background:var(--med-cell)}.bar .High{background:var(--high-cell)}.bar .Extreme{background:var(--ext-cell)}
.hbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:60px}
.hbar span{display:block;height:100%;background:var(--accent)}

/* worked example */
.walk{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.walk{grid-template-columns:1fr}}
.walk ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.walk ol button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.walk ol button:hover{background:var(--surface2)}
.walk ol button:focus-visible{outline:2px solid var(--accent)}
.walk ol button[aria-current="step"]{background:var(--accent-soft);font-weight:600}
.walk ol .wn{font-family:var(--font-mono);font-size:11px;color:var(--accent-fg);padding-top:2px}
.walk ol button.done .wn::after{content:" ✓";color:var(--ok)}
@media (max-width:900px){.walk ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.ws{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.ws .wr{display:grid;grid-template-columns:170px minmax(0,1fr);border-top:1px solid var(--line2)}
.ws .wr:first-child{border-top:0}
.ws .wr>div{padding:9px 12px;min-width:0}
.ws .wr>div:first-child{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.ws .wr.hide>div:last-child{color:var(--muted);font-style:italic;opacity:.55}
.ws .wr.hide>div:first-child{opacity:.55}
.ws .wr.now>div{background:var(--accent-soft)}
.ws .wr.now>div:first-child{color:var(--accent-fg);font-weight:500}
@media (max-width:600px){.ws .wr{grid-template-columns:1fr}.ws .wr>div:first-child{padding-bottom:2px}}
.explain{font-size:14.5px;line-height:1.6;max-width:70ch}
.explain p+p{margin-top:10px}
.walknav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}

/* work order & MOC */
.wo{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.wo .wh{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.wo .wh b{font-family:var(--font-mono);font-weight:500}
.wo .wb{padding:14px 16px;display:grid;gap:12px}
.wo .kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
@media (max-width:760px){.wo .kv{grid-template-columns:1fr 1fr}}
.wo ol{margin:0;padding-left:20px}
.wo ol li{margin-bottom:3px}
.wo .rec{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 12px;font-size:13px}
.wo .rec .blank{border-bottom:1px solid var(--line);height:18px}
.trace{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.trace>*{background:var(--surface2);border:1px solid var(--line2);border-radius:4px;padding:2px 7px}
.trace .ar{background:none;border:0;padding:0;color:var(--muted)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
.flow .segs{display:flex;gap:2px}
.flow .segs i{display:block;width:14px;height:6px;border-radius:2px;background:var(--line)}
.flow .segs i.done{background:var(--muted)}
.flow .segs i.now{background:var(--accent)}
.flow b{font-weight:500;color:var(--fg);white-space:nowrap}

/* glossary & popover */
button.term{all:unset;cursor:help;border-bottom:1px dotted var(--muted)}
button.term:hover{border-bottom-color:var(--accent);color:var(--accent-fg)}
button.term:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.termpop{position:absolute;z-index:45;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13px;display:grid;gap:6px}
.gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin:0}
@media (max-width:760px){.gl{grid-template-columns:1fr}}
.gl dt{font-weight:600;margin-top:12px}
.gl dd{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.gl .hit dt{color:var(--accent-fg)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.copybox{position:fixed;left:16px;right:16px;top:80px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.copybox textarea{width:100%;height:180px;font-family:var(--font-mono);font-size:11px;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:grid;min-width:270px;z-index:30}
.menu .pop button{all:unset;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px}
.menu .pop button:hover,.menu .pop button:focus-visible{background:var(--surface2)}
.menu .pop button small{display:block;color:var(--muted);font-size:11.5px}
/* plant diagram */
.dgcard{overflow:hidden}
.eqgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.dgscroll{overflow-x:auto}
.dgsvg{display:block;width:100%;min-width:980px;height:auto;font-family:var(--font-ui)}
.dgsvg .bbg{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
.dgsvg .bbg.Low{fill:var(--low-bg);stroke:var(--low)}
.dgsvg .bbg.Medium{fill:var(--med-bg);stroke:var(--med)}
.dgsvg .bbg.High{fill:var(--high-bg);stroke:var(--high)}
.dgsvg .bbg.Extreme{fill:var(--ext-bg);stroke:var(--ext)}
.dgsvg .shared .bbg{stroke-dasharray:6 4}
.dgsvg .blk.on .bbg{stroke:var(--fg);stroke-width:2.5}
.dgsvg .bt{font-size:12.5px;font-weight:600;fill:var(--fg)}
.dgsvg .bk{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.dgsvg .bhead,.dgsvg .dgc,.dgsvg .brg{cursor:pointer}
.dgsvg .bhead:hover .bt{fill:var(--accent-fg);text-decoration:underline}
.dgsvg .chipbg{fill:var(--surface);stroke:var(--line)}
.dgsvg .dgc:hover .chipbg{stroke:var(--fg)}
.dgsvg .dgc.on .chipbg{stroke:var(--fg);stroke-width:2.5}
.dgsvg .chipt{font-size:11.5px;fill:var(--fg)}
.dgsvg .chipn{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.dgsvg .band.Low{fill:var(--low-cell)}.dgsvg .band.Medium{fill:var(--med-cell)}.dgsvg .band.High{fill:var(--high-cell)}.dgsvg .band.Extreme{fill:var(--ext-cell)}
.dgsvg .brg circle{stroke:var(--fg);stroke-width:1.5}
.dgsvg :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dgsvg .fl{fill:none;stroke-width:2.2}
.dgsvg .fl.dash{stroke-dasharray:6 4}
.dgsvg .fl.dot{stroke-dasharray:2 3;stroke-width:1.5}
.dgsvg .fl.air{stroke:var(--c-air)}.dgsvg .mk.air{fill:var(--c-air)}
.dgsvg .fl.gas{stroke:var(--c-gas);stroke-width:3.5}.dgsvg .mk.gas{fill:var(--c-gas)}
.dgsvg .fl.fuel{stroke:var(--c-fuel)}.dgsvg .mk.fuel{fill:var(--c-fuel)}
.dgsvg .fl.oil{stroke:var(--c-oil)}.dgsvg .mk.oil{fill:var(--c-oil)}
.dgsvg .fl.water{stroke:var(--c-water)}.dgsvg .mk.water{fill:var(--c-water)}
.dgsvg .fl.elec{stroke:var(--c-elec)}.dgsvg .mk.elec{fill:var(--c-elec)}
.dgsvg .fl.shaft,.dgsvg .shaft{stroke:var(--c-shaft)}.dgsvg .mk.shaft{fill:var(--c-shaft)}
.dgsvg .shaftline{fill:none;stroke:var(--c-shaft);stroke-width:5;stroke-linecap:round}
.dgsvg .fll{font-size:10.5px;fill:var(--muted)}
.dgsvg .encl{fill:none;stroke:var(--c-elec);stroke-width:1.5;stroke-dasharray:3 4}
.dgsvg .encl-t{font-size:10.5px;fill:var(--c-elec)}
.dgsvg .oos{fill:var(--surface2);stroke:var(--line);stroke-dasharray:5 4}
.dgsvg .oos-t{font-size:12px;font-weight:600;fill:var(--muted)}
.dgsvg .oos-s{font-size:10.5px;fill:var(--muted)}
.dgsvg .hatch{stroke:var(--line);stroke-width:2}
.dgpanel{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 70px);width:min(430px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;z-index:25;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.dgx{float:right;margin:-4px -4px 6px 8px}
@media (max-width:760px){.dgpanel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:72vh;border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.eqlist{display:grid;gap:4px}
.eqi{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line2);border-radius:6px;cursor:pointer;font-size:13px}
.eqi:hover{border-color:var(--muted)}
.eqi:disabled{cursor:default;opacity:.6}
.eqi:focus-visible{outline:2px solid var(--accent)}
.eqi-n{display:flex;flex-direction:column;min-width:0}
.fmcs{display:grid;gap:6px}
.fmc{border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.fmc.open{border-color:var(--fg)}
.fmc-h{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;font-size:13px}
.fmc-h:focus-visible{outline:2px solid var(--accent)}
.fmc-m{font-weight:600}
.fmc-b{padding:4px 10px 12px;border-top:1px dashed var(--line);font-size:13px}
.fmc-b .chainv{grid-template-columns:1fr}

/* schedule */
.sched table{font-size:12px}
.sched th.sc,.sched td.sc{text-align:center;padding:6px 3px;min-width:44px}
.sched td.sc{border-left:1px solid var(--line2)}
.sched .pk{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--surface2) 6px 9px)}
.sched .stk{position:sticky;left:0;background:var(--surface);min-width:230px;z-index:1}
.sched th.stk{background:var(--surface2)}
.sched tr.grp td{background:var(--surface2);font-weight:600;font-size:12.5px}
.due{display:inline-block;font-family:var(--font-mono);font-size:10.5px;font-weight:600;border-radius:3px;padding:1px 4px;color:var(--cell-ink);white-space:nowrap}
.due.Low{background:var(--low-cell)}.due.Medium{background:var(--med-cell)}.due.High{background:var(--high-cell)}.due.Extreme{background:var(--ext-cell)}
.due.opt{background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.due sup{font-size:8px}
.loadc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:170px}
.lc{display:flex;flex-direction:column;align-items:stretch;height:100%;min-width:0}
.lcb{flex:1;display:flex;flex-direction:column-reverse;border-radius:3px;overflow:hidden;background:var(--surface2)}
.lcb span{display:block;width:100%}
.lcn{font-family:var(--font-mono);font-size:10px;text-align:center;color:var(--fg);margin-top:3px}
.lcl{font-family:var(--font-mono);font-size:9.5px;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden}
.cr-MECH{background:var(--c-oil)}.cr-ELEC{background:var(--c-elec)}.cr-INST{background:var(--c-air)}.cr-OPS{background:var(--c-water)}.cr-CHEM{background:var(--c-fuel)}.cr-ENG{background:var(--c-gas)}.cr-CONTR{background:var(--c-shaft)}
.legend .sw[class*="cr-"]{border:0}

/* live monitoring */
.lv{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spk{display:block}
.spk polyline{fill:none;stroke:var(--fg);stroke-width:1.5}
.spk .lim{stroke-width:1}
.spk .lim.warn{stroke:var(--warn);stroke-dasharray:3 2}
.spk .lim.act{stroke:var(--act)}
.evlog{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:260px;overflow:auto;font-size:13px}
.evlog li{padding:4px 8px;border-left:3px solid var(--line);background:var(--surface2);border-radius:0 4px 4px 0}
.evlog li.warn{border-left-color:var(--warn)}
.evlog li.act{border-left-color:var(--act)}
nav.rail .badge.alert:not(:empty){background:var(--act-bg);color:var(--act);border-radius:8px;padding:0 6px;font-weight:600}
.tw.flat th{white-space:normal}
/* maintenance class labels */
.mt{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:3px;border:1px solid transparent;white-space:nowrap;vertical-align:1px}
.mt i{font-style:normal;font-weight:400;opacity:.85}
.mt-PM{color:var(--pm);background:var(--pm-bg);border-color:color-mix(in srgb,var(--pm) 30%,transparent)}
.mt-PdM{color:var(--pdm);background:var(--pdm-bg);border-color:color-mix(in srgb,var(--pdm) 30%,transparent)}
.mt-CM{color:var(--cm);background:var(--cm-bg);border-color:color-mix(in srgb,var(--cm) 30%,transparent)}
.mtlegend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.mtlegend .mt{margin-right:-8px}
/* today's tickets */
.tkbtn{display:inline-flex;gap:6px;align-items:center}
.tkbtn .badge:empty{display:none}
.tksum{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-bottom:12px}
.tkclock{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:170px}
.tkclock b{font-size:14px}
.tkf{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tkf b{font-size:20px}
.tkf[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tkf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tkboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:1180px){.tkboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.tkboard{grid-template-columns:1fr}}
.tkcol{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:10px;display:grid;gap:8px;min-width:0}
.tkcol h2{margin:0 0 2px;font-size:13.5px;display:flex;justify-content:space-between}
.tk-up .tk{opacity:.72;border-style:dashed}
.tkempty{margin:2px 0}
.tk:focus{outline:2px solid var(--accent);outline-offset:1px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;display:grid;gap:5px;min-width:0}
.tk.od{border-color:var(--warn)}
.tk.new{animation:tkin .5s ease-out;box-shadow:0 0 0 2px var(--accent)}
@keyframes tkin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.tk-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tk-time{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.tk-u{margin-left:auto;font-size:12px;font-weight:600}
.tk-t{font-size:13.5px;line-height:1.35}
.tk-m{line-height:1.3}
.tk-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tk-done .tk{opacity:.8}
.tkpops{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:55;display:grid;gap:8px;width:min(340px,calc(100vw - 32px))}
.tkpop{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px 12px;display:grid;gap:4px;animation:tkin .35s ease-out;transition:opacity .6s,transform .6s}
.tkpop.cm{border-left-color:var(--cm)}
.tkpop.out{opacity:0;transform:translateX(12px)}
.tkpop-h{display:flex;gap:6px;align-items:center}
.tkpop-t{font-size:13.5px;font-weight:600;line-height:1.35}
.tkx{all:unset;cursor:pointer;margin-left:auto;font-size:18px;line-height:1;color:var(--muted);padding:0 4px}
.tkx:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.tk.new,.tkpop{animation:none}.tkpop{transition:none}}
/* Msaaed assistant */
:lang(ar){font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}

.wpby{font-size:11.5px;color:var(--ok);padding-left:27px}

<script>
"use strict";
/* ================= DATA ================= */
const SYSTEMS = [{"k":"INL","kks":"MBL","code":"11MBL","name":"Inlet air filtration & evaporative cooling"},
{"k":"CMP","kks":"MBC","code":"11MBC","name":"Axial compressor (18 stages), IGVs & bleed valves"},
{"k":"CMB","kks":"MBM","code":"11MBM","name":"DLN 2.0+ combustion system (18 cans), flame detection & ignition"},
{"k":"HGP","kks":"MBB","code":"11MBB","name":"Turbine hot gas path (3 stages)"},
{"k":"EXH","kks":"MBR","code":"11MBR","name":"Exhaust frame, diffuser & exhaust temperature"},
{"k":"BRG","kks":"MBD","code":"11MBD","name":"Rotor bearings & vibration protection"},
{"k":"FG","kks":"MBP","code":"11MBP","name":"Fuel gas system (unit module)"},
{"k":"LF","kks":"MBN","code":"11MBN","name":"Liquid fuel, atomizing air & NOx water injection"},
{"k":"LO","kks":"MBV","code":"11MBV","name":"Lube oil & hydraulic / trip oil"},
{"k":"CCW","kks":"PGB","code":"10PGB","name":"Closed cooling water to GT auxiliaries (shared, seawater-cooled)"},
{"k":"SU","kks":"MBJ","code":"11MBJ","name":"Static starter (LCI) & turning gear"},
{"k":"GEN","kks":"MKA","code":"11MKA","name":"Generator, excitation, hydrogen cooling & seal oil"},
{"k":"CTL","kks":"CJP","code":"11CJP","name":"Mark VIe control, control compartment & 125 V DC supply"},
{"k":"FP","kks":"CYE","code":"11CYE","name":"Fire detection, CO₂ protection & enclosure ventilation"}];
const FM = [{"id":"FM-01","sys":"INL","tag":"11MBL10AT002","eq":"Final-stage inlet filter elements","short":"Inlet filters","fn":"Deliver clean air to the compressor with the final-stage pressure drop below the OEM alarm limit","mode":"Final-stage elements blocked by dust: high pressure drop","mech":"Particle loading (dust)","cause":"Shamal dust storms load the elements fast. In humid weeks dust cakes on wet pre-filter pads and passes on. Pads are changed only when they look dirty.","local":"High inlet pressure drop; implosion (blow-in) doors, where fitted, may open and admit unfiltered air; elements can collapse and let dust through","plant":"About 0.35 % output loss for every extra 25 mm H₂O of inlet ΔP (GE guidance). That is about 0.8 MW on a 230 MW summer unit. After the alarm in a storm, the unit runs at reduced load. Then it must stop in peak summer for a full element change. The element set (about KD 26 k), labour and about 3 days of equivalent lost output cost about KD 0.1 M per event. If elements collapse first, dust reaches the compressor.","sBasis":"Cost: about KD 0.1 M per event, the low end of the KD 0.1–1 M column (element set about KD 26 k, labour, and about 3 days of equivalent lost output at about KD 35 k a day)","det":"ΔP transmitter with a high-ΔP alarm in the Mark VIe. Nobody trends the reading, so in a dust storm the alarm gives only hours of warning.","ctrl":"Final elements changed only after the alarm; pre-filter pads changed when they look dirty","hidden":false,"site":"Shamal dust","iso":"PLU","s":3,"o":4,"d":2,"rs":3,"ro":2,"rd":1,"why":"Basis for the two-step likelihood drop: elements are changed on the trend in the cool months, so every summer starts with clean elements and a storm no longer pushes them to the alarm. The coalescing stage (A-01c) also removes the humid-dust cause. Detection improves because the slow loading between storms is trended weeks ahead.","walk":{"intro":"We follow one line of the FMEA from start to finish: the inlet filters on GT1. Every operator in Kuwait knows this problem. A shamal dust storm blocks the filters and the unit loses power.","asset":"The filter house cleans all the air the gas turbine breathes, about 600 kg every second. The last stage of filters (tag 11MBL10AT002) stops fine dust from reaching the compressor blades.","fn":"The function has a number we can check: clean air, with the pressure drop below the OEM alarm limit. Above that limit the filters have failed their job, even if nothing is broken.","mode":"The failure mode is simple: the final filters are blocked by dust, so the pressure drop rises. In a dust storm this can happen in hours.","cause":"Shamal storms carry very fine dust. In humid weeks the dust cakes on wet pre-filter pads and passes on to the final filters. Today the pads are changed only when they look dirty.","effect":"Every extra 25 mm H₂O of pressure drop costs about 0.35 % of output, about 0.8 MW on a summer afternoon. When the alarm comes, the unit must stop in peak summer to change filters. If a filter collapses first, dust reaches the compressor.","det":"A pressure transmitter and an alarm exist today. But nobody trends the reading. In a storm the alarm gives only hours of warning.","s":"The worst believable outcome is a forced filter change in peak summer. The unit first runs at reduced load, then stops. The filter set (about KD 26 k), labour and about 3 days of lost output at KD 35 k a day cost about KD 0.13 M per event: the low end of the KD 0.1 to 1 M column.","o":"With today's practice a forced summer change happens about once a year on each unit. It comes with every shamal season.","d":"The alarm gives hours of warning, not days. Operators can reduce load, but they cannot avoid the stop.","acts":"Three actions. First, trend the pressure drop and change the filters on the trend in the cool months, before any alarm. Second, change the pre-filter pads in March and September. Third, study a coalescing pre-filter stage that stops humid dust.","residual":"Severity stays 3, because a blocked filter still costs the same. Likelihood drops two steps to 2: elements are changed on the trend in the cool months, so each summer starts with clean elements and a storm no longer reaches the alarm; once built, the new stage removes the humid-dust cause. Detection becomes 1 because the slow loading between storms is trended weeks ahead. The risk moves from High to Medium."},"chain":{"fn":"Clean air, with the filter pressure drop below the OEM alarm limit","mode":"Final filters blocked by dust","cause":"Shamal dust storms; in humid weeks dust cakes on wet pre-filter pads and passes on","effect":"About 0.8 MW lost, then a forced stop in peak summer to change filters: about KD 0.1 M each time","det":"Only an alarm, giving hours of warning in a storm; nobody trends the reading","acts":"Trend the pressure drop and change filters before summer; change pre-filters in March and September; add a coalescing stage"}},
{"id":"FM-02","sys":"INL","tag":"11MBL20AH001","eq":"Evaporative cooler media & drift eliminators (+ inlet duct and silencer)","fn":"Cool inlet air by evaporation without carrying water, salt or loose parts into the compressor","mode":"Water and salt carry-over into the compressor; corroded inlet parts come loose","mech":"Corrosion and erosion (water and salt carry-over)","cause":"Sump water too concentrated because blowdown is set by hand; damaged drift eliminators; fouled media; humid, salty air rusting carbon-steel duct liner, silencer panels and fasteners","local":"Wet, salt-laden air at the compressor inlet; rust and loose metal in the inlet duct","plant":"Pitting and leading-edge erosion of R0/R1 blades. When found at borescope, blade replacement takes 2–4 weeks out of service (KD 1–3 M). Left alone, it starts the cracks in FM-04. Also fouling and output loss. A loose inlet part that reaches the compressor is scored in FM-04, not here.","sBasis":"Production: 2 weeks–3 months on one GT (R0/R1 blade replacement, 2–4 weeks)","det":"Media inspected once a year. Sump water and drift eliminators are not checked. Pitting is found only when the compressor is borescoped at outages.","ctrl":"Annual media inspection; blowdown set by hand; inlet duct looked at only at major outages","hidden":false,"site":"Humidity & salt","iso":"PDE","s":4,"o":3,"d":4,"rs":4,"ro":2,"rd":3,"why":"Residual Medium on S4. Evaporative cooling is needed for summer output, so some carry-over risk stays. Lower likelihood would mean giving up the cooler on humid days, an output choice for the owner."},
{"id":"FM-03","sys":"CMP","tag":"11MBC10HB001","eq":"Compressor blading (all stages) & water-wash skid","fn":"Compress air at design efficiency and surge margin, within the agreed loss from the post-wash baseline","mode":"Blade fouling: compressor efficiency and output fall","mech":"Fouling","cause":"Fine dust and salt passing the filters; oil mist from bearing seals; poor-quality wash water or blocked wash nozzles","local":"Lower airflow and pressure ratio; less surge margin","plant":"2–5 % output loss and higher heat rate. A typical episode (about 3.5 % for 30 days) equals about 1 day of lost generation on one GT.","sBasis":"Production: 8 h–3 days equivalent (about 1 day per fouling episode: 3.5 % × 30 days)","det":"Performance data are in the historian but nobody reviews them. Operators notice only when the MW drop is large.","ctrl":"Offline wash only at planned outages; online wash run without a set frequency; wash water checked occasionally","hidden":false,"site":"Shamal dust","iso":"LOO","s":2,"o":5,"d":4,"rs":2,"ro":4,"rd":1},
{"id":"FM-04","sys":"CMP","tag":"11MBC10HB001","eq":"Compressor R0/R1 rotor blades","fn":"Carry airflow through the front stages across the full IGV range, with no cracks beyond GE limits","mode":"Front compressor blades (R0/R1) crack from fatigue and a piece breaks off","mech":"High-cycle fatigue from corrosion pits","cause":"Corrosion pitting from humid, salty air and wet standby periods (FM-02); leading-edge erosion from water carry-over and online washing; tip cracking; stator-vane shim migration; foreign objects from corroded inlet parts. R0 is a known 9FA risk since the 2001 Black Point failure.","local":"A blade fragment passes through the compressor","plant":"Downstream stages wrecked; compressor rotor and casing repair. Without a spare rotor: 4–6 months out of service and several KD million.","sBasis":"Production: more than 3 months on one GT (compressor rebuild, 4–6 months). Residual S4: exchange rotor in 6–8 weeks (A-SP1).","det":"Vibration trip acts only when a blade lets go. Cracks are found only by borescope at planned outages, one to two years apart or more.","ctrl":"Borescope only at planned outages; GE TIL 1509 and TIL 1562 compliance not tracked per unit","hidden":false,"site":"Humidity & salt","iso":"STD","s":5,"o":2,"d":4,"rs":4,"ro":1,"rd":3,"why":"Residual Medium on S4. A blade failure cannot be ruled out on any compressor. Borescope about every 4,000 fired hours and GE's TIL fixes keep it rare; the exchange rotor (A-SP1) limits the outage."},
{"id":"FM-05","sys":"CMP","tag":"11MBC10AA001","eq":"Inlet guide vanes (IGVs), actuator & LVDTs","fn":"Follow the IGV angle demand at load, and close to minimum angle on every shutdown and trip","mode":"IGVs stick or lag at load, or fail to close on shutdown or trip","mech":"Sticking, sensor drift, logic error","cause":"Worn IGV bushings; drift of the IGV position sensors (LVDTs); varnish or particles in the hydraulic oil sticking the servo (FM-25); logic or trip-input fault on one trip path (FM-34)","local":"Wrong airflow at load; IGVs stay open while the unit slows down","plant":"Compressor surge or rotating stall during start-up or coast-down. This stresses the front-stage blades (R0/S0) and can end in blade failure: 4–6 months out of service without a spare rotor. At load, wrong airflow upsets exhaust-temperature and DLN mode control.","sBasis":"Production: more than 3 months on one GT (front-stage blade failure after surge). Residual S4: exchange rotor in 6–8 weeks (A-SP1).","det":"Position-mismatch alarm catches gross sticking at load. Close time on coast-down is not trended. A fault on one trip path (for example the fire trip) shows only when that trip happens.","ctrl":"LVDTs calibrated at major outages only; IGV bushings checked at the CI within GE scope","hidden":true,"iso":"FTC","s":5,"o":1,"d":4,"rs":4,"ro":1,"rd":2,"why":"Residual Medium on S4. The close-on-trip function can still fail between tests. Surge damage from the IGVs is already rare; the exchange rotor (A-SP1) cuts the outage."},
{"id":"FM-06","sys":"CMP","tag":"11MBC40AA001","eq":"Compressor start-up bleed valves & 20CB solenoid","fn":"Open during start-up and shutdown to keep the compressor out of surge at low speed","mode":"One or more bleed valves fail to open on shutdown or trip","mech":"Seizure, sticking solenoid","cause":"Actuator seized or cylinder scored by wet, dirty actuating air; 20CB solenoid valve stuck; linkage binding. The valves are spring-loaded open, so loss of air opens them; it does not cause this failure.","local":"No bleed flow at low speed; surge margin lost","plant":"Compressor surge during coast-down or start-up. Worst case: front-stage blade damage needing a 2–6 week repair (KD 1–3 M). Most events only abort a start.","sBasis":"Production: 2 weeks–3 months on one GT (surge blade damage, 2–6 weeks)","det":"Limit-switch mismatch alarm on every start and shutdown, so the valves are proven about 80 times a year. Travel time is not trended.","ctrl":"Positions checked only when an alarm appears; the valves cannot be stroke-tested at load","hidden":false,"iso":"FTO","s":4,"o":2,"d":3,"rs":4,"ro":1,"rd":2,"why":"Residual Medium on S4. The valves can only be proven at start and stop, never at load. One slow valve on a trip is still possible."},
{"id":"FM-07","sys":"CMB","tag":"11MBM10AV001","eq":"DLN 2.0+ fuel nozzles & combustors (18 cans)","fn":"Burn gas at low NOx with combustion dynamics below the OEM limits in every DLN mode and load","mode":"High combustion dynamics (pressure pulsations in the cans)","mech":"Combustion instability","cause":"Change in Modified Wobbe Index: gas composition (for example imported liquefied natural gas blended in summer) or fuel-gas temperature after a heater trip (FM-17); tuning drift with large seasonal ambient swings; cracked or coked fuel nozzle","local":"Pulsations shake liners, transition pieces and fuel nozzles; risk of flashback into a nozzle","plant":"Cracked liners or transition pieces, or a burned fuel nozzle, need a hardware change: 2–3 weeks out of service, KD 1–3 M. Before that: automatic load cuts (runbacks), trips and NOx excursions.","sBasis":"Production: 2 weeks–3 months on one GT (combustion hardware change after dynamics damage, 2–3 weeks)","det":"Dynamics monitor with an alarm in the Mark VIe: minutes of warning. Values are not trended, and gas composition is not measured online.","ctrl":"GE tunes the combustion system only at outages; no seasonal tuning; no Modified Wobbe Index monitoring","hidden":false,"site":"50 °C ambient","iso":"VIB","s":4,"o":3,"d":2,"rs":4,"ro":2,"rd":1,"why":"Residual Medium on S4. Gas quality and ambient keep changing, so dynamics events cannot be removed. Seasonal tuning and a Wobbe alarm give warning; the damage itself still costs weeks."},
{"id":"FM-08","sys":"CMB","tag":"11MBM10HA001","eq":"Combustion liners & transition pieces (18 sets)","fn":"Contain the flame and carry hot gas to the stage 1 nozzle, with cracks and coating loss inside OEM repair limits","mode":"Cracking, wear or thermal-barrier coating loss on liners and transition pieces","mech":"Thermal fatigue, coating spallation","cause":"Fired hours and starts; trips from high load; high dynamics (FM-07); hot streak from a damaged fuel nozzle","local":"Loss of cooling and local overheating; pieces of liner or seal can break off","plant":"Liberated pieces damage the stage 1 nozzle and buckets: hot gas path repair, 4–8 weeks out of service, KD 1–3 M.","sBasis":"Production: 2 weeks–3 months on one GT (hot gas path repair after liberated material, 4–8 weeks)","det":"Found only at the combustion inspection; no borescope between CIs. Exhaust spread shows a large failure only after it happens.","ctrl":"Combustion inspection on a calendar basis; hours, starts and trips not tracked per hardware set","hidden":false,"iso":"STD","s":4,"o":3,"d":4,"rs":4,"ro":2,"rd":3,"why":"Residual Medium on S4. Liners and transition pieces wear with every start and hour. Factored-hours CIs and a yearly borescope find cracks early, but cracking between inspections stays possible."},
{"id":"FM-09","sys":"CMB","tag":"11MBM10CR001","eq":"Flame detectors (typically 4 per unit)","fn":"Report flame correctly so the protection trips only on a real flame-out","mode":"False loss-of-flame signal: unit trips with flame present","mech":"Optical fouling, moisture (spurious signal)","cause":"Lens or sight-glass fouling; condensation on the sight glass in humid weather; cable or connector damage in a hot compartment","local":"The unit's voting logic sees loss of flame and trips the unit","plant":"Spurious trip; restart within hours. In summer peak (May–Sep) every trip costs generation and adds to the hot gas path trip count.","sBasis":"Production: a unit trip during summer peak (May–Sep)","det":"Detector fault and flame-disagreement alarms in the Mark VIe give minutes of warning. Signal strength is not trended.","ctrl":"Detectors cleaned only when an alarm appears","hidden":false,"site":"Humidity & salt","iso":"UST","s":2,"o":3,"d":2,"rs":2,"ro":2,"rd":1},
{"id":"FM-10","sys":"CMB","tag":"11MBM10CR001","eq":"Flame detectors & loss-of-flame fuel trip","fn":"Shut off fuel within seconds if the flame goes out","mode":"Flame-out not detected: fuel keeps flowing","mech":"Common-cause detector blinding, logic error","cause":"Several detectors blinded at once (same fouling, same moisture path, same cable route); voting-logic error after a software change","local":"Unburnt fuel gas fills the combustors and the exhaust path","plant":"Gas ignites in the hot exhaust duct or HRSG: explosion with fatality potential and months of repair. (Fuel valves that fail to close are FM-20.)","sBasis":"Safety: explosion in the exhaust duct or HRSG, fatality possible","det":"Detector self-check and disagreement alarms catch one bad detector, not several blinded at once. The trip from detector to fuel valves is never proven end to end.","ctrl":"Detectors cleaned when an alarm appears; control logic changed without a trip test","hidden":true,"iso":"FTF","s":5,"o":1,"d":4,"rs":5,"ro":1,"rd":2,"why":"S5 L1 stays High. A flame-out on a gas-fired unit can never be ruled out. The trip chain is proven every year and the detector signals are trended. The Plant Manager signs this as ALARP for 12 months."},
{"id":"FM-11","sys":"CMB","tag":"11MBM20AV001","eq":"Spark plugs, ignition transformers & crossfire tubes","fn":"Light the cans fitted with spark plugs at start-up and carry the flame through crossfire tubes to all 18 cans","mode":"Unit fails to light, or the flame does not cross-fire to every can","mech":"Wear, binding","cause":"Binding or worn spark plug; ignition transformer fault; cracked or burned crossfire tube","local":"Start aborted on no flame or high exhaust spread","plant":"Start delayed by a purge and a retry: normally a few hours lost, no damage.","sBasis":"Production: under 8 h on one GT","det":"A fault shows only as a failed start. Plugs and tubes are checked only at the CI.","ctrl":"Spark plugs and crossfire tubes inspected at every CI (GE checklist); one spare spark plug and one ignition transformer in stores","hidden":false,"iso":"FTS","s":1,"o":3,"d":4,"rs":1,"ro":3,"rd":4,"keep":"No new task. A failed light-off costs a purge and a retry, a few hours at most. GE's CI checks already cover the wear, and spares are in stores. More inspection would cost more than the risk it removes."},
{"id":"FM-12","sys":"HGP","tag":"11MBB10HB001","eq":"Stage 1 buckets & nozzles","fn":"Turn hot gas into shaft power with airfoils intact, coating present and cooling holes open until the next OEM inspection","mode":"Stage 1 turbine blades (buckets) or vanes (nozzles) wear out from heat, oxidation, coating loss or hot corrosion, then fail","mech":"Creep, oxidation, hot corrosion","cause":"Accumulated fired hours and starts; hours in peak-fire mode used to recover summer output (each peak-fire hour can count as two or more base-load hours); hot corrosion from salt and sulfur; fine dust blocking cooling holes","local":"Thin or cracked airfoils; blocked cooling holes overheat the metal","plant":"Bucket or nozzle failure: heavy damage to downstream stages. Typically 3–6 months out of service unless replacement parts are on hand.","sBasis":"Production: more than 3 months on one GT","det":"Borescope only at the hot gas path inspection. Exhaust spread does not show creep or coating loss until parts fail.","ctrl":"HGPI every 24,000 actual fired hours; peak-fire hours not factored; no borescope between inspections","hidden":false,"site":"Summer peak firing","iso":"STD","s":5,"o":2,"d":4,"rs":5,"ro":1,"rd":3,"why":"S5 L1 stays High. Bucket life is set by firing temperature and hours. Factored-hours HGPI and a yearly borescope are the most maintenance can do. Less peak firing in summer would lower the risk further. That is an output-versus-risk choice for the owner."},
{"id":"FM-13","sys":"EXH","tag":"11MBR10CT001","eq":"Exhaust thermocouples (31)","fn":"Measure exhaust temperature for control and protection, each thermocouple within the OEM accuracy band","mode":"Thermocouples fail or drift, giving a false high spread","mech":"Sensor failure, drift","cause":"Element breakage from heat and vibration; insulation damage; moisture in junction boxes","local":"False spread reading; failed elements are rejected by the Mark VIe","plant":"Spurious high-spread alarm, or a trip if failed thermocouples sit next to each other. In summer peak (May–Sep) a trip costs generation. Rejected thermocouples also weaken combustion monitoring (FM-07).","sBasis":"Production: a unit trip during summer peak (May–Sep)","det":"Mark VIe spread alarm and open-circuit diagnostics give minutes of warning. Each thermocouple is not compared with its neighbours.","ctrl":"Thermocouples replaced only after they fail","hidden":false,"iso":"AIR","s":2,"o":3,"d":2,"rs":2,"ro":2,"rd":1},
{"id":"FM-14","sys":"EXH","tag":"11MBR10HA001","eq":"Exhaust frame, diffuser insulation & fasteners","fn":"Contain and insulate exhaust gas at about 600–650 °C, keeping casing and HRSG inlet within temperature limits","mode":"Insulation packs or fasteners come loose","mech":"Thermal cycling, vibration loosening","cause":"Thermal cycling from frequent winter starts; vibration events; fasteners relax at high temperature; damaged flex seals","local":"Loose insulation in the gas path; hot spots on the casing","plant":"Casing hot spots and distortion; loose pieces can damage the HRSG inlet. Repair takes 3–14 days on one GT (KD 0.1–1 M).","sBasis":"Production: 3–14 days on one GT (casing and HRSG-inlet repair)","det":"Visual inspection at major outages only; no casing hot-spot survey","ctrl":"Insulation and fasteners checked only at major outages","hidden":false,"iso":"STD","s":3,"o":2,"d":4,"rs":3,"ro":1,"rd":3},
{"id":"FM-15","sys":"EXH","tag":"11MBH20AN001","eq":"Exhaust-frame cooling blowers 88TK-1/-2 (lead/lag)","fn":"Keep cooling air flowing to the exhaust frame struts and No. 2 bearing area, with one blower always available","mode":"Cooling air lost: both blowers unavailable, or discharge check damper stuck","mech":"Motor failure in heat, dust blockage","cause":"Motor failure in 50 °C heat; blower inlet filter blocked by dust; standby fails to start; check damper jammed","local":"Exhaust frame and No. 2 bearing area overheat","plant":"The unit must be unloaded and stopped if a blower is not restored, typically within 20–30 minutes. It cannot reload until one runs. With no spare motor on site, a rewind keeps the unit off 1–2 weeks.","sBasis":"Production: 3–14 days on one GT (waiting for a motor rewind; no spare motor held)","det":"Discharge pressure switch and blower-running alarms: minutes of warning. Motor condition is not trended.","ctrl":"Standby blower auto-starts on low pressure, but the changeover is never tested; inlet filters cleaned only when blocked","hidden":false,"site":"50 °C + dust","iso":"FTS","s":3,"o":2,"d":2,"rs":2,"ro":1,"rd":1},
{"id":"FM-16","sys":"BRG","tag":"11MBD10HD001","eq":"No. 1 journal & thrust bearing (compressor end) and No. 2 journal bearing (exhaust end)","fn":"Support and locate the rotor on a stable oil film at all speeds, with vibration and metal temperature inside OEM limits","mode":"Bearing damage: the white-metal lining wipes (babbitt wipe), or a thrust pad fails","mech":"Wear and wipe (oil film breakdown)","cause":"Dirty or varnished oil (FM-25); oil too hot (FM-23) or lost on coast-down (FM-24); misalignment after an outage; restart with a bowed rotor (FM-29); shaft currents from a worn shaft-grounding brush","local":"Bearing metal temperature and vibration rise; the oil film breaks down","plant":"Trip on high vibration or bearing temperature. The bearing is replaced and the journal repaired: about 2–6 weeks out of service on one GT.","sBasis":"Production: 2 weeks–3 months on one GT (bearing and journal repair, about 2–6 weeks)","det":"Continuous vibration and bearing metal temperature with alarm and trip. Trends are not reviewed, so slow changes are seen only at the alarm.","ctrl":"Vibration and bearing-temperature protection; quarterly oil sample (particle count only); alignment checked only when a bearing is opened","hidden":false,"iso":"VIB","s":4,"o":2,"d":2,"rs":4,"ro":1,"rd":1,"why":"S4 × L1 stays Medium. A wipe still costs weeks out of service, and maintenance cannot change that. Monthly trends and oil wear metals (A-25a) now give weeks of warning for the slow causes."},
{"id":"FM-17","sys":"FG","tag":"11MBP10AT001","eq":"Fuel gas conditioning: start-up heater, performance heater & filter-separator","fn":"Deliver gas with at least 28 °C (50 °F) superheat above the higher of the hydrocarbon and water dew points at the gas stop/speed ratio valve inlet (GE GEI 41040)","mode":"Liquids or water carried with the fuel gas into the combustors","mech":"Condensation and carry-over (contamination)","cause":"Start-up (dew-point) heater or performance heater out of service; performance-heater tube leak putting water into the gas; high filter-separator level; heavier gas raising the dew point","local":"Liquid slugs reach the DLN fuel nozzles. Colder gas also shifts the Modified Wobbe Index (see FM-07).","plant":"Flashback and burned fuel nozzles and liners: 2–4 weeks out of service on one GT and about KD 1–3 M of repair.","sBasis":"Production/cost: 2–4 weeks on one GT and KD 1–3 M (combustion hardware replacement)","det":"Heater outlet temperature alarm. Dew point is known only from a monthly lab gas sample. Filter-separator level and ΔP are read locally on rounds.","ctrl":"Heater temperature alarm; filter-separator drained only when the high-level alarm comes in","hidden":false,"iso":"PDE","s":4,"o":3,"d":3,"rs":4,"ro":2,"rd":2,"why":"Residual S4·L2 is Medium (was High). One liquid slug can still damage the combustors. The superheat limit, dew-point analyser and heater tube tests make it unlikely. The next step would be a change to the gas supply specification."},
{"id":"FM-18","sys":"FG","tag":"11MBP20AT001","eq":"Fuel gas strainer (final, ahead of the gas valves)","fn":"Remove particles ahead of the gas valves, with ΔP below the OEM change-out limit","mode":"Strainer plugs: high differential pressure","mech":"Plugging (pipeline debris, corrosion products)","cause":"Pipeline debris and black powder (iron sulfide and oxide) from the supply line; debris after pipeline work","local":"Fuel gas pressure at the stop/speed ratio valve falls","plant":"Load limit, or trip on low fuel gas pressure. Restart within hours after an element change. In summer peak every trip costs generation.","sBasis":"Production: any unit trip during summer peak (May–Sep); repair in less than 1 day","det":"Local ΔP gauge read on the daily round; readings are not recorded or trended","ctrl":"Element cleaned when an operator notices a high ΔP","hidden":false,"iso":"PLU","s":2,"o":3,"d":2,"rs":2,"ro":2,"rd":1},
{"id":"FM-19","sys":"FG","tag":"11MBP30AA002","eq":"Gas control valves & servo valves","fn":"Meter fuel to each DLN fuel circuit, following the control signal within the OEM position-error limit","mode":"Valve sticks or responds slowly while modulating","mech":"Sticking (servo contamination)","cause":"Varnish or particles in the hydraulic oil (FM-25); servo valve wear; position sensor drift","local":"Fuel split between the DLN circuits is wrong","plant":"Load swings, high combustion dynamics, then a trip on position error. With no spare servo on site, about 3–14 days waiting for parts.","sBasis":"Production: 3–14 days on one GT (servo valve lead time); residual S2 = spare set on site, repair in hours","det":"Valve position-error alarm (minutes to hours of warning)","ctrl":"Servo valve replaced when it fails; spares ordered after the failure","hidden":false,"iso":"DOP","s":3,"o":3,"d":2,"rs":2,"ro":2,"rd":1},
{"id":"FM-20","sys":"FG","tag":"11MBP30AA001","eq":"Stop/speed ratio valve & gas control valves: closing on a trip","fn":"Shut off all fuel within the OEM closing time on any trip, and stay tight while the unit is stopped","mode":"Fuel valves fail to close, or leak through, on a trip or shutdown","mech":"Sticking or seat damage (hidden failure)","cause":"Valve stem or servo sticking from varnished oil (FM-25); seat damage; trip solenoid or hydraulic dump valve fault","local":"Fuel keeps flowing after the trip, or seeps in after shutdown","plant":"Overspeed once the generator breaker opens, with rotor burst as the worst case. Or gas collects in the turbine and heat recovery steam generator: an explosion risk at the next start. Fatality possible.","sBasis":"Safety: fatality possible (overspeed or gas explosion)","det":"Automatic gas leak test before firing and after shutdown (pass/fail only); valve position feedback; independent electronic overspeed trip. Closing time is never measured.","ctrl":"Leak test and overspeed protection in the Mark VIe; valves stroked only at outages","hidden":true,"iso":"FTC","s":5,"o":1,"d":3,"rs":5,"ro":1,"rd":2,"why":"S5 × L1 stays High. Maintenance cannot make an overspeed less deadly. Trended leak tests, timed closure tests and varnish control are all maintenance can add. The Plant Manager signs the ALARP case for 12 months."},
{"id":"FM-21","sys":"FG","tag":"11MBP40BR001","eq":"Fuel gas piping, flex hoses & joints in the gas valve and turbine compartments","fn":"Contain fuel gas from the gas valve compartment to the 18 combustor end covers with no detectable leak","mode":"Fuel gas leak inside the gas valve or turbine compartment","mech":"Fatigue and joint relaxation (external leakage)","cause":"Fatigue of flex hoses and fittings from vibration and thermal cycling; gasket or bolt relaxation; joints opened in an outage and not leak-tested","local":"Flammable gas collects in a hot, closed compartment","plant":"Fire or explosion in the compartment: fatality possible, major damage, months out of service.","sBasis":"Safety: fatality possible (compartment explosion or fire)","det":"Hazardous gas detectors in the ventilation exhaust (alarm, then trip). They are calibrated only yearly, so a drifted detector can miss a small leak.","ctrl":"Joints checked only when work is done on them; flex hoses replaced only when found damaged","hidden":false,"iso":"ELU","s":5,"o":1,"d":3,"rs":5,"ro":1,"rd":2,"why":"S5 × L1 stays High. A gas explosion can still kill. Leak tests, hose replacement and calibrated detectors make a leak rare and quickly seen; ventilation (FM-38) dilutes it. The Plant Manager signs the ALARP case."},
{"id":"FM-22","sys":"LF","tag":"11MBN20AA001","eq":"Back-up fuel: liquid fuel system, atomizing air & NOx water injection","fn":"Transfer from gas to distillate without a trip, and run on distillate within NOx limits when gas is not available","mode":"Back-up fuel fails when needed: failed transfer, coked nozzles, or water injection out of ratio","mech":"Coking and deterioration while idle (hidden failure)","cause":"System idle for months (fuel coking in check valves and nozzles); failed check or purge valves; atomizing-air compressor fault; water in distillate; water-injection pump or flow control valve fault","local":"Uneven fuel flow to the 18 cans; wrong water-to-fuel ratio","plant":"Trip during the transfer, then high exhaust spread and combustion hardware damage on distillate: about 2–4 weeks out of service on one GT. NOx excursion if water injection does not follow fuel flow.","sBasis":"Production: 2–4 weeks on one GT (combustion hardware damage after a failed transfer)","det":"None until a transfer is needed: the back-up fuel system is not exercised","ctrl":"Transfer attempted only when gas is curtailed; standby water-injection pump","hidden":true,"iso":"FTF","s":4,"o":3,"d":5,"rs":4,"ro":2,"rd":3,"why":"Residual S4·L2 is Medium (was High). A failed transfer can still damage combustion parts. More frequent transfers need low-load dispatch that the grid cannot give in summer."},
{"id":"FM-23","sys":"LO","tag":"11MBV30AC001","eq":"Lube oil coolers (duty/standby) & temperature control valve","fn":"Hold bearing-header oil at its design supply temperature (about 54 °C on GE heavy-duty units) with margin to the high-temperature alarm","mode":"High lube oil temperature on hot summer afternoons","mech":"Heat-exchanger fouling; loss of cooling margin","cause":"Fouled lube oil cooler; temperature control valve fault; standby cooler not changed over in time; little cooler margin when cooling water is warm (cooling water too hot for all three units at once is FM-27)","local":"Bearing metal temperatures rise; the oil ages faster","plant":"Load is cut by up to about 10 % for weeks in peak summer, while cooling water is at its warmest. A trip on high bearing temperature is also possible. This is about 3 days or more of equivalent lost output per summer on one GT (10 % for 30 days).","sBasis":"Production: 3–14 days equivalent on one GT (10 % derate for about 30 days = 3 days)","det":"Header and bearing temperature alarms give minutes of warning; the temperature control valve position is not trended","ctrl":"Coolers cleaned only at outages or after the alarm","hidden":false,"site":"50 °C ambient","iso":"OHE","s":3,"o":4,"d":2,"rs":3,"ro":2,"rd":1,"why":"Basis for L 4→2: cleaning before summer removes the fouling, and the added cooler surface (A-23c) restores margin for warm cooling water. Medium remains because a valve fault can still cut load."},
{"id":"FM-24","sys":"LO","tag":"11MBV25AP001","eq":"Emergency DC lube oil pump","fn":"Start on its own on low lube oil header pressure and supply the bearings through coast-down if the AC pumps are lost","mode":"Emergency DC lube oil pump fails to start, or fails to hold pressure, on demand","mech":"Standby equipment fails to start (hidden failure)","cause":"Pressure switch drift; starter contactor or motor brush fault; weak 125 V DC supply; pump wear","local":"No oil to the bearings during coast-down","plant":"Bearing wipe and journal damage; rotor removal and repair. More than 3 months out of service on one GT.","sBasis":"Production: > 3 months on one GT (rotor repair); residual S4 = exchange-rotor clause A-SP1, about 6–8 weeks","det":"Occasional manual start test with no fixed interval, longer than the failure takes to develop","ctrl":"Pump tested when someone remembers; battery checked by the electrical team","hidden":true,"iso":"FTS","s":5,"o":2,"d":4,"rs":4,"ro":1,"rd":3,"why":"Residual S4·L1 is Medium (was High). Even with an exchange rotor the outage is 6–8 weeks. Weekly tests make a hidden failure rare; they cannot make it impossible.","extraActs":["A-SP1"]},
{"id":"FM-25","sys":"LO","tag":"11MBX10AT001","eq":"Lube / hydraulic oil (shared reservoir), filters & servo supply","fn":"Supply oil to the servo valves within the cleanliness target (ISO 4406 16/14/11, or the servo maker's limit) and free of varnish","mode":"Oil varnish and particles make servo valves stick","mech":"Oxidation (varnish) and particle contamination","cause":"Oil oxidation at high summer oil temperature (FM-23); filter bypass; dust entering through tank breathers; long oil life with no varnish control","local":"Varnish coats servo spools; valves move late or stick","plant":"Gas valve and IGV servo faults and trips over a summer, plus servo cleaning or replacement. About 3–14 days equivalent on one GT.","sBasis":"Production: 3–14 days equivalent on one GT (repeated trips and servo work)","det":"Quarterly oil sample with particle count only. Varnish is not tested, so it builds up unseen.","ctrl":"Filters changed only on high ΔP; no varnish removal","hidden":false,"site":"50 °C ambient","iso":"PDE","s":3,"o":4,"d":4,"rs":3,"ro":2,"rd":3,"why":"Basis for L 4→2: the varnish-removal unit (A-25c) removes the cause. The monthly sample and quarterly varnish test confirm it works."},
{"id":"FM-26","sys":"LO","tag":"11MBV40AN001","eq":"Lube oil vapour extractor fans (duty/standby)","fn":"Hold a slight vacuum on the lube oil tank and remove oil mist","mode":"Lube oil vapour extractor duty fan fails","mech":"Motor bearing wear","cause":"Motor bearing wear; dust on the motor cooling fins","local":"Standby fan starts on its own","plant":"None while the standby fan runs. Minor oil mist at bearing seals only if both fans fail.","sBasis":"Production: no lost output (< 8 h on one GT); repair cost < KD 10 k","det":"Fan-fail alarm and standby auto-start","ctrl":"Standby fan with auto-start; monthly calendar inspection of both fans","hidden":false,"iso":"BRD","s":1,"o":3,"d":1,"rs":1,"ro":3,"rd":1,"keep":"Run to failure. The alarm and the standby fan protect the unit, so repair the failed fan when the alarm comes in. The FMEA stops the monthly calendar inspection.","removed":{"task":"Monthly calendar inspection of both fans","hrs":36}},
{"id":"FM-27","sys":"CCW","tag":"10PGB10AC001","eq":"Closed cooling water plate heat exchangers (seawater side) & seawater strainers","fn":"Supply closed cooling water to the GT lube oil and generator H₂ coolers at or below design temperature, even with peak-summer seawater","mode":"Cooling water too hot for all three GTs at once","mech":"Marine fouling and blockage (common cause)","cause":"Marine growth and silt on the seawater side; jellyfish blocking intake screens and strainers; chlorination failure; Gulf seawater at its summer peak (mid-30s °C)","local":"Cooling water temperature rises for every unit on the loop at the same time","plant":"All three GTs reach lube oil and generator cold-gas limits together. Block derate, or several trips if seawater flow is lost in summer peak. Likelihood is counted per plant-year.","sBasis":"Production: more than one GT lost during summer peak (common cause)","det":"Cooling water supply temperature alarm (minutes to hours); heat-exchanger ΔP read locally on rounds, not trended","ctrl":"Heat exchangers cleaned after the temperature alarm; no planned summer response to jellyfish","hidden":false,"site":"Gulf seawater","iso":"OHE","s":5,"o":2,"d":2,"rs":5,"ro":1,"rd":2,"why":"S5 × L1 stays High. One seawater blockage can still take all three units in summer. Cleaning, trending, a spare exchanger and the jellyfish procedure make it rare; the seawater intake is outside this study. The Plant Manager signs the ALARP case."},
{"id":"FM-28","sys":"SU","tag":"11MBJ10GH001","eq":"LCI static starter (thyristor bridges, DC-link reactor, controls)","fn":"Bring the shaft from turning speed to self-sustaining speed on every start request, within the normal start time","mode":"Starter fails — start aborted on an LCI fault","mech":"Electronics ageing in heat and dust","cause":"Thyristor or gate-firing card failure; cooling loss (dust-blocked filters, failed fans, or a coolant leak on liquid-cooled units); aged control power supplies in a hot room; start-isolation switch fault","local":"Start aborted; the LCI locks out until the failed part is found and replaced","plant":"The unit cannot start until parts arrive. Cards and thyristors come from the OEM abroad: typically 5–10 days lost. After a summer trip, the unit stays out at peak demand.","sBasis":"Production: 3–14 days on one GT waiting for LCI parts","det":"LCI fault codes appear only when a start is attempted. Fans, filters and power supplies are not checked between starts.","ctrl":"Repair on failure. No LCI spares on site. Filters cleaned only after an over-temperature fault.","hidden":false,"site":"50 °C + dust","iso":"FTS","s":3,"o":3,"d":4,"rs":2,"ro":2,"rd":3},
{"id":"FM-29","sys":"SU","tag":"11MBK10AE001","eq":"Turning gear (motor, clutch & engagement)","fn":"Turn the rotor slowly from coast-down until wheelspace temperatures are near ambient, so the hot rotor cools evenly","mode":"Turning gear fails to engage, or stops, after a shutdown or trip","mech":"Motor, clutch or permissive failure","cause":"Turning-gear motor failure; clutch or engagement mechanism sticking; lube-oil pressure permissive not made; control logic fault","local":"Hot rotor stops turning and bows (the top stays hotter than the bottom)","plant":"Restart is delayed until the turning gear runs and the bow is worked out. GE guidance is about 8 hours on turning gear, confirmed by crank-speed vibration. Starting with a bow causes seal and blade-tip rubs: worst case a 2–4 week repair (KD 1–2 M).","sBasis":"Production: 2 weeks–3 months on one GT if a bowed rotor is started and rubs","det":"Turning-gear running indication and alarm in the control room. Operators check after shutdown, but the check is not recorded.","ctrl":"Turning gear repaired on failure. No written procedure for a turning gear that will not run.","hidden":false,"iso":"FTS","s":4,"o":2,"d":2,"rs":4,"ro":1,"rd":2,"why":"Severity stays 4: starting a bowed rotor can still rub seals and blade tips. A recorded check after every shutdown and a written procedure make it rare; a second turning drive is not reasonably practicable."},
