{"id":"A-33b","fm":["FM-33"],"type":"PM","reduces":"O","title":"Change collector housing filters before summer and storms","task":"Replace the collector housing inlet air filters from outside the housing. Due by 15 Apr, then after each shamal dust storm; clean carbon dust from the brush rigging at the next standstill. Record filter condition.","freq":"SEAS","py":4,"win":"Due by 15 Apr; then after each dust storm","cond":"RUN","craft":"ELEC","crew":1,"hrs":2,"mat":0.12,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Electrical maintenance"},
{"id":"A-33c","fm":["FM-33"],"type":"Proc","reduces":"O","title":"Write the online brush-change procedure; authorise staff","task":"Write the procedure for changing brushes on a running generator: one brush at a time, insulated tools, arc-flash clothing and two people present. Train the electricians and keep a list of who is authorised.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":12,"capex":null,"scope":"unit","basis":"FMEA","status":"In progress","due":"2027-01-31","resp":"Electrical maintenance"},
{"id":"A-34a","fm":["FM-34"],"type":"Proc","reduces":"DO","title":"Interim: daily DC ground check and wiring-change hold","task":"Interim (within 24 h): daily DC ground check with a portable detector; hold on wiring changes in GT control panels until interposing relays are fitted. On every unit, measure each pole to ground in DC and AC volts. If the poles are unbalanced beyond the site limit, or AC is present, find the fault the same day.","freq":"D","py":150,"win":"Interim only: stops when A-34b is complete","cond":"RUN","craft":"ELEC","crew":1,"hrs":0.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Done","due":"2026-10-16","resp":"Electrical maintenance","steps":["On each unit's 125 V DC board, measure positive-to-ground and negative-to-ground DC volts with the portable detector.","Measure AC volts from each pole to ground.","Compare: the two DC readings should be about equal, each near half the bus voltage.","If they differ beyond the site limit, or AC is present, tell the shift charge engineer and start fault-finding the same day.","Check the wiring-change hold notice is posted on each GT control panel; report any breach."],"record":["Bus voltage (V DC)","Positive to ground (V DC)","Negative to ground (V DC)","AC on DC, each pole to ground (V AC)","Fault-finding work order raised (yes/no)"]},
{"id":"A-34b","fm":["FM-34"],"type":"Design","reduces":"OD","title":"Fit interposing relays and enable DC ground alarms","task":"Fit interposing relays on every 240 V AC-to-DC input, so no AC wiring reaches the 125 V DC circuits. Enable the Mark VIe ground-fault and AC-on-DC alarms and show them in the control room. Update the loop drawings and I/O list; the OEM agrees the change.","freq":"ONCE","cond":"STANDSTILL","craft":"INST","crew":3,"hrs":24,"capex":14,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"I&C maintenance","cm":"CM-BUA-01","moc":{"cls":"Major: protection system","st":"APPROVED","outage":"Yes: 3 days per unit","target":"Q1 2027"}},
{"id":"A-34c","fm":["FM-34"],"type":"Test","reduces":"D","title":"Prove DC ground and AC-on-DC alarms with a test resistor","task":"First check with the portable detector that neither pole already has a ground; a second ground could operate a trip input. Then use the board's test function or the OEM test resistor on each pole. Confirm the ground-fault and AC-on-DC alarms reach the control room within the set delay. Record pass or fail for each alarm.","freq":"6M","win":"Mar and Oct","cond":"RUN","craft":"INST","crew":1,"hrs":2,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"I&C maintenance","record":["Ground-fault alarm, positive pole (pass/fail)","Ground-fault alarm, negative pole (pass/fail)","AC-on-DC alarm (pass/fail)","Time to alarm in control room (s)"]},
{"id":"A-34d","fm":["FM-34"],"type":"PM","reduces":"O","title":"Audit DC input wiring against as-built drawings yearly","task":"At a standstill, check every AC-to-DC interface against the as-built drawings, check DC fuse ratings and surge suppressors, and look for unapproved wiring. Raise an MOC for every defect. Record the counts and the insulation reading to ground.","freq":"Y","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":8,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-03-31","resp":"I&C maintenance","steps":["Under a permit at standstill, take the current as-built drawings and the Mark VIe I/O list.","Walk every AC-to-DC interface; confirm an interposing relay is fitted and labelled.","Check DC fuse ratings and surge suppressors against the OEM drawing.","Look for wiring not on the drawings; tag it and raise an MOC.","Prove the ground-fault and AC-on-DC alarms (as in A-34c).","Update the drawings; record defects and close them in the CMMS."],"record":["Interfaces checked (n)","Interfaces without relay (n)","Fuses of wrong rating (n)","Unapproved wiring found (n)","Insulation resistance to ground (kΩ)"]},
{"id":"A-35a","fm":["FM-35"],"type":"PM","reduces":"O","title":"Clean control compartment air-conditioner coils","task":"Clean the condenser coils with low-pressure water or coil cleaner and replace the return-air filters. Work early in the morning with doors shut; stop if compartment temperature reaches the alarm. Record supply-air temperature and compressor current after restart.","freq":"SEAS","py":4,"win":"Due by 15 Apr; then after each dust storm","cond":"RUN","craft":"MECH","crew":2,"hrs":3,"mat":0.1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Mechanical maintenance","steps":["Start before 09:00 and tell the control room.","Isolate the air conditioner; keep compartment doors shut and watch compartment temperature.","Clean the condenser coils from the inside out with low-pressure water or coil cleaner.","Replace return-air filters; check fan blades and mountings.","Restart; record pressures, compressor current and supply-air temperature.","If compartment temperature reaches the alarm, stop and restart the unit at once."],"record":["Compartment temperature before / after (°C)","Supply-air temperature (°C)","Compressor current (A)","Refrigerant pressures (bar)"]},
{"id":"A-35b","fm":["FM-35"],"type":"Design","reduces":"O","title":"Add a standby air conditioner with automatic changeover","task":"Add a second air-conditioning unit that starts automatically on failure or high temperature, so one failure cannot overheat the compartment. Feed the two units from separate power supplies.","freq":"ONCE","cond":"RUN","craft":"MECH","crew":2,"hrs":24,"capex":18,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2027-04-30","resp":"Mechanical maintenance","moc":{"cls":"Minor","st":"SCREENED","outage":"No","target":"Q2 2027"}},
{"id":"A-35c","fm":["FM-35"],"type":"Design","reduces":"D","title":"Bring compartment high-temperature alarm to control room","task":"Wire a compartment temperature transmitter to the Mark VIe with a high-temperature alarm in the control room. Set the alarm below the electronics limit (per OEM), leaving time to act.","freq":"ONCE","cond":"RUN","craft":"INST","crew":1,"hrs":8,"capex":2,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-31","resp":"I&C maintenance","cm":"CM-CJP-01","moc":{"cls":"Minor","st":"APPROVED","outage":"No","target":"Q4 2026"}},
{"id":"A-35d","fm":["FM-35"],"type":"PdM","reduces":"D","title":"Review compartment temperature and Mark VIe alarms weekly","task":"Check the week's compartment temperature trend and every Mark VIe diagnostic alarm. Raise a work order if the afternoon peak rises week on week, or any I/O pack shows a fault.","freq":"W","cond":"RUN","craft":"INST","crew":1,"hrs":1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-01-15","resp":"I&C maintenance","cm":"CM-CJP-01","record":["Highest afternoon compartment temperature (°C)","Mark VIe diagnostic alarms open (n)"]},
{"id":"A-36a","fm":["FM-36"],"type":"Design","reduces":"O","title":"Add 2-out-of-3 voting before CO₂ release and trip","task":"Change the release logic so two detectors in the same compartment must agree (2-out-of-3 or cross-zone, to suit the layout) before CO₂ is released and the unit trips. One faulty detector then gives an alarm only; this design change is the basis for likelihood 3 → 1. Fire authority and insurer approval needed.","freq":"ONCE","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":8,"capex":8,"scope":"unit","basis":"FMEA","status":"Proposed","due":"2027-06-30","resp":"HSE / Fire","moc":{"cls":"Major: protection system","st":"SCREENED","outage":"Yes: 1 day per unit","target":"Q2 2027"}},
{"id":"A-36b","fm":["FM-36"],"type":"Test","reduces":"D","title":"Test fire detectors and zone loops with CO₂ isolated","task":"With CO₂ release isolated and a fire watch posted, test each heat detector with an approved heat tester and check each zone loop for earth faults. Confirm the panel shows the right zone and the alarm reaches the control room. Record failed detectors and loop readings.","freq":"6M","win":"Mar and Oct (standstill)","cond":"STANDSTILL","craft":"INST","crew":2,"hrs":4,"capex":null,"scope":"unit","basis":"Statutory","status":"Approved","due":"2027-03-31","resp":"I&C maintenance","steps":["Isolate CO₂ release (lock and tag), inhibit the fire trip and post a fire watch.","Test each heat detector with the approved heat tester; check the panel shows the right zone.","Check each zone loop for earth faults and insulation.","Confirm the alarm reaches the control room.","Restore the trip, remove the CO₂ isolation last, and record results."],"record":["Detectors tested / failed (n)","Zone loop insulation (MΩ)","Panel fault events since last test (n)"]},
{"id":"A-36c","fm":["FM-36"],"type":"PM","reduces":"O","title":"Inspect and reseal fire-detection junction boxes yearly","task":"Open each fire-detection junction box in the turbine and gas compartments; dry, clean and reseal it, renew damaged glands and tighten terminals. Record boxes found wet or with loose terminals.","freq":"Y","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"INST","crew":1,"hrs":4,"mat":0.1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-02-28","resp":"I&C maintenance"},
{"id":"A-36d","fm":["FM-36"],"type":"Proc","reduces":"D","title":"Move fire panel records and fault log into the CMMS","task":"Move fire-panel test records, faults and pre-alarms into the CMMS. The shift reviews the panel event log weekly and raises a work order for any repeat fault.","freq":"ONCE","cond":"RUN","craft":"ENG","crew":1,"hrs":16,"capex":null,"scope":"unit","basis":"FMEA","status":"In progress","due":"2026-12-31","resp":"HSE / Fire"},
{"id":"A-37a","fm":["FM-37"],"type":"Test","reduces":"D","title":"Check CO₂ tank level and pressure weekly","task":"Read tank level and pressure and confirm the refrigeration unit is running (NFPA 12 weekly check). Action: level below the minimum for initial plus extended discharge, or pressure rising toward the relief setting. Then raise a priority work order the same shift.","freq":"W","cond":"RUN","craft":"OPS","crew":1,"hrs":0.25,"capex":null,"scope":"unit","basis":"Statutory","status":"Approved","due":"2026-11-15","resp":"Operations","steps":["Read tank level and pressure on the local gauges.","Confirm the refrigeration unit runs and pressure is in its normal band.","Compare level with the minimum marked for initial plus extended discharge.","If level is low or pressure is rising, raise a priority work order and tell HSE / Fire the same shift.","Enter the readings in the CMMS."],"record":["Tank level (% or kg)","Tank pressure (bar)","Refrigeration unit running (yes/no)"]},
{"id":"A-37b","fm":["FM-37"],"type":"PM","reduces":"O","title":"Service CO₂ tank refrigeration units before summer","task":"Clean refrigeration condenser coils, check refrigerant charge, compressor current and pressure switches, and test the high-pressure alarm. Confirm the relief valve test date is still valid. Record pressures and current.","freq":"SEAS","win":"Due by 15 Apr","cond":"RUN","craft":"MECH","crew":2,"hrs":4,"mat":0.3,"capex":null,"scope":"unit","basis":"Statutory","status":"Approved","due":"2027-04-15","resp":"Mechanical maintenance"},
{"id":"A-37c","fm":["FM-37"],"type":"Test","reduces":"D","title":"Function-test CO₂ release valves and dampers yearly","task":"With CO₂ isolated so nothing discharges: operate every release and selector valve, prove the time delay and pre-discharge alarm, and confirm doors, dampers and fans respond. Inspect nozzles and pipe supports. Record each valve and damper result.","freq":"Y","win":"Oct–Apr (standstill)","cond":"STANDSTILL","craft":"CONTR","crew":2,"hrs":8,"capex":null,"scope":"unit","basis":"Statutory","status":"Approved","due":"2027-02-28","resp":"HSE / Fire","steps":["Isolate the CO₂ supply so nothing can discharge (lock and tag); post a fire watch.","Operate each release (pilot) and selector valve from the panel and by hand; check full travel.","Prove the time delay, pre-discharge alarm and warning lights at each compartment door.","Confirm doors and dampers close and vent fans stop on the release signal.","Inspect nozzles for blockage and pipe supports for damage.","Remove the isolation, restore the system and record results."],"record":["Valves operated / failed (n)","Time delay measured (s)","Dampers closed correctly (n of n)","Nozzles blocked (n)"]},
{"id":"A-38a","fm":["FM-38"],"type":"Test","reduces":"OD","title":"Test vent fan auto-changeover and dampers monthly","task":"Stop the duty fan from the panel; the standby must start on loss of flow within its set time. Check both dampers move fully, then leave the other fan as duty. Record start time and compartment temperature.","freq":"M","cond":"RUN","craft":"OPS","crew":1,"hrs":1,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-11-30","resp":"Operations","record":["Standby start time after duty stop (s)","Dampers full travel (yes/no)","Compartment temperature (°C)"]},
{"id":"A-38b","fm":["FM-38"],"type":"PdM","reduces":"D","title":"Take vibration and current readings on both vent fans","task":"Measure motor and fan bearing vibration and motor current on both fans (the standby after a changeover). Regrease per OEM. Plan a bearing change when vibration reaches ISO 20816-3 zone C or rises steadily.","freq":"Q","cond":"RUN","craft":"MECH","crew":1,"hrs":1.5,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2026-12-31","resp":"Mechanical maintenance","record":["Fan bearing vibration, each fan (mm/s)","Motor current, each fan (A)"]},
{"id":"A-38c","fm":["FM-38"],"type":"PM","reduces":"O","title":"Service vent fans and damper actuators before summer","task":"Clean motor cooling fins and inlet screens, check damper actuators and linkages for dust and free movement, and test the loss-of-flow switch. Service one fan at a time while the other runs.","freq":"SEAS","win":"Due by 15 Apr","cond":"RUN","craft":"MECH","crew":2,"hrs":4,"mat":0.15,"capex":null,"scope":"unit","basis":"FMEA","status":"Approved","due":"2027-04-15","resp":"Mechanical maintenance"}];

{"k":"chk","id":"p2","role":"Operations","text":"Confirm from the control room: steady load, no planned load change, and no hydrogen, rotor earth-fault or excitation alarm.","hint":"Any of these alarms active: do not start. Tell the supervisor.","s":"Confirm steady load; no H₂, earth-fault or excitation alarm"},
{"k":"hold","id":"p3","role":"Operations","text":"The shift charge engineer issues permit PTW-26-4418 at the housing. Do not start until it is signed.","hint":"Permit type: inspection near live equipment, no contact. No isolation is needed.","s":"Shift engineer issues permit; do not start until signed"},
{"k":"chk","id":"p4","role":"Technician","text":"Put on arc-rated clothing, face shield or hood, and gloves. Match the rating on the housing arc-flash label.","hint":"Check clothing for tears, burns or oil. No loose clothing or jewellery near the shaft.","s":"Put on arc-rated PPE to the arc-flash label rating"},
{"k":"chk","id":"p5","role":"Technician","text":"Set barrier tape and signs at the arc-flash boundary. Keep everyone else outside it.","hint":"Work only from outside the guard. Never open the guard or touch the brush gear.","s":"Tape off the arc-flash boundary; keep everyone else out"}],"s":"Before you start"},
{"title":"2. Unit conditions and camera set-up","items":[{"k":"read","id":"u1","role":"Operations","text":"Record unit load from the control room.","unit":"MW","min":200,"sample":218,"hint":"Steady within ±5 MW for 30 min. Sample minimum 200 MW, so weeks can be compared.","s":"Unit load, from the control room"},
{"k":"read","id":"u2","role":"Operations","text":"Record generator field current from the control room.","unit":"A","max":2350,"sample":1780,"hint":"Sample limit: rated field current on the nameplate. Brush heating rises with field current.","s":"Generator field current, from the control room"},
{"k":"text","id":"u3","role":"Technician","text":"Record the infrared camera number and its calibration due date.","sample":"Camera TC-03, calibration due 14 Mar 2027","hint":"Do not use the camera if the calibration date has passed.","s":"Camera number and calibration due date"},
{"k":"read","id":"u4","role":"Technician","text":"Set the emissivity on the camera and record it.","min":0.88,"max":0.92,"sample":0.9,"hint":"Sample site value 0.90. Use the same value every week.","s":"Camera emissivity, as set"},
{"k":"read","id":"u5","role":"Technician","text":"Set the infrared window transmission on the camera and record it.","unit":"%","min":53,"max":57,"sample":55,"hint":"Value from the window label (sample 55 %). Without it the camera reads too low.","s":"Infrared window transmission, as set"}],"s":"Unit and camera set-up"},
{"title":"3. Look through the inspection windows","items":[{"k":"choice","id":"v1","role":"Technician","text":"Look at each brush for sparking.","opts":["None","Small sparks at one or two brushes","Sparking at many brushes","Ring fire: sparks running around a ring"],"warn":["Small sparks at one or two brushes","Sparking at many brushes","Ring fire: sparks running around a ring"],"sample":"None","hint":"Any sparking: tell the supervisor now. Ring fire: use the MOP back-out plan at once.","s":"Sparking at the brushes","optsS":["None","Small sparks, 1–2 brushes","Sparking at many brushes","Ring fire: sparks round ring"]},
{"k":"choice","id":"v2","role":"Technician","text":"Check for brush chatter, noise or a stuck (hanging) brush.","opts":["None seen","Chatter or noise","Stuck brush seen"],"warn":["Chatter or noise","Stuck brush seen"],"sample":"None seen","hint":"A stuck brush stops carrying current. Its neighbours then run hotter.","s":"Brush chatter, noise or stuck brush","optsS":["None seen","Chatter or noise","Stuck brush"]},
{"k":"choice","id":"v3","role":"Technician","text":"Check for carbon dust on the rings, holders and insulators.","opts":["Clean","Light film","Heavy: dust on insulators or ring sides"],"warn":["Heavy: dust on insulators or ring sides"],"sample":"Light film","hint":"Heavy dust can track to earth. Plan cleaning at the next standstill (Oct–Apr).","s":"Carbon dust on rings, holders and insulators","optsS":["Clean","Light film","Heavy: insulators/ring sides"]},
{"k":"choice","id":"v4","role":"Technician","text":"Check the housing inlet air filters.","opts":["Clean","Light dust","Dirty: change this week","Torn or blocked"],"warn":["Dirty: change this week","Torn or blocked"],"sample":"Light dust","hint":"Dirty filters let shamal dust into the housing. Change them under action A-33b.","s":"Housing inlet air filters","optsS":["Clean","Light dust","Dirty: change this week","Torn or blocked"]},
{"k":"photo","id":"v5","role":"Technician","img":"brushes","text":"Take a normal (visible-light) photo of the brush rigging through the window.","hint":"Use the same view every week, so photos can be compared.","s":"Take a normal photo of brush rigging, same view each week"}],"s":"Visual check"},
{"title":"4. Infrared survey and brush wear","items":[{"k":"chk","id":"t1","role":"Technician","text":"Open the infrared window covers with the cover key. Open nothing else.","hint":"The window covers expose no live parts.","s":"Open only the infrared window covers, nothing else"},
{"k":"photo","id":"t2","role":"Technician","img":"ir-hot","text":"Take an infrared image of the positive ring brush holders.","hint":"Hold the camera steady and square to the window. Get all holders in view.","s":"Take infrared image of positive ring holders"},
{"k":"read","id":"t3","role":"Technician","text":"Positive ring: record the hottest brush holder temperature.","unit":"°C","max":100,"sample":64.6,"hint":"Sample absolute limit 100 °C; confirm with the OEM brush data.","s":"Positive ring: hottest holder temperature"},
{"k":"read","id":"t4","role":"Technician","text":"Positive ring: record the average brush holder temperature.","unit":"°C","max":85,"sample":46.2,"hint":"Use the camera's area tool over all holders. A high average on every holder points to poor cooling air.","s":"Positive ring: average holder temperature"},
{"k":"read","id":"t5","role":"Technician","text":"Positive ring: hottest minus average (hot spot, condition point CM-MKC-01).","unit":"°C","max":15,"sample":18.4,"hint":"Same-day criterion: 15 °C above average (sample). Over 15: the supervisor decides the action today.","devSample":"Over the 15 °C same-day criterion: supervisor informed at once; follow-on work order raised to change brushes today (section 5).","s":"Positive ring hot spot (hottest minus average)"},
{"k":"photo","id":"t6","role":"Technician","img":"ir-normal","text":"Take an infrared image of the negative ring brush holders.","hint":"Use the same camera settings as the positive ring.","s":"Take infrared image of negative ring, same settings"},
{"k":"read","id":"t7","role":"Technician","text":"Negative ring: hottest minus average (hot spot).","unit":"°C","max":15,"sample":3.1,"hint":"Same-day criterion: 15 °C above average (sample).","s":"Negative ring hot spot (hottest minus average)"},
{"k":"read","id":"t8","role":"Technician","text":"Count the brushes at or near the wear mark (close to minimum length).","unit":"brushes","max":2,"sample":3,"hint":"Minimum length per OEM. Sample trigger: 3 or more, plan a brush-change job this week.","devSample":"Three brushes near minimum length: all three are changed under the follow-on work order.","s":"Number of brushes at or near the wear mark"},
{"k":"text","id":"t9","role":"Technician","text":"Write the position of the hot holder and of the brushes near minimum length.","sample":"Hot holder P-06. Near minimum length: P-06, P-11, N-04. Check P-06 for low spring force or a loose flexible lead.","hint":"P = positive ring (ring 1), N = negative ring (ring 2). Holders clockwise from the top, seen from the collector end.","s":"Write positions of the hot holder and worn brushes"},
{"k":"hold","id":"t10","role":"Supervisor","text":"The supervisor reviews the images and readings before the action is chosen.","hint":"Review on the tablet or at the housing. Each reading outside limits needs a deviation note.","s":"Supervisor reviews images and readings before any action"}],"s":"Infrared and brush wear"},
{"title":"5. Decision and follow-on work","items":[{"k":"choice","id":"d1","role":"Supervisor","text":"Overall condition of the collector gear.","opts":["Normal: next weekly survey","Watch: plan brush changes","Act today: hot or sparking brush","Emergency: back out now"],"warn":["Watch: plan brush changes","Act today: hot or sparking brush","Emergency: back out now"],"sample":"Act today: hot or sparking brush","hint":"A hot spot more than 15 °C above average means act today (sample criterion).","s":"Overall condition of the collector gear","optsS":["Normal: next weekly survey","Watch: plan brush changes","Act today: hot or sparking","Emergency: back out now"]},
{"k":"choice","id":"d2","role":"Supervisor","text":"Choose the action for the hot brush holder.","opts":["Monitor only: re-survey in 24 h","Change brushes on load, OEM instruction, authorised staff (follow-on work order)","Lower field current and survey daily until a standstill","Unload and stop GT2 for repair"],"warn":["Unload and stop GT2 for repair"],"sample":"Change brushes on load, OEM instruction, authorised staff (follow-on work order)","hint":"On-load brush work only by authorised staff, one brush at a time. The site procedure (A-33c) is due 31 Jan 2027.","s":"Action for the hot brush holder","optsS":["Monitor; re-survey in 24 h","Change on load (authorised)","Lower field; survey daily","Unload and stop GT2"]},
{"k":"text","id":"d3","role":"Supervisor","text":"Raise the follow-on work order with the button below the steps. Write its number and start time.","sample":"Follow-on work order (number given by the CMMS): change brushes P-06, P-11 and N-04 on load. Check the P-06 spring and flexible lead. Start today.","s":"Raise follow-on work order; record number and start time"},
{"k":"chk","id":"d4","role":"Technician","text":"Book a re-survey 24 hours after the brush change. Tell the shift charge engineer.","hint":"New brushes need time to bed in. Any sparking before the change: use the back-out plan.","s":"Book re-survey 24 h after brush change; tell shift engineer"}],"s":"Decision and follow-on job"},
{"title":"6. Back-out record and finish","items":[{"k":"choice","id":"b1","role":"Technician","text":"Did you see sparking, a ring fire or a hydrogen alarm at any time?","opts":["No","Yes: back-out steps done"],"warn":["Yes: back-out steps done"],"sample":"No","hint":"Signs: sparks running around a ring, glow, smoke, burning smell, loud crackle.","s":"Sparking, ring fire or H₂ alarm seen at any time?","optsS":["No","Yes: back-out steps done"]},
{"k":"chk","id":"b2","role":"Technician","req":false,"text":"If yes: you stopped, left the boundary and radioed the control room. Others were kept out.","hint":"Do not open the guard or try to fix brushes.","s":"If yes: stopped, left boundary, radioed, kept others out"},
{"k":"chk","id":"b3","role":"Operations","req":false,"text":"If yes: reactive power was lowered to cut field current. For a ring fire, GT2 was taken off line at once.","hint":"Inform the duty engineer. Engineering decides when GT2 returns to service.","s":"If yes: Ops cut field current; ring fire: GT2 off at once"},
{"k":"chk","id":"b4","role":"Technician","text":"Close and lock the infrared window covers. Remove the barriers and signs.","hint":"Check that nothing is left inside the arc-flash boundary.","s":"Close and lock window covers; remove barriers and signs"},
{"k":"chk","id":"b5","role":"Technician","text":"Save all images and readings to this work order. Tell the control room the survey is complete.","hint":"The control room then closes permit PTW-26-4418.","s":"Save all images and readings; tell control room it's done"}],"s":"Back-out record and finish"}],"signoff":[{"role":"Technician","what":"All steps done or marked not applicable. Readings and images are true and saved. Window covers locked, barriers removed, area left safe.","s":"Steps done or N/A, records saved, covers locked, area safe"},

{"part":"Oil absorbent pads, pack of 100","qty":1,"code":"61-00415"}],"sop":{"no":"SOP-MNT-014","rev":"3","title":"Changeover and cleaning of duplex lube oil coolers","purpose":"Give one safe, standard way to change over, isolate, clean, test and return a duplex lube oil cooler. The bearings must keep a steady oil supply at all times.","scope":"Plate-type duplex lube oil coolers on GT1, GT2 and GT3 (11MBV30AC001, 12MBV30AC001 and 13MBV30AC001). Covers online work on a running unit and work at standstill. Each online job also needs its own MOP.","rules":["Work on one cooler at a time. Never open or touch the cooler in service.","Online work needs a job-specific MOP. The shift charge engineer releases each Operations hold point.","On a running unit, only Operations turns the transfer valve and applies isolations. Maintenance works under the permit.","The emergency DC lube oil pump and the standby AC pump must both be available, or the job stops.","Standby valve set-up (sample): oil side full and vented; water inlet closed, water outlet open.","Before a changeover, open the standby cooler's water inlet. Never change over to a cooler that is not full and vented.","Turn the transfer valve slowly. Someone watches header pressure, with a radio link to the control room.","Isolate both sides under permit with locks and tags. Prove zero pressure and no flow before opening.","Keep water and dirt out of the oil. Dry the oil-side surfaces and fill only through a filter cart.","Read water-side ΔP on the duty cooler only, with the standby valve set-up above. Then readings compare year to year.","Plan online cooler work for October to April, before the 50 °C summer. Summer work needs Plant Manager approval."],"approved":"Maintenance Manager, 15 Mar 2026","purposeShort":"One safe way to change over, isolate, clean, test and return a cooler. Bearing oil stays steady.","checks":[{"title":"Before you start","items":[{"id":"S1","s":"Work is Oct–Apr, or Plant Manager approved summer work","text":"Online cooler work is planned for October to April, before the 50 °C summer. Any summer work has Plant Manager approval."},
{"id":"S2","s":"Job-specific MOP approved for this online job","text":"This online job has its own approved MOP before work starts. Online work is never done without one."}]},
{"title":"While working","items":[{"id":"S3","s":"One cooler at a time; cooler in service never touched","text":"Work was done on one cooler at a time. The cooler in service was never opened or touched."},
{"id":"S4","s":"Only Operations turned the transfer valve and isolated","text":"On the running unit, only Operations turned the transfer valve and applied isolations. Maintenance worked under the permit."},
{"id":"S5","s":"Shift charge engineer released each Operations hold","text":"Each Operations hold point was released by the shift charge engineer, as the job MOP requires."},
{"id":"S6","s":"Cooler B full, vented, water inlet open before changeover","text":"Before the changeover, the cooler B water inlet was opened and cooler B was full and vented. Never change over to a cooler that is not full and vented."},
{"id":"S7","s":"Transfer valve turned slowly; pressure watched on radio","text":"The transfer valve was turned slowly. Someone watched header pressure, with a radio link to the control room."},
{"id":"S8","s":"Both sides of cooler A locked and tagged under permit","text":"Oil and water sides of cooler A were isolated under permit, with locks and tags on every point."},
{"id":"S9","s":"Oil side dried; oil filled only through the filter cart","text":"Water and dirt were kept out of the oil. Oil-side surfaces were dried, and oil was filled only through a filter cart."},
{"id":"S10","s":"Cooler A left full, vented; water inlet closed, outlet open","text":"Cooler A was left in the standby set-up: oil side full and vented, water inlet closed, water outlet open."},
{"id":"S11","s":"Water-side ΔP read on duty cooler only; other on standby","text":"Water-side ΔP was read on the duty cooler only, with the other cooler in the standby set-up, so readings compare year to year."}]},
{"title":"Stop and call if","items":[{"id":"S12","s":"Emergency DC or standby AC lube oil pump not available","text":"Watched for, not seen. The emergency DC lube oil pump and the standby AC pump must both be available for the whole job. If either is lost, the job stops."},
{"id":"S13","s":"Pressure or flow remains in cooler A before opening","text":"Watched for, not seen. Zero pressure and no flow are proved on both sides before cooler A is opened. If pressure or flow remains, do not open; stop and call."}]}]},"mop":{"no":"MOP-26-0417","rev":"0","title":"GT1 lube oil cooler A: online changeover, cleaning and return as clean standby","why":"GT1 will be running during this job. A wrong step at the transfer valve can drop lube oil header pressure. That can trip the unit or damage the bearings (FM-16). This MOP sets the exact steps, holds, limits and back-out for this cooler on this day.","risks":["Air left in cooler B: header pressure dips at changeover, with risk of a low lube oil pressure trip or bearing damage.","Transfer valve turned too fast or left half-way: oil flow is restricted and header pressure falls.","Generator seal oil comes from the same lube oil supply. A pressure dip can also disturb it (see FM-30).","Transfer valve passing after isolation: hot oil flows into the open cooler A and header pressure falls.","Cooler B cannot hold temperature after cooler A is opened: the unit may have to be stopped.","Wrong valve closed on the shared cooling water header: the other units lose cooling too (see FM-27).","Water or dirt left in cooler A: it enters the bearing oil at the next changeover (see FM-25).","Gasket leak after close-up: oil into the cooling water, or an oil spill near hot surfaces.","Oil reservoir level falls while a cooler is filled: low-level alarm.","Hot oil burns, water-jet injury, and slips on oily floors."],"backout":["Make the area safe. Call the shift charge engineer by radio at once.","Before cooler A is isolated: if header pressure nears 1.5 bar g (sample stop value), turn back to cooler A.","Before cooler A is isolated: if header or bearing temperatures rise more than 3 °C (sample), turn back to cooler A.","After cooler A is isolated: never touch the transfer valve. Cooler B must carry the load alone.","If temperature rises: Operations sets the control valve fully open to cooler B and checks the cooling water flow.","If oil keeps flowing from cooler A after isolation, the transfer valve is passing. Close the drain if safe and clear the area.","If header pressure or temperature still cannot be held, the shift charge engineer unloads and stops the unit.","Close up cooler A as soon as it is safe. Restart the job only after the cause is found and agreed."],"comms":"One radio channel links the field operator at the transfer valve, the gauge reader and the control room. The control room logs the start, each hold release and the finish. Anyone may call stop; the shift charge engineer decides the next step. The GT engineer is on call by phone during the job.","prepared":"Mechanical maintenance planner, 28 Oct 2026","approved":"Maintenance Manager and Operations Manager, 4 Nov 2026","summary":"Change GT1 over to cooler B while running, then isolate, clean, test and return cooler A as standby.","brief":[{"id":"B1","s":"Air in cooler B dips header pressure; trip risk","ctl":"Fill and vent cooler B until clear oil flows","from":0},
{"id":"B2","s":"Transfer valve turned too fast or left half-way","ctl":"Operations turns slowly, fully; gauge read aloud by radio","from":1},
{"id":"B3","s":"Pressure dip also upsets generator seal oil","ctl":"Slow changeover; turn back to A if pressure nears stop value","from":2},
{"id":"B4","s":"Transfer valve passing into open cooler A","ctl":"Prove no flow before opening; stop if oil keeps flowing","from":3},
{"id":"B5","s":"Cooler B cannot hold temperature alone","ctl":"Watch 15 min before isolating A; last point to go back","from":4},
{"id":"B6","s":"Wrong valve on shared cooling water hits other GTs","ctl":"Close only cooler A valves; check each tag vs certificate","from":5},
{"id":"B7","s":"Water or dirt in cooler A reaches the bearings","ctl":"Dry every plate; fill only through the filter cart","from":6},
{"id":"B8","s":"Gasket leak after close-up: oil in water or spill","ctl":"Witnessed 15-min pressure test; leak check after 30 min","from":7},
{"id":"B9","s":"Reservoir level falls while a cooler fills","ctl":"Fill slowly, watch level, top up via filter cart","from":8},
{"id":"B10","s":"Hot oil burns, water-jet injury, oily-floor slips","ctl":"PPE, face shield, plates cooled first, drip trays, spill kit","from":9}],"backoutShort":["Make the area safe. Radio the shift charge engineer at once.","Before A isolated: header pressure nears 1.5 bar g → turn back to A.","Before A isolated: header or bearing temp up >3 °C → turn back to A.","After A is isolated: never touch the transfer valve. B runs alone.","Temp up: Operations opens control valve fully to B, checks water flow.","Oil keeps flowing from A: close the drain if safe and clear the area.","Pressure/temp not held: shift charge engineer unloads, stops the unit.","Close up A once safe. Resume job only after cause is found and agreed."],"commsShort":"One radio channel: field, gauge reader, control room. Anyone may call stop; shift charge engineer decides."},"sections":[{"title":"Prepare the job","items":[{"k":"chk","id":"s1","role":"Supervisor","text":"Check that PTW-26-1142 and ISO-26-0388 cover cooler A only. Hold the toolbox talk; the crew signs.","hint":"Cover hot oil, the running unit, spills, isolation points and the back-out plan.","s":"Check permits cover cooler A only; toolbox talk, crew signs"},
{"k":"chk","id":"s2","role":"Operations","text":"Confirm the emergency DC lube oil pump (88QE-1) and the standby AC lube oil pump are available in auto.","hint":"Last weekly DC pump start test passed within 7 days. No lube oil alarms. No protection forced or bypassed.","s":"Confirm emergency DC and standby AC pumps available in auto"},
{"k":"chk","id":"s3","role":"Technician","text":"Set up barriers, drip trays, the spill kit and clean drums. Test the radio link to the control room.","s":"Set up barriers, drip trays, spill kit; test radio"}],"s":"Prepare the job"},
{"title":"Record as-found readings (cooler A on duty)","items":[{"k":"read","id":"r1","role":"Technician","text":"Header oil temperature before the changeover","unit":"°C","min":49,"max":58,"sample":54.6,"hint":"Design about 54 °C. Sample limits; the alarm setting is in the Mark VIe.","s":"Header oil temp, before changeover"},
{"k":"read","id":"r2","role":"Technician","text":"Header oil pressure before the changeover","unit":"bar g","min":1.5,"max":1.9,"sample":1.72,"hint":"Sample band. The low-pressure alarm and trip settings are in the Mark VIe.","s":"Header oil pressure, before changeover"},
{"k":"read","id":"r3","role":"Technician","text":"Cooler A water-side ΔP, as found (cooler B water inlet closed)","unit":"bar","max":0.6,"sample":0.78,"hint":"Sample clean limit 0.6 bar. Above it, record the fouling in the deviation box. This job is the fix.","devSample":"As found above the clean limit: this is the fouling this job removes. Clean cooler A ΔP is read when A returns to duty under the cooler B work order.","s":"Cooler A water-side ΔP, as found (B inlet closed)"},
{"k":"read","id":"r4","role":"Technician","text":"Cooling water inlet temperature","unit":"°C","max":36,"sample":31.5,"hint":"Shared closed cooling water (10PGB). Sample limit for cool-season work. Above it, do not change over.","s":"Cooling water inlet temp"},
{"k":"read","id":"r5","role":"Technician","text":"Cooling water outlet temperature, cooler A","unit":"°C","max":45,"sample":38.4,"hint":"Sample limit. The rise from inlet to outlet shows the cooler duty.","s":"Cooling water outlet temp, cooler A"},
{"k":"read","id":"r6","role":"Operations","text":"Temperature control valve position (open to cooler), from the control room","unit":"%","max":90,"sample":74,"hint":"In winter, fouling shows here first. Above 90 % open means no margin (A-23b).","s":"Temp control valve position (control room)"},
{"k":"photo","id":"p1","role":"Technician","img":"gauge","text":"Photograph the header pressure and temperature gauges before the changeover.","hint":"Tag number and gauge face must be readable.","s":"Photograph header pressure and temp gauges"}],"s":"Readings before work"},
{"title":"Prepare cooler B and change over (Operations hold)","items":[{"k":"chk","id":"c1","role":"Operations","text":"Open the fill valve to fill cooler B. Vent the oil side until clear oil flows with no air. Close the vent.","hint":"Watch header pressure and reservoir level while it fills. Air in cooler B can drop header pressure at changeover.","s":"Fill cooler B; vent oil side until clear; close vent"},
{"k":"chk","id":"c2","role":"Operations","text":"Open the cooler B water inlet slowly. Vent the water side until water flows with no air.","hint":"Touch no other cooling water valve. The header serves all three GTs.","s":"Open cooler B water inlet slowly; vent water side"},
{"k":"hold","id":"h1","role":"Operations","text":"Shift charge engineer approves the changeover. GT1 is at steady load with no alarms.","hint":"No other lube oil work or tests on GT1 during this job. Only Operations can release this hold.","s":"Shift charge engineer approves the changeover"},
{"k":"chk","id":"c3","role":"Operations","text":"Field operator removes the locking pin, turns the transfer valve slowly and fully to cooler B, and refits the pin.","hint":"A technician reads the local header gauge aloud by radio. If pressure nears 1.5 bar g, turn back to A.","s":"Field operator: unpin, turn valve slowly, fully to B, re-pin"},
{"k":"read","id":"r7","role":"Operations","text":"Lowest header oil pressure seen during the changeover","unit":"bar g","min":1.5,"sample":1.66,"hint":"Sample stop value 1.5 bar g. Note any alarm.","s":"Lowest header oil pressure during changeover"},
{"k":"chk","id":"c4","role":"Operations","text":"Watch for 15 minutes on cooler B. Header and bearing temperatures must stay steady, with no alarms.","hint":"This is the last point to go back. Once cooler A is isolated, cooler B carries the load alone.","s":"Watch cooler B 15 min: temps steady, no alarms"}],"s":"Change over to cooler B"},
{"title":"Isolate, prove and open cooler A (supervisor hold)","items":[{"k":"chk","id":"c5","role":"Operations","text":"Close the fill valve and the cooler A water inlet and outlet. Lock and tag every point on ISO-26-0388.","hint":"Check each valve tag against the certificate. Close only the cooler A valves.","s":"Close only cooler A valves; lock and tag every point"},
{"k":"chk","id":"c6","role":"Technician","text":"Each crew member fits a personal lock and tag on the isolation.","s":"Each crew member fits a personal lock and tag"},
{"k":"photo","id":"p2","role":"Technician","img":"loto","text":"Photograph the locks and tags on the cooler A oil and water isolation valves.","s":"Photograph locks and tags on cooler A valves"},
{"k":"chk","id":"c7","role":"Technician","text":"Open the vents and drains. Drain the oil side to a clean drum and the water side to drain.","hint":"Use drip trays. Label the drum: used oil, GT1 cooler A.","s":"Open vents and drains; drain oil to a clean drum"},
{"k":"hold","id":"h2","role":"Supervisor","text":"With the field operator, prove the isolation: drains open, no further flow, zero pressure on both sides.","hint":"Oil still flowing means the transfer valve is passing: stop. Plates below 45 °C (sample) before any bolt is loosened.","s":"Supervisor proves zero pressure and no flow, both sides"},
{"k":"chk","id":"c8","role":"Technician","text":"Measure the plate pack length. Paint a diagonal line across the plates, then open the frame.","hint":"The painted line shows the plate order. Loosen the tie bolts evenly, a little at a time.","s":"Measure plate pack, paint diagonal line, open frame"}],"s":"Isolate and open cooler A"},
{"title":"Clean and inspect cooler A","items":[{"k":"choice","id":"ch1","role":"Technician","text":"As-found condition of the water side","opts":["Clean","Light film","Moderate deposit","Heavy deposit or blocked channels","Oil traces on the water side"],"warn":["Heavy deposit or blocked channels","Oil traces on the water side"],"sample":"Moderate deposit","hint":"Oil on the water side means a plate or gasket leak.","s":"Water side, as found","optsS":["Clean","Light film","Moderate deposit","Heavy or blocked","Oil on water side"]},
{"k":"photo","id":"p3","role":"Technician","img":"plates-dirty","text":"Photograph the plates as found, before cleaning.","hint":"Show the worst plate and the colour of the deposit.","s":"Photograph plates as found, before cleaning"},
{"k":"chk","id":"c9","role":"Technician","text":"Clean the water side of each plate with the water jet and a soft brush. Keep the plates in order.","hint":"No wire brushes or scrapers. Jet pressure per the cooler maker's limit. Do not jet straight at gaskets.","s":"Jet-clean water side with soft brush; keep plate order"},
{"k":"chk","id":"c10","role":"Technician","text":"Dry every plate. Wipe the oil-side faces with lint-free cloths until no water or dirt remains.","hint":"Water left on the oil side reaches the bearings at the next changeover (FM-25).","s":"Dry every plate; wipe oil side until no water or dirt"},
{"k":"choice","id":"ch2","role":"Technician","text":"Gasket and plate inspection","opts":["All good, reused","A few gaskets replaced","Full gasket set replaced","Plate cracked, holed or corroded"],"warn":["Plate cracked, holed or corroded"],"sample":"A few gaskets replaced","hint":"Replace any gasket that is hard, cracked, flattened or loose in its groove.","s":"Gaskets and plates","optsS":["All good, reused","A few gaskets replaced","Full set replaced","Plate cracked/holed/corroded"]},
{"k":"text","id":"t1","role":"Technician","req":false,"text":"Note the plate numbers with new gaskets, and any damage or other finding.","sample":"Plates 17 and 18: gaskets hard and flattened. Replaced with two single gaskets 40-13002. Full set 40-13001 not used.","s":"Note plates with new gaskets and any damage"},
{"k":"photo","id":"p4","role":"Technician","img":"plates-clean","text":"Photograph the plates after cleaning, before close-up.","s":"Photograph plates after cleaning, before close-up"}],"s":"Clean and inspect cooler A"},
{"title":"Close up and test cooler A (witness hold)","items":[{"k":"chk","id":"c11","role":"Technician","text":"Hang the plates back in order; the painted line must be unbroken. Tighten the bolts evenly in steps.","hint":"Tighten diagonally, a little at a time, to keep the frame plates parallel.","s":"Rehang plates in order (line unbroken); tighten evenly"},
{"k":"read","id":"r8","role":"Technician","text":"Plate pack length after tightening","unit":"mm","min":610,"max":615,"sample":612,"hint":"Sample range from the nameplate. Measure top and bottom. Never tighten below the minimum.","s":"Plate pack length after tightening"},
{"k":"hold","id":"h3","role":"Supervisor","text":"Supervisor checks the plate pack length and the test set-up, then witnesses the oil-side pressure test.","hint":"Clean filtered oil only. Test pressure from the cooler data sheet. Keep the water-side drain open.","s":"Supervisor checks set-up, witnesses oil-side test"},
{"k":"chk","id":"c12","role":"Technician","text":"Fill and vent the oil side with the hand pump. Raise it to the test pressure and hold for 15 minutes.","s":"Fill and vent oil side; hold test pressure 15 min"},
{"k":"read","id":"r9","role":"Supervisor","text":"Pressure drop during the 15-minute test hold","unit":"bar","max":0.1,"sample":0.03,"hint":"Sample limit.","s":"Pressure drop over the 15-min hold"},
{"k":"chk","id":"c13","role":"Supervisor","text":"Confirm no external leaks and no oil at the water-side drain.","hint":"Oil at that drain means a plate or gasket cross-leak: the test fails. Fix it and test again.","s":"Confirm no external leaks, no oil at water drain"}],"s":"Close up and test cooler A"},
{"title":"Return cooler A as clean standby (Operations hold)","items":[{"k":"chk","id":"c14","role":"Technician","text":"Each crew member removes their personal lock. Remove tools, rags and drip trays from the cooler.","hint":"The supervisor checks that nothing is left inside the frame.","s":"Each crew member removes own lock; clear tools and rags"},
{"k":"hold","id":"h4","role":"Operations","text":"Shift charge engineer accepts cooler A for return as standby. Test passed, crew clear, personal locks off.","hint":"The transfer valve stays on cooler B, with the pin locked.","s":"Shift charge engineer accepts A back as standby"},
{"k":"chk","id":"c15","role":"Operations","text":"Remove the isolation locks. Open the fill valve and fill cooler A slowly. Vent until clear oil flows.","hint":"Watch header pressure and reservoir level. Top up the reservoir through the filter cart.","s":"Remove isolation locks; fill cooler A slowly and vent"},
{"k":"chk","id":"c16","role":"Operations","text":"Fill and vent the cooler A water side. Leave it in the standby set-up: inlet closed, outlet open.","hint":"Top up the cooling water expansion tank if needed. Then cancel ISO-26-0388.","s":"Fill and vent A water side; inlet closed, outlet open"},
{"k":"chk","id":"c17","role":"Technician","text":"After 30 minutes at system pressure, check cooler A for oil or water leaks.","hint":"Check the frame edges, vents and drains. Report any drip at once.","s":"After 30 min at pressure, check cooler A for leaks"},
{"k":"read","id":"r10","role":"Technician","text":"Header oil temperature after the job (cooler B on duty)","unit":"°C","min":49,"max":58,"sample":54.4,"hint":"Same sample limits as before.","s":"Header oil temp, after job (B on duty)"},
{"k":"read","id":"r11","role":"Technician","text":"Header oil pressure after the job","unit":"bar g","min":1.5,"max":1.9,"sample":1.71,"hint":"Same sample band as before.","s":"Header oil pressure, after job"},
{"k":"read","id":"r12","role":"Technician","text":"Cooler B water-side ΔP on duty (cooler A water inlet closed)","unit":"bar","max":0.6,"sample":0.52,"hint":"Baseline for the cooler B job. Clean cooler A ΔP is read when A returns to duty.","s":"Cooler B water-side ΔP on duty (A inlet closed)"},
{"k":"read","id":"r13","role":"Operations","text":"Temperature control valve position after the job (cooler B on duty)","unit":"%","max":90,"sample":71,"hint":"Same sample limit as before. Compare with the as-found value.","s":"Temp control valve position, after job"},
{"k":"chk","id":"c18","role":"Technician","text":"Clean the area and remove the barriers. Label used oil and drained cooling water for disposal.","hint":"Ask the chemistry lab before disposing of treated cooling water. Return unused spares.","s":"Clean up, remove barriers, label used oil and water"}],"s":"Return A as clean standby"}],"signoff":[{"role":"Technician","what":"All steps were done as written. Readings are true. Tools, rags and personal locks are removed.","s":"Steps done as written; readings true; locks and tools off"},
{"role":"Supervisor","what":"Work quality is checked and the pressure test was witnessed. Spares used are booked and unused spares returned. The area is clean.","s":"Work checked, test witnessed, spares booked, area clean"},
{"role":"Operations (shift charge engineer)","what":"Cooler A is full, vented, leak-free and ready as clean standby. Cooler B is on duty with the pin locked. ISO-26-0388 is cancelled. The unit is normal.","s":"A ready as standby; B on duty, pinned; isolation cancelled"},
{"role":"Reliability engineer","what":"Readings are checked against limits and the trend. Findings are coded to FM-23. The next due date is set.","s":"Readings checked vs limits and trend; next due date set"}],"feedback":"On close-out, the after-job header temperature updates condition point CM-MBV-01 (margin to the high-temperature alarm). The ΔP, valve position, deposit and gasket findings go into the 11MBV30AC001 history, coded to FM-23. At the yearly FMEA review, this history confirms or changes the A-23a interval. With A-23c, it supports the L 4→2 target.","short":"GT1: clean lube oil cooler A while running, pre-summer","overview":{"what":"Switch GT1 lube oil to cooler B, then clean, test and return cooler A as clean standby.","why":"Removes cooler fouling before the 50 °C summer. GT1 keeps running: a wrong valve step can trip it.","done_when":"Cooler A clean, tested, leak-free on standby; cooler B on duty, pin locked; isolation cancelled."},"permitsShort":[{"no":"PTW-26-1142","s":"Permit to work: online clean, cooler A"},
{"no":"ISO-26-0388","s":"Isolation: cooler A oil and water sides"}],"feedbackShort":"Results update the cooler history and condition point CM-MBV-01, and confirm or change this job's interval at the yearly review."}];
// Minimal XLSX writer: stored (uncompressed) zip, inline strings, one bold header style.
// sheets: [{name, rows:[[cell,...],...], widths:[chars,...]}]; cells are strings or numbers.
function makeXlsx(sheets){
  const enc = new TextEncoder();
  const x = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const col = n => { let s=""; n++; while(n){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  const sheetXml = sh => {
    const cols = (sh.widths||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
    const rows = sh.rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
      const ref = col(ci)+(ri+1), st = ri===0?' s="1"':' s="2"';
      if(typeof v==="number" && isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
      if(v===null||v===undefined||v==="") return `<c r="${ref}"${st}/>`;
      return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join("")+`</row>`).join("");
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols?`<cols>${cols}</cols>`:""}<sheetData>${rows}</sheetData>${sh.rows.length>1?`<autoFilter ref="A1:${col(sh.rows[0].length-1)}${sh.rows.length}"/>`:""}</worksheet>`;
  };
  const files = [
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets>${sheets.map((s,i)=>s.rows.length>1?`<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${x(s.name.slice(0,31))}'!$A$1:$${col(s.rows[0].length-1)}$${s.rows.length}</definedName></definedNames>`:"").join("").replace(/<\/definedNames><definedNames>/g,"")}</workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],

/* ================= 02 WORKED EXAMPLE ================= */
function exampleSteps(f) {
  const pm = f.acts.filter(recurring), dc = f.acts.filter(x => x.type === "Design" || x.type === "Spares");
  const sev = SEV[f.cs - 1], lik = LIK[f.co - 1], W = f.walk || {};
  return [
    { t: "Pick the equipment and its job", rows: ["asset", "fn"], html: `<p>${esc(W.asset || `We start from the asset register: ${f.eq} on gas turbine 1, tag ${f.tag}.`)}</p><p>${esc(W.fn || "The function has a standard we can measure, so we can tell when it has failed.")}</p>` },
    { t: "Ask how it can fail, and why", rows: ["mode", "cause"], html: `<p>${esc(W.mode || "A failure mode is any way the equipment stops meeting its standard.")}</p><p>${esc(W.cause || "We record the cause because the fix depends on it.")}</p>` },
    { t: "Describe what happens", rows: ["effect"], html: `<p>${esc(W.effect || "We write the effect in the owner's terms: megawatts, days, money and safety.")}</p>` },
    { t: "Check how we would know", rows: ["det", "ctrl"], html: `<p>${esc(W.det || "Detection asks whether there is a warning in time to act.")}</p>` },
    { t: "Score it", rows: ["score"], html: `<p><b>Severity ${f.cs} (${esc(sev.name)}).</b> ${esc(W.s || f.sBasis || sev.prod)}</p><p><b>Likelihood ${f.co} (${esc(lik.name)}).</b> ${esc(W.o || lik.unit)}</p><p><b>Detection ${f.cd} (${esc(DET[f.cd - 1].name)}).</b> ${esc(W.d || DET[f.cd - 1].txt)}</p><p>On the owner's matrix, severity ${f.cs} with likelihood ${f.co} is <b>${f.band}</b>. RPN = ${f.cs} × ${f.co} × ${f.cd} = ${f.rpn}.</p>` },
    { t: "Compare with the owner's tolerance", rows: ["matrix"], html: `<p>${f.above ? `${f.band} is at or above the owner's tolerance line (${esc(tolText())}). The owner has said this risk is not acceptable without action. The ${esc(BANDS[f.band].auth)} owns the decision.` : `${f.band} is below the current tolerance line. With this setting the owner accepts it under today's controls and the actions become optional. Change <b>Owner acts on</b> at the top to see the plan change.`}</p><div style="margin-top:12px;max-width:320px">${matrixHtml({ small: true, pin: [f.cs, f.co], interactive: false })}</div>` },
    { t: "Decide what is worth doing", rows: ["acts"], html: `<p>${esc(W.acts || "Each action targets a cause or gives earlier warning.")}</p><p class="small" style="margin-top:8px">Every action says which lever it pulls: likelihood (prevent it), detection (see it coming) or severity (make it less serious).</p>` },
    { t: "Check what risk is left", rows: ["residual"], html: `<p>With the actions in place the expected risk is severity ${f.rS} × likelihood ${f.rO}: <b>${f.rband}</b>${isAbove(f.rband) ? `, still at or above the line, so the ${esc(BANDS[f.rband].auth)} must sign an acceptance or fund more.` : ", below the tolerance line."}</p><p>${esc(W.residual || "The remaining risk is written down, so accepting it is a decision.")}</p>` },
    { t: "Let the CMMS do the rest", rows: ["cmms"], html: `<p>Each recurring action becomes a PM record on all three units, with its interval, craft and hours. The CMMS raises the work orders on time and keeps the link back to this failure mode. A trend that crosses its limit raises a work order by itself.</p>${pm[0] ? woHtml(pm[0], UNITS[0], { compact: true }) : ""}${dc.length ? `<p style="margin-top:12px">The design change goes to the change register: ${dc.map(d => `<b>${esc(d.no)}</b> ${esc(d.title)}`).join("; ")}. <button type="button" class="lk" data-go="design">Design changes</button></p>` : ""}<p style="margin-top:10px">On GT3 the trend has already crossed its action limit, so the CMMS raised a work order: <button type="button" class="lk" data-wo="WO-2026-10517">WO-2026-10517</button>.</p>` },
  ];
}
function worksheetHtml(f, show, now) {
  const rows = [
    ["asset", "Asset", `${esc(f.eq)} · <span class="mono">${esc(f.tag)}</span> · ${esc(SYS[f.sys].name)}`],
    ["fn", "Function", esc(f.fn)],
    ["mode", "Failure mode", `<b>${esc(f.mode)}</b>`],
    ["cause", "Cause", esc(f.cause)],
    ["effect", "Effect", `${esc(f.local)}<br><b>Plant:</b> ${esc(f.plant)}`],
    ["det", "Detection today", esc(f.det)],
    ["ctrl", "Prevention today", esc(f.ctrl)],
    ["score", "Score", `S ${f.cs} · L ${f.co} · D ${f.cd} → ${pill(f.band)} · RPN ${f.rpn}`],
    ["matrix", "Owner matrix", f.above ? `At or above the tolerance line: action is mandatory` : `Below the tolerance line: accepted under current controls`],
    ["acts", "Actions", f.acts.map(a => `<div style="margin-bottom:4px">${typeTag(a.type)} ${esc(a.title)} <span class="small">· ${esc(fq(a).label)}</span></div>`).join("")],
    ["residual", "Residual risk", `S ${f.rS} · L ${f.rO} · D ${f.rD} → ${pill(f.rband)}`],

}

/* ================= 03 ASSETS ================= */
function critOf(tag) {
  const fms = FM.filter(f => f.tag === tag); if (!fms.length) return EQI[tag]?.crit || "C";
  const m = Math.max(...fms.map(f => f.s)); const hid = fms.some(f => f.hidden && f.s >= 4);
  return m >= 4 || hid ? "A" : m === 3 ? "B" : "C";
}
function renderAssets() {
  const sysLi = list => list.map(s => {
    const n = FM.filter(f => f.sys === s.k);
    const eqs = EQUIP.filter(e => e.sys === s.k).map(e => { const m = FM.filter(f => f.tag === e.tag).length, c = critOf(e.tag);
      const name = `<span class="nm">${esc(e.name)}</span>`;
      return `<li><div class="eqrow"><span class="tagno">${esc(e.tag)}${e.qty ? ` ×${e.qty}` : ""}</span><span class="crit ${c}" title="Criticality ${c}">${c}</span><span class="meta">${m ? `<button type="button" class="nb" data-eq="${esc(e.tag)}">${name}</button>` : name}${e.oem ? `<span class="cnt">GE ${esc(e.oem)}</span>` : ""}<span class="cnt">${m ? `${m} failure mode${m > 1 ? "s" : ""}` : "no failure mode at this level"}</span></span></div></li>`; }).join("");
    return `<li><details${s.k === "LO" ? " open" : ""}><summary><span class="node"><span class="tagno">${esc(s.code)}</span><span class="meta"><b class="nm">${esc(s.name)}</b><button type="button" class="lk small" data-sys="${s.k}">${n.length} failure mode${n.length === 1 ? "" : "s"} →</button></span></span></summary><ul>${eqs}</ul></details></li>`;
  }).join("");
  const unitSys = SYSTEMS.filter(s => !String(s.code).startsWith("10")), blockSys = SYSTEMS.filter(s => String(s.code).startsWith("10"));
  $("#mod-assets").innerHTML = `

  <div class="grid g2 stack top-al">

        <li><details open><summary><span class="node"><span class="tagno">11</span><span class="meta"><b>GT1 train: 9FA, generator, auxiliaries</b><span class="cnt">analysed · ${fmt(UNITS[0].ffh)} FFH · ${fmt(UNITS[0].fs)} FS</span></span></span></summary><ul>${sysLi(unitSys)}</ul></details></li>
        <li><div class="node"><span class="tagno">12</span><span class="meta">GT2 train <span class="cnt">same template · ${fmt(UNITS[1].ffh)} FFH · ${fmt(UNITS[1].fs)} FS</span></span></div></li>
        <li><div class="node"><span class="tagno">13</span><span class="meta">GT3 train <span class="cnt">same template · ${fmt(UNITS[2].ffh)} FFH · ${fmt(UNITS[2].fs)} FS</span></span></div></li>
        ${blockSys.length ? `<li><details><summary><span class="node"><span class="tagno">10</span><span class="meta"><b>Block-common plant serving all three GTs</b><span class="cnt">one fault here can stop all three units</span></span></span></summary><ul>${sysLi(blockSys)}</ul></details></li>` : ""}

        <li><div class="node"><span class="tagno">00</span><span class="meta">Station common: gas receiving, distillate storage, fire water, water treatment <span class="cnt">next phase</span></span></div></li>

        <p class="small" style="margin-top:8px">Duty assumed for the plan, per unit-year: ${fmt(DUTY.ffh)} fired hours, ${DUTY.starts} starts, ${DUTY.trips} trips. All scores are sample values for discussion.</p></div>

const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + Math.round(n)); return d.toISOString().slice(0, 10); };

/* ================= 08 RISK ACCEPTANCE ================= */
function renderAccept() {

  const asis = FM.filter(f => !f.above && f.acts.length).sort((a, b) => b.rank - a.rank);
  const none = FM.filter(f => !f.acts.length);
  const tbl = (rows, cols, fn) => `<div class="tw in"><table><thead><tr>${cols.map(c => `<th${c[1] ? ` class="${c[1]}"` : ""}>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(fn).join("") || `<tr><td colspan="${cols.length}" class="small">None at this tolerance line.</td></tr>`}</tbody></table></div>`;
  $("#mod-accept").innerHTML = `
  <div class="modhead"><div><div class="eyebrow">Step 4 · Output</div>${H1("accept", "Risk acceptance register")}<p>No plant runs at zero risk. This register lists every risk that remains, who has the authority to accept it, and why it cannot sensibly go lower. Signing it turns an unknown risk into a managed decision.</p></div></div>
  <div class="card mb"><div class="cardhead"><h2 class="sec">Needs a signed decision <span class="small">· ${signed.length}</span></h2><p class="small">Still at or above the tolerance line once every required action is done. For severity-5 hazards, maintenance makes them rarer and easier to see, not less serious. The Plant Manager accepts each High one as ${T("ALARP")} for 12 months, or funds a further change.</p></div>
  ${tbl(signed, [["ID"], ["Failure mode"], ["Residual"], ["Who signs", "c-int"], ["Why it cannot reasonably go lower", "c-why"], ["Record", "c-type"]], (f, i) => `<tr class="cur"><td>${fmLink(f)}</td><td>${esc(f.mode)}<div class="small">${esc(SYS[f.sys].name)}</div><div class="small m-only">${esc(f.why || "")}</div></td><td class="nowrap">${pill(f.rband)}${sxl(f.rS, f.rO)}</td><td class="c-int">${esc(BANDS[f.rband].auth)}<div class="small">valid to Oct 2027</div></td><td class="c-why">${esc(f.why || "Severity is set by the physics of the failure; the actions make it rarer and easier to see.")}</td><td class="mono small c-type nowrap">RA-26-${String(i + 1).padStart(3, "0")}<div>awaiting signature</div></td></tr>`)}</div>
  <div class="card mb"><div class="cardhead"><h2 class="sec">Reduced below the line <span class="small">· ${medRes.length}</span></h2><p class="small">Were above the line; after their actions they are tolerable. The ${esc(BANDS.Medium.auth)} (Medium) or ${esc(BANDS.Low.auth)} (Low) confirms them at the yearly FMEA review.</p></div>
  ${tbl(medRes, [["ID"], ["Failure mode"], ["Today → residual"], ["Note", "c-why"]], f => `<tr><td>${fmLink(f)}</td><td>${esc(f.mode)}<div class="small">${esc(f.eq)}</div></td><td class="nowrap">${pill(f.band)}<span class="arrow">→</span>${pill(f.rband)}</td><td class="small c-why">${esc(f.why || "")}</td></tr>`)}</div>
  <div class="card mb"><div class="cardhead"><h2 class="sec">Accepted as they are, below the line <span class="small">· ${asis.length}</span></h2><p class="small">At the current line the owner keeps these under existing controls and does not fund the optional actions. Make the line stricter and they move into the plan.</p></div>
  ${tbl(asis, [["ID"], ["Failure mode"], ["Risk today"], ["Who accepts", "c-int"], ["Today's controls", "c-why"]], f => `<tr><td>${fmLink(f)}</td><td>${esc(f.mode)}<div class="small">${esc(f.eq)}</div></td><td class="nowrap">${pill(f.band)}${sxl(f.cs, f.co)}</td><td class="c-int">${esc(BANDS[f.band].auth)}</td><td class="small c-why">${esc(f.ctrl)}</td></tr>`)}</div>

/* ================= 09 CONDITION MONITORING ================= */
function cmStatus(p, v) {
  if (p.pending || v == null) return "pending";
  const geIso = (a, b) => String(a).split("/").some((x, i) => +x >= +String(b).split("/")[i]);
  if (p.uom === "ISO 4406") return geIso(v, p.ua) ? "act" : geIso(v, p.uw) ? "warn" : "ok";
  if ((p.ua != null && v >= p.ua) || (p.la != null && v <= p.la)) return "act";
  if ((p.uw != null && v >= p.uw) || (p.lw != null && v <= p.lw)) return "warn";
  return "ok";
}
const ST_TXT = { ok: "Normal", warn: "Warning", act: "Action", pending: "Pending" };
const cmCells = () => CMP.flatMap(p => p.pending ? [] : Object.values(p.r || {}).map(v => cmStatus(p, v)));

function workbook() {
