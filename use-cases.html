  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script>
  // Sync tweaks across pages — read from localStorage and apply before React mounts
  try {
    const t = JSON.parse(localStorage.getItem('brilliantos-tweaks') || 'null');
    if (t) {
      if (t.palette) document.documentElement.setAttribute('data-palette', t.palette);
      if (t.display) document.documentElement.setAttribute('data-display', t.display);
      document.documentElement.setAttribute('data-theme', t.dark ? 'dark' : 'light');
      document.addEventListener('DOMContentLoaded', () => {
        if (t.density) document.body.setAttribute('data-density', t.density);
      });
    }
  } catch(e){}
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const USE_CASES_FULL = [

        kpi: { v: '+5.2pts', k: 'Realised margin' }
      },
      {
        id: 'quotes', n: '02',
        name: 'Quotes & Estimates',
        sub: 'Inbound RFQ to signed quote, end-to-end',
        replaces: ['Founders writing quotes on weekends', 'Estimators copying line items', 'Margin lost to old prices'],
        does: [
          'Parses inbound RFQ across email, web form, and PDF',
          'Selects line items at correct margin from live ERP',
          'Drafts the proposal in your house voice',
          'Routes for one-tap approval, then sends + files'
        ],
        stack: ['Email', 'CRM', 'PandaDoc / DocuSign', 'BrilliantOS ERP'],
        kpi: { v: '6 min', k: 'RFQ to sent quote' }
      },
      {
        id: 'crm', n: '03',
        name: 'CRM & Pipeline',
        sub: 'Records that update themselves',
        replaces: ['Reps forgetting to log calls', 'Dead deals clogging the pipeline', 'Weekly forecast guessing'],
        does: [
          'Captures every email, call, and form submission as a record',
          'Enriches contacts and companies from open + paid sources',
          'Moves stages based on real signal, not a rep’s memory',
          'Runs follow-up cadences that sound human'
        ],
        stack: ['HubSpot / Pipedrive / Custom', 'Calendar', 'Slack', 'Email'],
        kpi: { v: '+8pts', k: 'Conversion to won' }
      },
      {

        name: 'Accounting & Finance',
        sub: 'AR, AP, GL coding, 13-week cash forecast',
        replaces: ['Bookkeeper backlog', 'AR chasing nobody owns', 'Cash-flow forecast in a stale spreadsheet'],

        ],

        id: 'pm', n: '05',
        name: 'Project Management',
        sub: 'Scope, schedule, RFIs, daily logs',

    function UseCasesHero() {
      return (
        <section className="section no-rule" style={{ paddingTop: 80, paddingBottom: 60, position: 'relative', overflow: 'hidden' }}>

    function UseCaseRow({ u, i }) {

                    <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: 10 }} className="small">

                        <li key={r} style={{ display: 'grid', gridTemplateColumns: '14px 1fr', gap: 8, color: 'var(--ink-2)' }}>

                      ))}
                    </ul>
                  </div>
                  <div>
                    <div className="mono tiny" style={{ letterSpacing: '.1em', marginBottom: 14, color: 'var(--accent)' }}>WHAT IT DOES</div>
                    <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'grid', gap: 10 }} className="small">
